[package]
name = "batch-convert"
version = "0.1.0"
edition = "2021"
description = "Batch converter CLI tool for HWP/HWPX files with parallel processing"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.4"
regex = "1.10"
chrono = "0.4"
which = "6.0"

[[bin]]
name = "batch-convert"
path = "src/main.rs"
