[package]
name = "llm-verifier-verdict-protocol"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "LLM-as-verifier single protocol: pass/fail from rhwp exit codes and existing JSON envelopes only"

[lib]
name = "llm_verifier_verdict_protocol"
path = "src/lib.rs"

[[bin]]
name = "vproto-classify"
path = "src/bin/vproto_classify.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
