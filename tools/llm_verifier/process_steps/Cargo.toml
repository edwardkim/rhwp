[package]
name = "llm-verifier-process-steps"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "LLM-as-verifier process reward: per-edit-step mechanical checks from existing rhwp envelopes"

# 루트 워크스페이스에 넣지 않는다. 다른 V-* 축과 Cargo.toml 소유를 겹치지 않기 위함.
[workspace]

[lib]
name = "llm_verifier_process_steps"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
