name: rhwp autofix bot

# 30분마다 upstream devel 을 훑어 '증명 가능한' 버그 1건을 찾아 PR 로 제안한다.
# 핵심 설계: PR 을 열지 말지는 모델이 아니라 verify-gate.sh 의 종료코드가 결정한다.
#   red(수정 원복 시 테스트 실패) → green(수정 시 통과) → 회귀 0 → CI 3종 통과
# 넷 중 하나라도 실패하면 그 사이클은 조용히 버려진다. 오탐은 upstream 에 도달하지 못한다.

on:
  schedule:
    # GitHub 의 schedule 은 best-effort 다. 정시(:00/:30)는 전 세계 cron 이 몰리는 혼잡
    # 슬롯이라 수십 분씩 밀리거나 통째로 건너뛴다 — 실측으로 */30 이 95~107분 간격으로
    # 격하됐다. 한적한 분(:13/:43)으로 옮기면 같은 빈도(시간당 2회)로 지연이 크게 준다.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게이트까지만 돌리고 이슈/PR 은 만들지 않음"
        type: boolean
        default: true
      mode:
        description: "탐색 모드 (auto | diff | module)"
        type: string
        default: auto
      max_open_prs:
        description: "PR 큐 상한 임시 override (비우면 기본값 4)"
        type: string
        default: ""

# 한 사이클(전체 회귀 포함)은 30분을 넘길 수 있다.
# 직렬화해서 겹치지 않게 하고, 대기 중이던 run 은 GitHub 이 알아서 1건만 남긴다 = 자동 throttle.
concurrency:
  group: rhwp-autofix
  cancel-in-progress: false

env:
  UPSTREAM: edwardkim/rhwp
  FORK: ${{ github.repository }}
  RUST_TOOLCHAIN: "1.93.1"
  # 내 계정으로 upstream 에 열려 있는 PR 이 이 수 이상이면 이번 사이클은 제출하지 않는다.
  # (메인테이너가 PR 큐 폭주로 30건 일괄 close 한 이력이 있어 상한을 둔다)
  MAX_OPEN_PRS: "4"
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────────────────────────────────────────
  # 1) 이번 사이클을 돌릴 가치가 있는지 먼저 판단 — 대부분 여기서 끝난다
  # ───────────────────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # upstream 은 공개 저장소라 조회는 기본 GITHUB_TOKEN 으로 충분하다.
    # PAT 는 실제로 upstream 에 쓰는 마지막 두 스텝에서만 쓴다 (최소 권한).
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      hunt_mode: ${{ steps.decide.outputs.hunt_mode }}
      hunt_range: ${{ steps.decide.outputs.hunt_range }}
      hunt_target: ${{ steps.decide.outputs.hunt_target }}
      exclude: ${{ steps.decide.outputs.exclude }}
    steps:
      - name: upstream devel 최신 상태 조회
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE_INPUT: ${{ inputs.mode || 'auto' }}
        run: |
          set -euo pipefail

          # 최근 12시간 devel 커밋 — 새로 유입된 회귀가 가장 가치 높은 표적
          SINCE=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENT=$(gh api "repos/${UPSTREAM}/commits?sha=devel&since=${SINCE}&per_page=100" --jq 'length')
          HEAD_SHA=$(gh api "repos/${UPSTREAM}/commits/devel" --jq '.sha')
          echo "최근 12h 커밋: ${RECENT}건, HEAD=${HEAD_SHA:0:8}"

          if [ "$MODE_INPUT" = "module" ] || { [ "$MODE_INPUT" = "auto" ] && [ "$RECENT" -eq 0 ]; }; then
            # 새 커밋이 없으면 모듈을 순회한다 (run 번호로 회전 — 같은 곳만 계속 보지 않게)
            MODULES=(src/parser/hwp src/parser/hwpx src/parser/hwp3 src/renderer src/layout src/editor src/document)
            IDX=$(( ${{ github.run_number }} % ${#MODULES[@]} ))
            echo "hunt_mode=module" >> "$GITHUB_OUTPUT"
            echo "hunt_target=${MODULES[$IDX]}" >> "$GITHUB_OUTPUT"
            echo "hunt_range=" >> "$GITHUB_OUTPUT"
          else
            echo "hunt_mode=diff" >> "$GITHUB_OUTPUT"
            echo "hunt_range=--since=${SINCE}" >> "$GITHUB_OUTPUT"
            echo "hunt_target=" >> "$GITHUB_OUTPUT"
          fi

          # 중복·재탕 방지 — 열린 것뿐 아니라 '닫힌' PR/이슈 제목도 넘긴다.
          # 이미 거절당한 제안을 다시 올리는 것은 오탐과 동급의 사고다.
          {
            echo "exclude<<EOF"
            gh api "search/issues?q=repo:${UPSTREAM}+author:${{ github.repository_owner }}&sort=updated&per_page=100" \
              --jq '.items[] | "- [" + .state + "] " + .title'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────
  # 2) 탐색 → 기계식 게이트 → (통과 시에만) 이슈 + PR
  # ───────────────────────────────────────────────────────────
  hunt:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # 포크(자기 저장소)에 작업 브랜치를 push 하기 위해
    steps:
      - name: 시크릿 준비 상태 확인
        id: secrets
        env:
          HAS_KEY: ${{ secrets.NVIDIA_API_KEY != '' }}
          HAS_PAT: ${{ secrets.RHWP_BOT_PAT != '' }}
        run: |
          echo "NVIDIA_API_KEY: ${HAS_KEY}"
          echo "RHWP_BOT_PAT  : ${HAS_PAT}"
          echo "has_key=${HAS_KEY}" >> "$GITHUB_OUTPUT"
          echo "has_pat=${HAS_PAT}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning title=시크릿 미설정::NVIDIA_API_KEY 가 없어 수정 단계를 건너뛴다. 탐지층은 그대로 동작한다."
          fi
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning title=시크릿 미설정::RHWP_BOT_PAT 가 없어 upstream 이슈/PR 생성은 건너뛴다 (classic PAT, public_repo 스코프)."
          fi

      - name: 봇 자산 체크아웃 (fork@main)
        uses: actions/checkout@v7
        with:
          path: bot

      - name: 작업 대상 체크아웃 (upstream@devel)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM }}
          ref: devel
          fetch-depth: 0
          path: work

      - name: Rust 툴체인
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Rust 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: work
          shared-key: autofix
          save-if: true

      # NVIDIA NIM 은 OpenAI 호환이라 Codex CLI 에 커스텀 프로바이더로 물릴 수 있다.
      # 키가 살아있는지, 어떤 모델이 실제로 응답하는지 먼저 실측한다 — 모델 ID 는
      # 계정/시점에 따라 달라지므로 고정하지 않고 사용 가능한 것 중에서 고른다.
      - name: NVIDIA 키 점검 + 모델 선택
        id: nim
        if: steps.secrets.outputs.has_key == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -uo pipefail
          RESP=$(curl -sS -w '\n%{http_code}' https://integrate.api.nvidia.com/v1/models \
                   -H "Authorization: Bearer ${NVIDIA_API_KEY}")
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          if [ "$CODE" != "200" ]; then
            echo "::error title=NVIDIA 인증 실패::HTTP ${CODE} — 키가 만료됐거나 잘못됐다."
            echo "$BODY" | head -5
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          COUNT=$(echo "$BODY" | jq '.data | length')
          echo "인증 성공 — 사용 가능 모델 ${COUNT}종"
          echo "--- 코딩 계열 후보 ---"
          echo "$BODY" | jq -r '.data[].id' | grep -iE 'coder|code|qwen|deepseek|kimi|nemotron|devstral|codestral' | head -30

          # ⚠ /v1/models 목록에 있다고 호출되는 게 아니다. 실측에서 kimi-k2.6 이
          #   목록에는 있는데 호출 시 404 "Not found for account" 가 났다(미할당).
          #   그래서 후보마다 1토큰짜리 실제 요청을 던져 200 이 오는 첫 모델을 쓴다.
          probe() {
            curl -sS -o /tmp/probe.json -w '%{http_code}' \
              https://integrate.api.nvidia.com/v1/chat/completions \
              -H "Authorization: Bearer ${NVIDIA_API_KEY}" -H "Content-Type: application/json" \
              -d "{\"model\":\"$1\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}"
          }

          # 선호 순위 — 크레딧이 요청 단위로 닳으므로 적은 턴에 푸는 강한 모델이 가성비다.
          echo "--- 실호출 검증 ---"
          for want in \
            "moonshotai/kimi-k2.6" \
            "deepseek-ai/deepseek-v4-pro" \
            "deepseek-ai/deepseek-v4-flash" \
            "nvidia/nemotron-3-super-120b-a12b" \
            "nvidia/nemotron-3-ultra-550b-a55b" \
            "qwen/qwen3-coder-480b-a35b-instruct" \
            "nvidia/llama-3.3-nemotron-super-49b-v1.5" \
            "mistralai/codestral-22b-instruct-v0.1" \
            "nvidia/llama-3.1-nemotron-70b-instruct"; do
            echo "$BODY" | jq -e --arg m "$want" '.data[] | select(.id==$m)' >/dev/null || continue
            CODE=$(probe "$want")
            if [ "$CODE" = "200" ]; then
              echo "  ${want} → 200 ✅"; MODEL="$want"; break
            fi
            echo "  ${want} → HTTP ${CODE} (미할당) $(jq -r '.detail // empty' /tmp/probe.json 2>/dev/null | head -c 80)"
          done

          if [ -z "${MODEL:-}" ]; then
            echo "::error title=사용 가능한 모델 없음::후보 전부 호출 실패. build.nvidia.com 에서 모델 접근 권한을 확인할 것."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "선택 모델: ${MODEL}"
          echo "model=${MODEL}" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Codex CLI 는 Responses API 만 받는데 NVIDIA NIM 은 Chat Completions 규격이라
      # 원천적으로 붙지 않는다(wire_api="chat" 지원 종료). Chat Completions 를 그대로
      # 쓰는 aider 로 간다. 모델 레지스트리에 의존하지 않도록 generic openai/ 경로를 쓴다.
      - name: aider 설치
        if: steps.nim.outputs.ok == 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet aider-chat
          aider --version

      # ── 1층: 오라클 탐지 (AI 없음, 오탐 0) ────────────────────────
      # 저장소 CLI 의 종료코드 계약(ir-diff exit 3, convert --verify exit 3/4 …)으로
      # '조용히 틀린 결과'를 찾는다. 크래시가 없어도 결함이 잡힌다.
      - name: 오라클 탐지
        id: detect
        working-directory: work
        run: |
          set -uo pipefail
          git config user.name  "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          chmod +x ../bot/.github/autofix/detect.sh
          ../bot/.github/autofix/detect.sh "$PWD" "${{ github.run_number }}" 2>&1 | tee ../detect.log
          KIND=$(grep -oE 'DETECT_KIND=[A-Za-z-]+' ../detect.log | tail -1 | cut -d= -f2)
          echo "kind=${KIND:-NONE}" >> "$GITHUB_OUTPUT"
          echo "탐지 결과: ${KIND:-NONE}"

      # ── 2층: 수정 (오라클이 찾은 건은 '고치기'만, 못 찾았으면 AI 가 '찾기') ──
      - name: 확정 결함 수정
        id: fix
        if: ${{ steps.nim.outputs.ok == 'true' && steps.detect.outputs.kind != 'NONE' }}
        working-directory: work
        env:
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_BASE: https://integrate.api.nvidia.com/v1
          MODEL: ${{ steps.nim.outputs.model }}
        run: |
          set -uo pipefail
          # run #10 사고: 모델이 유일한 턴을 "cat FINDING.md 하겠다"는 말로 소진하고 끝나
          # 사이클이 통째로 버려졌다. 읽을 파일은 전부 컨텍스트로 직접 주고(--read + 본문
          # 인라인), 산출물(AUTOFIX_RESULT.md)이 나올 때까지 최대 3턴 이어간다.
          READS=(--read FINDING.md)
          [ -f AGENTS.md ] && READS+=(--read AGENTS.md)
          [ -f CONTRIBUTING.md ] && READS+=(--read CONTRIBUTING.md)
          {
            cat ../bot/.github/autofix/fix-prompt.md
            printf '\n---\n\n## FINDING.md 전문 (파일을 다시 읽을 필요 없다 — 아래가 전부다)\n\n'
            cat FINDING.md
          } > /tmp/fix-msg.md

          run_aider() {
            aider --model "openai/${MODEL}" \
              --yes-always --no-auto-commits --no-analytics --no-gitignore \
              --no-show-model-warnings --map-tokens 1024 --edit-format diff \
              "${READS[@]}" "$@" 2>&1 | tee -a ../fix.log || true
          }

          : > ../fix.log
          run_aider --message "$(cat /tmp/fix-msg.md)"
          for TURN in 2 3; do
            [ -f AUTOFIX_RESULT.md ] && break
            echo "--- ${TURN}턴: AUTOFIX_RESULT.md 미생성 — 대화를 복원해 이어간다 ---" | tee -a ../fix.log
            run_aider --restore-chat-history \
              --message "아직 루트에 AUTOFIX_RESULT.md 가 없다. 지시서의 남은 단계(재현 → red 회귀 테스트 작성 → src/ 최소 수정 → AUTOFIX_RESULT.md 작성)를 지금 끝내라. 포기하는 경우에도 status: NO-FINDING 으로 AUTOFIX_RESULT.md 는 반드시 남겨라."
          done

      - name: 탐색 실행
        id: hunt
        if: ${{ steps.nim.outputs.ok == 'true' && steps.detect.outputs.kind == 'NONE' }}
        working-directory: work
        env:
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_BASE: https://integrate.api.nvidia.com/v1
          MODEL: ${{ steps.nim.outputs.model }}
          HUNT_MODE: ${{ needs.guard.outputs.hunt_mode }}
          HUNT_RANGE: ${{ needs.guard.outputs.hunt_range }}
          HUNT_TARGET: ${{ needs.guard.outputs.hunt_target }}
          HUNT_EXCLUDE: ${{ needs.guard.outputs.exclude }}
        run: |
          set -uo pipefail
          # 모델은 셸 환경변수를 볼 수 없다 — HUNT_* 값을 메시지 본문에 직접 인라인한다.
          # 규약 문서도 --read 로 컨텍스트에 실어 '읽으러 가는' 턴 낭비를 없앤다.
          READS=()
          [ -f AGENTS.md ] && READS+=(--read AGENTS.md)
          [ -f CONTRIBUTING.md ] && READS+=(--read CONTRIBUTING.md)
          {
            cat ../bot/.github/autofix/hunt-prompt.md
            printf '\n---\n\n## 이번 사이클 파라미터 (환경변수를 조회할 필요 없다 — 아래가 그 값이다)\n\n'
            printf -- '- HUNT_MODE: %s\n- HUNT_RANGE: %s\n- HUNT_TARGET: %s\n\n' \
              "${HUNT_MODE:-}" "${HUNT_RANGE:-}" "${HUNT_TARGET:-}"
            printf '### HUNT_EXCLUDE — 이미 올린 PR·이슈 제목 (겹치면 즉시 폐기)\n\n%s\n' \
              "${HUNT_EXCLUDE:-<없음>}"
          } > /tmp/hunt-msg.md

          run_aider() {
            aider --model "openai/${MODEL}" \
              --yes-always --no-auto-commits --no-analytics --no-gitignore \
              --no-show-model-warnings --map-tokens 1024 --edit-format diff \
              "${READS[@]}" "$@" 2>&1 | tee -a ../hunt.log || true
          }

          : > ../hunt.log
          run_aider --message "$(cat /tmp/hunt-msg.md)"
          for TURN in 2 3; do
            [ -f AUTOFIX_RESULT.md ] && break
            echo "--- ${TURN}턴: AUTOFIX_RESULT.md 미생성 — 대화를 복원해 이어간다 ---" | tee -a ../hunt.log
            run_aider --restore-chat-history \
              --message "아직 루트에 AUTOFIX_RESULT.md 가 없다. 지시서의 남은 단계(탐색 → red 테스트 → src/ 최소 수정 → AUTOFIX_RESULT.md 작성)를 지금 끝내라. 제출 기준에 못 미치면 status: NO-FINDING 으로 AUTOFIX_RESULT.md 를 남겨라."
          done

          if [ ! -f AUTOFIX_RESULT.md ]; then
            echo "::warning::AUTOFIX_RESULT.md 없음 — 탐색이 결론을 못 냄. 사이클 폐기."
            echo "status=NO-FINDING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(awk -F': ' '/^status:/{print $2; exit}' AUTOFIX_RESULT.md | tr -d ' \r')
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "탐색 결과: ${STATUS}"

          if [ "$STATUS" = "FOUND" ]; then
            echo "slug=$(awk -F': ' '/^slug:/{print $2; exit}'  AUTOFIX_RESULT.md | tr -d ' \r')" >> "$GITHUB_OUTPUT"
            {
              echo "title<<EOF"
              awk -F': ' '/^title:/{sub(/^title: /,""); print; exit}' AUTOFIX_RESULT.md
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # 오라클 경로와 AI 탐색 경로 어느 쪽이든 AUTOFIX_RESULT.md 를 남긴다 — 여기서 통합한다.
      - name: 결과 취합
        id: result
        working-directory: work
        run: |
          set -uo pipefail
          # aider 부산물(.aider.chat.history.md, 태그 캐시 등)을 여기서 지운다.
          # 남겨두면 게이트의 '허용 범위 밖 변경(STRAY)' 검사에 걸려 진짜 수정도 탈락한다.
          rm -rf .aider*
          if [ ! -f AUTOFIX_RESULT.md ]; then
            echo "status=NO-FINDING" >> "$GITHUB_OUTPUT"
            echo "산출물 없음 — 이번 사이클 폐기."
            exit 0
          fi
          STATUS=$(awk -F': ' '/^status:/{print $2; exit}' AUTOFIX_RESULT.md | tr -d ' \r')
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "경로=${{ steps.detect.outputs.kind }} / 결과=${STATUS}"
          if [ "$STATUS" = "FOUND" ]; then
            echo "slug=$(awk -F': ' '/^slug:/{print $2; exit}' AUTOFIX_RESULT.md | tr -d ' \r')" >> "$GITHUB_OUTPUT"
            {
              echo "title<<EOF"
              awk '/^title:/{sub(/^title: /,""); print; exit}' AUTOFIX_RESULT.md
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 결론 없음 — 조용히 종료
        if: steps.result.outputs.status != 'FOUND'
        run: |
          echo "::notice::이번 사이클은 제출 기준을 넘는 결함을 찾지 못했다. 정상 동작이다."

      # ─── 오탐 차단의 핵심. 여기를 통과하지 못하면 upstream 에 아무것도 남지 않는다 ───
      - name: 기계식 검증 게이트 (red→green + 회귀 0 + CI 3종)
        if: steps.result.outputs.status == 'FOUND'
        run: |
          chmod +x bot/.github/autofix/verify-gate.sh
          bot/.github/autofix/verify-gate.sh "$GITHUB_WORKSPACE/work"

      # 기계식 게이트를 통과해도, 독립된 심사관이 반박을 시도한다.
      # "기대값 근거가 추측", "테스트가 동어반복", "원인이 아니라 증상을 덮음",
      # "원래 의도된 동작" 중 하나라도 걸리면 제출하지 않는다.
      - name: 반박 심사 (독립 세션)
        if: steps.result.outputs.status == 'FOUND'
        working-directory: work
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODEL: ${{ steps.nim.outputs.model }}
        run: |
          set -uo pipefail
          # 반박은 '판정'이므로 편집 에이전트를 쓰지 않는다 — 요청 1회로 끝내고,
          # 실수로 파일을 건드릴 여지도 없앤다.
          jq -n --arg m "$MODEL" \
                --arg sys "$(cat ../bot/.github/autofix/refute-prompt.md)" \
                --arg usr "$(printf '## AUTOFIX_RESULT.md\n%s\n\n## git diff\n%s\n' \
                              "$(cat AUTOFIX_RESULT.md)" "$(git diff | head -c 60000)")" \
            '{model:$m, temperature:0, max_tokens:1200,
              messages:[{role:"system",content:$sys},{role:"user",content:$usr}]}' > /tmp/refute.json

          curl -sS https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/refute.json | tee /tmp/refute_raw.json \
            | jq -r '.choices[0].message.content // "판정 없음"' | tee ../refute.log

          VERDICT=$(grep -oE 'VERDICT: (REAL|REFUTED)' ../refute.log | tail -1 || true)
          echo "판정: ${VERDICT:-<판정 없음>}"
          if [ "$VERDICT" != "VERDICT: REAL" ]; then
            grep -A2 'VERDICT:' ../refute.log | tail -5 || true
            echo "::warning::반박 심사에서 살아남지 못했다. 제출하지 않는다."
            exit 1
          fi
          echo "반박 심사 통과."

      - name: 이슈 등록 (게이트 통과 후에만)
        if: ${{ steps.result.outputs.status == 'FOUND' && inputs.dry_run != true && steps.secrets.outputs.has_pat == 'true' }}
        id: issue
        working-directory: work
        env:
          GH_TOKEN: ${{ secrets.RHWP_BOT_PAT }}
        run: |
          set -euo pipefail
          # 프론트매터를 뺀 본문만 이슈로
          awk 'f{print} /^---$/{c++} c==2 && !f{f=1}' AUTOFIX_RESULT.md > /tmp/issue_body.md
          printf '\n---\n<sub>자동 탐색으로 발견하고 red→green 회귀 테스트로 검증한 뒤 등록했습니다.</sub>\n' >> /tmp/issue_body.md

          URL=$(gh issue create --repo "$UPSTREAM" \
            --title "${{ steps.result.outputs.title }}" \
            --body-file /tmp/issue_body.md)
          N="${URL##*/}"
          echo "number=${N}" >> "$GITHUB_OUTPUT"
          echo "생성된 이슈: #${N}"

      - name: 테스트 파일 번호 확정 + 처리결과 문서
        if: ${{ steps.result.outputs.status == 'FOUND' && inputs.dry_run != true && steps.secrets.outputs.has_pat == 'true' }}
        working-directory: work
        env:
          N: ${{ steps.issue.outputs.number }}
          SLUG: ${{ steps.result.outputs.slug }}
        run: |
          set -euo pipefail
          mv "tests/issue_TBD_${SLUG}.rs" "tests/issue_${N}_${SLUG}.rs"
          sed -i "s/issue_TBD/issue_${N}/g" "tests/issue_${N}_${SLUG}.rs"

          # 이름 바꾼 뒤에도 green 인지 재확인 (파일명·모듈명 불일치 방어)
          cargo test --profile release-test --test "issue_${N}_${SLUG}"

          mkdir -p mydocs/report
          {
            echo "# ${{ steps.result.outputs.title }}"
            echo
            echo "Issue: #${N}"
            echo "브랜치: \`fix/issue-${N}\`"
            echo
            awk 'f{print} /^---$/{c++} c==2 && !f{f=1}' AUTOFIX_RESULT.md
          } > "mydocs/report/task_m100_${N}_report.md"
          # 커밋 단계가 git add -A 를 쓰므로, PR 에 섞이면 안 되는 봇 산출물은 여기서 지운다.
          rm -f AUTOFIX_RESULT.md FINDING.md

      - name: 커밋 + fork 에 push
        if: ${{ steps.result.outputs.status == 'FOUND' && inputs.dry_run != true && steps.secrets.outputs.has_pat == 'true' }}
        working-directory: work
        env:
          N: ${{ steps.issue.outputs.number }}
          # 브랜치 push 대상은 내 포크이므로 기본 GITHUB_TOKEN 으로 충분하다.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git switch -c "fix/issue-${N}"
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/${FORK}.git"
          git add -A
          git commit -m "fix: ${{ steps.result.outputs.title }} (#${N})"
          git push fork "fix/issue-${N}"

      - name: upstream 에 PR 생성
        if: ${{ steps.result.outputs.status == 'FOUND' && inputs.dry_run != true && steps.secrets.outputs.has_pat == 'true' }}
        working-directory: work
        env:
          N: ${{ steps.issue.outputs.number }}
          GH_TOKEN: ${{ secrets.RHWP_BOT_PAT }}
        run: |
          set -euo pipefail
          {
            echo "Fixes #${N}"
            echo
            sed -n '/^# /,$p' "mydocs/report/task_m100_${N}_report.md" | tail -n +2
            echo
            echo "## 검증"
            echo
            echo "| 항목 | 결과 |"
            echo "| --- | --- |"
            echo "| 수정 원복 시 신규 테스트 | **FAIL** (단정 실패로 결함 재현 확인) |"
            echo "| 수정 적용 시 신규 테스트 | **PASS** |"
            echo "| \`cargo fmt --all -- --check\` | PASS |"
            echo "| \`cargo clippy -- -D warnings\` | PASS |"
            echo "| \`cargo test --profile release-test --tests\` | PASS (회귀 0) |"
            echo
            echo "red→green 은 CI 러너에서 기계적으로 검증했습니다 — 수정분만 stash 하여"
            echo "신규 테스트가 실제로 실패하는지 확인한 뒤 복원했습니다."
          } > /tmp/pr_body.md

          gh pr create --repo "$UPSTREAM" \
            --base devel \
            --head "${{ github.repository_owner }}:fix/issue-${N}" \
            --title "fix: ${{ steps.result.outputs.title }} (#${N})" \
            --body-file /tmp/pr_body.md

      - name: 실행 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofix-log-${{ github.run_number }}
          path: |
            detect.log
            hunt.log
            fix.log
            refute.log
            work/FINDING.md
            work/AUTOFIX_RESULT.md
          if-no-files-found: ignore
          retention-days: 14
