name: Run Nextest Archive Partition

on:
  workflow_call:
    inputs:
      label:
        description: Visible worker label.
        required: true
        type: string
      count_label:
        description: Unique worker count artifact suffix.
        required: true
        type: string
      archive_label:
        description: Stable A/B archive partition label.
        required: true
        type: string
      filterset:
        description: Nextest filterset applied before partitioning.
        required: true
        type: string
      partition:
        description: Optional nextest test-case partition such as hash:1/3.
        required: false
        default: ""
        type: string

jobs:
  run:
    name: Default-feature tests (${{ inputs.label }})
    runs-on: ubuntu-latest
    # [#3284] 러너 hang을 실패로 드러내는 상한이며 성능 목표가 아니다.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # 테스트가 samples/pdf 등 저장소 fixture를 읽으므로 checkout이 필요하다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: nextest

      - name: Download shared test archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-archive-${{ github.run_id }}-${{ inputs.archive_label }}

      # [#5164] 네 worker는 동일 archive에서 서로 배타적인 filter/partition만 실행한다.
      # 집계 job은 archive runnable 수와 네 Summary run 합계를 대조한다.
      - name: Run ${{ inputs.label }}
        env:
          COUNT_LABEL: ${{ inputs.count_label }}
          FILTERSET: ${{ inputs.filterset }}
          PARTITION: ${{ inputs.partition }}
        run: |
          set -euo pipefail
          partition_args=()
          if [[ -n "${PARTITION}" ]]; then
            partition_args=(--partition "${PARTITION}")
          fi
          log="nextest-${COUNT_LABEL}.log"
          cargo nextest run \
            --archive-file tests.tar.zst \
            --workspace-remap . \
            --extract-to . \
            --filterset "${FILTERSET}" \
            "${partition_args[@]}" \
            --no-tests fail \
            2>&1 | tee "$log"
          summary=$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -E "Summary \[" | tail -1)
          run=$(echo "$summary" | grep -oE "[0-9]+ tests? run" | grep -oE "^[0-9]+")
          if [[ -z "$run" ]]; then
            echo "::error::worker ${COUNT_LABEL} summary parse failed"
            exit 1
          fi
          echo "worker=${COUNT_LABEL} filter=${FILTERSET} partition=${PARTITION:-none} run=${run}"
          echo "$run" > "shard-count-${COUNT_LABEL}.txt"
          cat "shard-count-${COUNT_LABEL}.txt"

      - name: Upload ${{ inputs.label }} count
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-count-${{ inputs.count_label }}
          path: shard-count-${{ inputs.count_label }}.txt
          retention-days: 1
          if-no-files-found: error
