name: CI

on:
  push:
    branches: [main, devel]
    tags: ['v*']
    paths-ignore:
      - 'mydocs/**'
      - 'samples/**'
      - 'pdf/**'
      - 'assets/chrome/**'
      - 'assets/edge/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  pull_request:
    branches: [main, devel]
    types: [opened, reopened, synchronize]
    paths-ignore:
      # samples는 required Build & Test를 발행해야 하므로 preflight에서
      # 신규 reference-only와 기존 자료 변경을 구분한다.
      - 'assets/chrome/**'
      - 'assets/edge/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  workflow_dispatch:
    inputs:
      release_grade:
        description: Run cold-cache-tolerant release-profile test archives.
        required: true
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

# [Task #1192 F] 같은 PR 에 새 push 가 오면 진행 중 run 을 취소해 중복 실행 제거.
# cancel-in-progress 는 PR 이벤트에서만 활성화 — devel/main push 머지 검증 run 은 보존.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trusted_postmerge_reuse:
    uses: ./.github/workflows/trusted-postmerge-ci-reuse.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      workflow_file: ci.yml
      require_duration_artifacts: true
      caller_event_name: ${{ github.event_name }}
      caller_ref: ${{ github.ref }}
      caller_sha: ${{ github.sha }}

  preflight:
    name: CI preflight
    runs-on: ubuntu-latest
    needs: [trusted_postmerge_reuse]
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      fast_pass: ${{ needs.trusted_postmerge_reuse.outputs.reuse == 'true' && 'true' || steps.finalize.outputs.fast_pass || 'false' }}
      reason: ${{ needs.trusted_postmerge_reuse.outputs.reuse == 'true' && needs.trusted_postmerge_reuse.outputs.reason || steps.finalize.outputs.reason || 'preflight-unavailable' }}
      candidate_sha: ${{ steps.finalize.outputs.candidate_sha || '' }}
      postmerge_reuse: ${{ needs.trusted_postmerge_reuse.outputs.reuse || 'false' }}
      postmerge_source_run_id: ${{ needs.trusted_postmerge_reuse.outputs.source_run_id || '' }}
      postmerge_refresh_duration_data: ${{ needs.trusted_postmerge_reuse.outputs.refresh_duration_data || 'false' }}
      # [#3790 Stage 4·5B] frontend_mode·render_required·rust_required·
      # native_skia_required는 이 workflow의 worker 조건에 사용한다. codeql_languages는
      # codeql.yml이 같은 trusted-base 판정으로 소비한다. 모든 기본값은 full lane이다.
      rust_required: ${{ steps.impact.outputs.rust_required || 'true' }}
      frontend_mode: ${{ steps.impact.outputs.frontend_mode || 'package' }}
      render_required: ${{ steps.impact.outputs.render_required || 'true' }}
      native_skia_required: ${{ steps.impact.outputs.native_skia_required || 'true' }}
      codeql_languages: ${{ steps.impact.outputs.codeql_languages || 'javascript-typescript,python,rust' }}
      classification_status: ${{ steps.impact.outputs.classification_status || 'full' }}
      classifier_version: ${{ steps.impact.outputs.classifier_version || 'unavailable' }}
      impact_reason: ${{ steps.impact.outputs.reason || 'fail-closed:impact-unavailable' }}
      impact_authority: ${{ steps.collect-impact.outputs.authority || 'unavailable' }}
      security_sweep_samples_json: ${{ steps.collect-impact.outputs.security_sweep_samples_json || '[]' }}
      # [#4029] CI test profile과 archive timeout은 한 step에서 함께 결정한다. output 부재는
      # 검증 강도를 낮추지 않도록 release/60으로 닫는다.
      test_profile: ${{ steps.test-policy.outputs.cargo_profile || 'release' }}
      test_archive_timeout_minutes: ${{ steps.test-policy.outputs.timeout_minutes || '60' }}

    steps:
      - name: Select test profile policy
        id: test-policy
        shell: bash
        env:
          RELEASE_GRADE: ${{ github.event.inputs.release_grade || 'false' }}
        run: |
          set -euo pipefail

          cargo_profile='release'
          timeout_minutes='60'
          reason='fail-closed:unexpected-event'

          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            pull_request:*)
              cargo_profile='release-test'
              timeout_minutes='30'
              reason='pull-request-regression'
              ;;
            push:refs/heads/devel)
              cargo_profile='release-test'
              timeout_minutes='30'
              reason='devel-regression'
              ;;
            push:refs/heads/main)
              reason='main-release-grade'
              ;;
            push:refs/tags/v*)
              reason='tag-release-grade'
              ;;
            workflow_dispatch:*)
              case "${RELEASE_GRADE}" in
                true)
                  reason='manual-release-grade'
                  ;;
                false|'')
                  cargo_profile='release-test'
                  timeout_minutes='30'
                  reason='manual-regression'
                  ;;
                *)
                  reason='fail-closed:invalid-release-grade-input'
                  ;;
              esac
              ;;
          esac

          printf 'cargo_profile=%s\ntimeout_minutes=%s\n' \
            "${cargo_profile}" "${timeout_minutes}" >> "${GITHUB_OUTPUT}"
          {
            echo '### CI test profile policy'
            echo
            echo '| event | ref | release_grade | cargo_profile | timeout_minutes | reason |'
            echo '| --- | --- | --- | --- | ---: | --- |'
            printf "| \`%s\` | \`%s\` | \`%s\` | \`%s\` | \`%s\` | \`%s\` |\n" \
              "${GITHUB_EVENT_NAME}" "${GITHUB_REF}" "${RELEASE_GRADE}" \
              "${cargo_profile}" "${timeout_minutes}" "${reason}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Detect review-only fast pass
        id: detect
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const allowedConclusions = new Set(['success', 'skipped', 'neutral']);
            const { owner, repo } = context.repo;
            const renderContractPaths = new Set([
              'mydocs/tech/canvaskit-parity-implementation.md',
              'mydocs/tech/text-ir-v2.md',
            ]);

            function setResult(fastPass, reason, candidateSha = '') {
              core.setOutput('fast_pass', fastPass ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.info(`fast_pass=${fastPass} reason=${reason} candidate_sha=${candidateSha}`);
            }

            function setPendingBaseMergeResult(reason, candidateSha, mergeSha, sourceParentSha) {
              core.setOutput('fast_pass', 'pending-base-merge-tree');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.setOutput('base_merge_sha', mergeSha);
              core.setOutput('source_parent_sha', sourceParentSha);
              core.info(
                `fast_pass=pending-base-merge-tree reason=${reason} candidate_sha=${candidateSha} `
                + `base_merge_sha=${mergeSha} source_parent_sha=${sourceParentSha}`,
              );
            }

            function isAllowedReviewPath(file) {
              const filename = file.filename;
              if (filename.startsWith('mydocs/') && !renderContractPaths.has(filename)) {
                return true;
              }
              if (isPdfReferencePath(filename)) {
                return file.status === 'added' || file.status === 'modified';
              }
              if (file.status !== 'added') {
                return false;
              }
              return isSampleReferencePath(filename);
            }

            function isSampleReferencePath(filename) {
              return (
                filename.startsWith('samples/')
                && (
                  filename.endsWith('.pdf')
                  || filename.endsWith('.png')
                )
              );
            }

            function isPdfReferencePath(filename) {
              const pdfPrefixes = ['pdf/'];
              return (
                pdfPrefixes.some((prefix) => filename.startsWith(prefix))
                && filename.endsWith('.pdf')
              );
            }

            function isReviewReferencePath(filename) {
              return isSampleReferencePath(filename) || isPdfReferencePath(filename);
            }

            function isReviewReferenceFile(file) {
              const filename = file.filename;
              if (isPdfReferencePath(filename)) {
                return file.status === 'added' || file.status === 'modified';
              }
              return file.status === 'added' && isSampleReferencePath(filename);
            }

            function reviewOnlyLabel(files) {
              const hasReferenceArtifact = files.some((file) => isReviewReferenceFile(file));
              return hasReferenceArtifact ? 'review-reference-only' : 'mydocs-only';
            }

            function isCurrentBaseUpdateMerge(commit, baseSha) {
              const parents = commit.parents || [];
              return parents.length === 2
                && parents.filter((parent) => parent.sha === baseSha).length === 1;
            }

            function isCiExecutionPath(filename) {
              return filename.startsWith('.github/workflows/')
                || filename.startsWith('.github/actions/')
                || filename === 'scripts/ci-impact-classifier.cjs'
                || filename === 'scripts/ci-impact-policy.cjs'
                || filename === 'scripts/verify_review_only_merge_resolution.py';
            }

            function latestRun(runs) {
              return runs
                .slice()
                .sort((a, b) => {
                  const bTime = Date.parse(b.completed_at || b.started_at || b.created_at || 0);
                  const aTime = Date.parse(a.completed_at || a.started_at || a.created_at || 0);
                  return bTime - aTime;
                })[0];
            }

            async function hasTrustedReviewReuse(pr) {
              for (let attempt = 0; attempt < 7; attempt += 1) {
                const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                  owner,
                  repo,
                  ref: pr.head.sha,
                  per_page: 100,
                });
                const latest = statuses
                  .filter((status) => status.context === 'CI Impact Policy')
                  .sort((left, right) => Number(right.id || 0) - Number(left.id || 0))[0];
                if (latest) {
                  const fields = new Map(String(latest.description || '').split(';').map((part) => {
                    const separator = part.indexOf('=');
                    return separator > 0
                      ? [part.slice(0, separator), part.slice(separator + 1)]
                      : ['', ''];
                  }));
                  const expectedFields = [
                    'v', 'cv', 'mode', 'rfp', 'wf', 'rust', 'fe', 'render', 'skia', 'ql', 'b',
                  ];
                  const target = String(latest.target_url || '').match(/\/actions\/runs\/(\d+)$/);
                  if (
                    latest.state === 'success'
                    && latest.creator?.login === 'github-actions[bot]'
                    && fields.size === expectedFields.length
                    && expectedFields.every((field) => fields.has(field))
                    && fields.get('v') === '5'
                    && fields.get('rfp') === '1'
                    && fields.get('b') === pr.base.sha
                    && target
                  ) {
                    const response = await github.rest.actions.getWorkflowRun({
                      owner,
                      repo,
                      run_id: Number(target[1]),
                    });
                    const run = response.data;
                    if (
                      run.name === 'CI Impact Policy Controller'
                      && String(run.path || '').split('@')[0] === '.github/workflows/ci-impact-policy.yml'
                      && run.event === 'pull_request_target'
                      && run.repository?.full_name === `${owner}/${repo}`
                      && !(run.status === 'completed' && run.conclusion !== 'success')
                    ) return true;
                  }
                  return false;
                }
                if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 5000));
              }
              return false;
            }

            async function buildResult(candidateSha, pr) {
              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'ci.yml',
                event: 'pull_request',
                per_page: 100,
              });
              const workflowRun = latestRun(workflowRuns.filter((run) => (
                run.path === '.github/workflows/ci.yml'
                && run.event === 'pull_request'
                && run.head_sha === candidateSha
                && run.head_branch === pr.head.ref
                && run.head_repository?.id === pr.head.repo?.id
              )));
              if (!workflowRun) {
                return { state: 'missing', reason: `missing-build-and-test:${candidateSha}` };
              }
              const runCreatedAt = Date.parse(workflowRun.created_at);
              const pullCreatedAt = Date.parse(pr.created_at);
              if (!Number.isFinite(runCreatedAt)
                || !Number.isFinite(pullCreatedAt)
                || runCreatedAt < pullCreatedAt) {
                return { state: 'failed', reason: 'ci-workflow-pr-identity-mismatch' };
              }
              if (workflowRun.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `build-and-test-workflow-not-completed:${workflowRun.status}`,
                };
              }

              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: workflowRun.id,
                filter: 'latest',
                per_page: 100,
              });
              const buildRun = latestRun(jobs.filter((job) => job.name === 'Build & Test'));
              if (!buildRun) {
                return { state: 'missing', reason: `missing-build-and-test-job:${candidateSha}` };
              }
              if (buildRun.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `build-and-test-not-completed:${buildRun.status}`,
                };
              }
              if (!allowedConclusions.has(buildRun.conclusion)) {
                return {
                  state: 'failed',
                  reason: `build-and-test-not-green:${buildRun.conclusion}`,
                };
              }
              return { state: 'green', conclusion: buildRun.conclusion };
            }

            try {
              if (context.eventName !== 'pull_request') {
                setResult(false, 'not-pull-request');
                return;
              }

              const pr = context.payload.pull_request;
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const hasCiExecutionSurfaceChange = prFiles.some((file) => (
                isCiExecutionPath(file.filename)
                || isCiExecutionPath(file.previous_filename || '')
              ));
              if (hasCiExecutionSurfaceChange && !await hasTrustedReviewReuse(pr)) {
                setResult(false, 'ci-execution-surface-change');
                return;
              }
              if (hasCiExecutionSurfaceChange) {
                core.info('trusted controller authorized enforcement-change review reuse');
              }
              if (prFiles.length > 0 && prFiles.every((file) => isAllowedReviewPath(file))) {
                core.info(`all PR files are review-only; using base SHA ${pr.base.sha}`);
                setResult(true, 'all-review-only-no-code-impact', pr.base.sha);
                return;
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });

              if (commits.length === 0) {
                setResult(false, 'no-pr-commits');
                return;
              }

              const latestCommitSha = commits.at(-1).sha;
              const { data: latestCommit } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: latestCommitSha,
              });
              if (isCurrentBaseUpdateMerge(latestCommit, pr.base.sha)) {
                if (prFiles.some((file) => isCiExecutionPath(file.filename))) {
                  setResult(false, 'current-base-source-ci-execution-change');
                  return;
                }
                const sourceParent = latestCommit.parents.find(
                  (parent) => parent.sha !== pr.base.sha,
                );
                if (!sourceParent) {
                  setResult(false, 'current-base-source-parent-unavailable');
                  return;
                }
                const sourceResult = await buildResult(sourceParent.sha, pr);
                if (sourceResult.state === 'green') {
                  setPendingBaseMergeResult(
                    `direct-source-build-and-test-green:${sourceResult.conclusion}`,
                    sourceParent.sha,
                    latestCommitSha,
                    sourceParent.sha,
                  );
                  return;
                }
                setResult(false, `direct-source-${sourceResult.reason}`, sourceParent.sha);
                return;
              }

              const reviewOnlyCandidates = [];
              let codeCandidateSha = '';
              let baseMergeBridge = null;

              for (let index = commits.length - 1; index >= 0; index -= 1) {
                const sha = commits[index].sha;
                const { data: commit } = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: sha,
                });
                const parents = commit.parents || [];
                if (isCurrentBaseUpdateMerge(commit, pr.base.sha)) {
                  if (baseMergeBridge) {
                    setResult(false, `multiple-current-base-update-merges:${sha}`);
                    return;
                  }
                  const sourceParent = parents.find((parent) => parent.sha !== pr.base.sha);
                  baseMergeBridge = { mergeSha: sha, sourceParentSha: sourceParent.sha };
                  core.info(`including current-base update merge bridge ${sha}`);
                  continue;
                }
                const files = commit.files || [];

                // The commit endpoint may truncate very large file lists. Fall back to full CI.
                if (files.length === 0 || files.length >= 300) {
                  setResult(false, `unusable-file-list:${sha}`);
                  return;
                }

                const reviewOnly = files.every((file) => isAllowedReviewPath(file));
                if (reviewOnly) {
                  if (parents.length === 1) {
                    reviewOnlyCandidates.push(sha);
                    continue;
                  }
                  setResult(false, `${reviewOnlyLabel(files)}-merge-not-reusable:${sha}`);
                  return;
                }

                codeCandidateSha = sha;
                break;
              }

              if (reviewOnlyCandidates.length === 0) {
                setResult(false, 'no-trailing-review-only-commits');
                return;
              }
              if (codeCandidateSha) {
                reviewOnlyCandidates.push(codeCandidateSha);
              }

              for (const candidateSha of reviewOnlyCandidates) {
                const result = await buildResult(candidateSha, pr);
                if (result.state === 'green') {
                  if (baseMergeBridge) {
                    setPendingBaseMergeResult(
                      `build-and-test-green:${result.conclusion}`,
                      candidateSha,
                      baseMergeBridge.mergeSha,
                      baseMergeBridge.sourceParentSha,
                    );
                    return;
                  }
                  setResult(true, `build-and-test-green:${result.conclusion}`, candidateSha);
                  return;
                }
                if (result.state === 'failed') {
                  setResult(false, result.reason, candidateSha);
                  return;
                }
                core.info(`candidate not reusable yet: ${candidateSha} (${result.reason})`);
              }

              setResult(false, 'no-green-build-candidate');
            } catch (error) {
              core.warning(`CI preflight failed; running full CI. ${error.message}`);
              setResult(false, 'preflight-error');
            }

      # 기준선 병합을 fast-pass bridge로 쓸 때는 untrusted source를 실행하지 않는다.
      # 자동 3-way merge tree가 같거나, 충돌 해소가 mydocs로 한정될 때만 재사용한다.
      - name: Check out current-base merge tree inputs
        id: checkout-base-merge-tree
        if: ${{ steps.detect.outputs.fast_pass == 'pending-base-merge-tree' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify current-base merge tree
        id: verify-base-merge-tree
        if: ${{ always() && steps.detect.outputs.fast_pass == 'pending-base-merge-tree' }}
        shell: bash
        env:
          BASE_MERGE_SHA: ${{ steps.detect.outputs.base_merge_sha }}
          SOURCE_PARENT_SHA: ${{ steps.detect.outputs.source_parent_sha }}
          CURRENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          fail() {
            printf 'verified=false\nreason=%s\n' "$1" >> "$GITHUB_OUTPUT"
          }

          if ! git cat-file -e "${BASE_MERGE_SHA}^{commit}" \
            || ! git cat-file -e "${SOURCE_PARENT_SHA}^{commit}" \
            || ! git cat-file -e "${CURRENT_BASE_SHA}^{commit}"; then
            fail 'current-base-merge-input-unavailable'
            exit 0
          fi

          if ! expected_tree="$(git merge-tree --write-tree "${SOURCE_PARENT_SHA}" "${CURRENT_BASE_SHA}" 2>/dev/null)"; then
            resolution_check="$(mktemp)"
            trap 'rm -f "${resolution_check}"' EXIT
            if ! git show "${CURRENT_BASE_SHA}:scripts/verify_review_only_merge_resolution.py" \
              > "${resolution_check}"; then
              fail 'current-base-merge-resolution-check-unavailable'
            elif resolution_reason="$(python3 "${resolution_check}" \
              --repository . --base-sha "${CURRENT_BASE_SHA}" "${BASE_MERGE_SHA}")"; then
              printf 'verified=true\nreason=%s\n' "${resolution_reason}" >> "$GITHUB_OUTPUT"
            else
              fail 'current-base-merge-resolution-not-mydocs'
            fi
            exit 0
          fi
          expected_tree="${expected_tree%%$'\n'*}"
          actual_tree="$(git show -s --format=%T "${BASE_MERGE_SHA}")"
          if [[ "${expected_tree}" != "${actual_tree}" ]]; then
            fail 'current-base-merge-tree-mismatch'
            exit 0
          fi

          printf 'verified=true\nreason=current-base-merge-tree-match\n' >> "$GITHUB_OUTPUT"

      - name: Finalize review-only fast pass
        id: finalize
        if: ${{ always() }}
        shell: bash
        env:
          DETECTED_FAST_PASS: ${{ steps.detect.outputs.fast_pass || 'false' }}
          DETECTED_REASON: ${{ steps.detect.outputs.reason || 'preflight-unavailable' }}
          CANDIDATE_SHA: ${{ steps.detect.outputs.candidate_sha || '' }}
          MERGE_TREE_VERIFIED: ${{ steps.verify-base-merge-tree.outputs.verified || 'false' }}
          MERGE_TREE_REASON: ${{ steps.verify-base-merge-tree.outputs.reason || 'not-required' }}
        run: |
          set -euo pipefail
          fast_pass="${DETECTED_FAST_PASS}"
          reason="${DETECTED_REASON}"
          if [[ "${DETECTED_FAST_PASS}" == 'pending-base-merge-tree' ]]; then
            if [[ "${MERGE_TREE_VERIFIED}" == 'true' ]]; then
              fast_pass='true'
              if [[ "${MERGE_TREE_REASON}" == 'current-base-merge-resolution-mydocs-only' ]]; then
                reason="current-base-update-merge-resolution-mydocs-only-green:${CANDIDATE_SHA}"
              else
                reason="current-base-update-merge-tree-green:${CANDIDATE_SHA}"
              fi
            else
              fast_pass='false'
              reason="${MERGE_TREE_REASON}"
            fi
          fi
          printf 'fast_pass=%s\nreason=%s\ncandidate_sha=%s\n' \
            "${fast_pass}" "${reason}" "${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"

      # [#3790 Stage 4] PR의 classifier 구현은 PR head가 아닌 base SHA에 고정한다.
      # frontend·Rust·Native Skia 축은 활성화하며 CodeQL은 Stage 5까지 관찰한다.
      - name: Check out trusted CI impact classifier
        id: checkout-impact-classifier
        if: ${{ steps.finalize.outputs.fast_pass != 'true' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci-impact-classifier.cjs
          sparse-checkout-cone-mode: false

      - name: Collect CI impact input
        id: collect-impact
        if: ${{ steps.finalize.outputs.fast_pass != 'true' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLASSIFIER_CHECKOUT_OUTCOME: ${{ steps.checkout-impact-classifier.outcome }}
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const inputPath = path.join(workspace, '.ci-impact-input.json');
            const classifierPath = path.join(
              workspace,
              'scripts',
              'ci-impact-classifier.cjs',
            );
            const checkoutSucceeded = process.env.CLASSIFIER_CHECKOUT_OUTCOME === 'success'
              && fs.existsSync(classifierPath);
            const authority = !checkoutSucceeded
              ? 'unavailable'
              : context.eventName === 'pull_request'
                ? 'pr-base-trusted'
                : 'checked-out-ref';
            core.setOutput('authority', authority);

            function securitySweepSamples(files) {
              return files
                .filter((file) => file.status === 'added')
                .map((file) => file.filename)
                .filter((filename) => (
                  filename.startsWith('samples/')
                  && /\.(hwp|hwpx|hml)$/i.test(filename)
                ))
                .sort();
            }

            function writeInput(input) {
              fs.writeFileSync(inputPath, `${JSON.stringify(input)}\n`, 'utf8');
              const samplePaths = securitySweepSamples(input.files || []);
              core.setOutput('security_sweep_samples_json', JSON.stringify(samplePaths));
              core.info(`CI impact input: event=${input.eventName} files=${input.files.length}`);
              core.info(`security_sweep_samples=${samplePaths.length}`);
            }

            function normalizedFiles(files) {
              return files.map((file) => ({
                filename: file.filename,
                previous_filename: file.previous_filename || '',
                status: file.status || 'modified',
              }));
            }

            try {
              if (context.eventName === 'pull_request') {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                writeInput({
                  eventName: context.eventName,
                  files: normalizedFiles(files),
                });
                return;
              }

              if (context.eventName === 'push') {
                if (context.ref.startsWith('refs/tags/')) {
                  writeInput({
                    eventName: context.eventName,
                    files: [],
                    forceFullReason: 'manual-or-tag',
                  });
                  return;
                }

                const before = context.payload.before || '';
                const after = context.payload.after || context.sha;
                if (!before || /^0+$/.test(before)) {
                  writeInput({
                    eventName: context.eventName,
                    files: [],
                    forceFullReason: 'push-zero-before',
                  });
                  return;
                }

                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${before}...${after}`,
                });
                writeInput({
                  eventName: context.eventName,
                  files: normalizedFiles(comparison.files || []),
                });
                return;
              }

              writeInput({
                eventName: context.eventName,
                files: [],
                forceFullReason: context.eventName === 'workflow_dispatch'
                  ? 'manual-or-tag'
                  : 'unsupported-event',
              });
            } catch (error) {
              core.warning(`CI impact file collection failed; running full. ${error.message}`);
              writeInput({
                eventName: context.eventName,
                files: [],
                forceFullReason: 'collection-error',
              });
            }

      - name: Classify CI impact
        id: impact
        if: ${{ steps.finalize.outputs.fast_pass != 'true' }}
        continue-on-error: true
        run: >-
          node scripts/ci-impact-classifier.cjs
          --input .ci-impact-input.json
          --github-output "$GITHUB_OUTPUT"

      - name: Summarize CI impact classification
        if: ${{ always() }}
        continue-on-error: true
        env:
          IMPACT_AUTHORITY: ${{ steps.collect-impact.outputs.authority || 'unavailable' }}
          RUST_REQUIRED: ${{ steps.impact.outputs.rust_required || 'true' }}
          FRONTEND_MODE: ${{ steps.impact.outputs.frontend_mode || 'package' }}
          RENDER_REQUIRED: ${{ steps.impact.outputs.render_required || 'true' }}
          NATIVE_SKIA_REQUIRED: ${{ steps.impact.outputs.native_skia_required || 'true' }}
          CODEQL_LANGUAGES: ${{ steps.impact.outputs.codeql_languages || 'javascript-typescript,python,rust' }}
          CLASSIFICATION_STATUS: ${{ steps.impact.outputs.classification_status || 'full' }}
          CLASSIFIER_VERSION: ${{ steps.impact.outputs.classifier_version || 'unavailable' }}
          IMPACT_REASON: ${{ steps.impact.outputs.reason || 'fail-closed:impact-unavailable' }}
          SECURITY_SWEEP_SAMPLES_JSON: ${{ steps.collect-impact.outputs.security_sweep_samples_json || '[]' }}
        run: |
          {
            echo '### CI impact classification'
            echo
            echo '> Stage 4 activates frontend_mode, render_required, rust_required, and native_skia_required. Stage 5B consumes codeql_languages in codeql.yml.'
            echo '> Pull requests classify with the base SHA classifier; workflow_dispatch and all failures select the full lane.'
            echo
            echo '| Axis | Value |'
            echo '| --- | --- |'
            printf '| authority | %s |\n' "${IMPACT_AUTHORITY}"
            printf '| rust_required | %s |\n' "${RUST_REQUIRED}"
            printf '| frontend_mode | %s |\n' "${FRONTEND_MODE}"
            printf '| render_required | %s |\n' "${RENDER_REQUIRED}"
            printf '| native_skia_required | %s |\n' "${NATIVE_SKIA_REQUIRED}"
            printf '| codeql_languages | %s |\n' "${CODEQL_LANGUAGES}"
            printf '| classification_status | %s |\n' "${CLASSIFICATION_STATUS}"
            printf '| classifier_version | %s |\n' "${CLASSIFIER_VERSION}"
            printf '| reason | %s |\n' "${IMPACT_REASON}"
            printf '| security_sweep_samples_json | `%s` |\n' "${SECURITY_SWEEP_SAMPLES_JSON}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # [#6205] B/C가 같은 측정 정책 commit을 보도록 CI 시작 때 한 번만 SHA를 고정한다.
  # 데이터 브랜치가 아직 없거나 조회할 수 없으면 committed fallback을 사용한다.
  resolve-nextest-duration-policy:
    name: Resolve nextest target duration policy
    runs-on: ubuntu-latest
    needs: [preflight]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.rust_required == 'true'
      }}
    permissions:
      contents: read
    outputs:
      duration_policy_sha: ${{ steps.resolve.outputs.duration_policy_sha || '' }}
    steps:
      - id: resolve
        shell: bash
        env:
          METRICS_REF: refs/heads/ci-metrics/nextest-target-durations
        run: |
          set -euo pipefail

          if policy_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "${METRICS_REF}" | awk 'NR == 1 { print $1 }')"; then
            :
          else
            policy_sha=''
          fi

          if [[ -n "${policy_sha}" ]]; then
            printf 'duration_policy_sha=%s\n' "${policy_sha}" >> "${GITHUB_OUTPUT}"
            printf 'Using duration policy commit %s.\n' "${policy_sha}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'duration_policy_sha=' >> "${GITHUB_OUTPUT}"
            echo 'Duration policy data is unavailable; using the committed fallback.' >> "${GITHUB_STEP_SUMMARY}"
          fi

  # [#2393] 기본 테스트 병렬화 — CI impact preflight가 frontend·Rust·Native Skia
  # gate와 worker 조건을 나누는 경계다.
  # [#6251] archive A는 source-side lib test를 단일 worker가 소비하고, B/C/D는
  # integration target을 시간 기준으로 분배해 각각 compile/link한다.
  # required check 는 집계 job "Build & Test" 로 불변이다.
  # [#5388] M04-4: tests/cases/prop_*_roundtrip.rs 는 정규 shard 가 archive 에서
  # 자동 실행한다. 전용 싼 job 은 .github/workflows/proptest-roundtrip.yml
  # (원본 부재 skip). 5번째 shard 를 넣지 않는다 — 집계는 4 worker 합이다.
  build-test-archive-a:
    uses: ./.github/workflows/build-nextest-archives.yml
    needs: [preflight]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.rust_required == 'true'
      }}
    permissions:
      contents: read
    with:
      cargo_profile: ${{ needs.preflight.outputs.test_profile || 'release' }}
      timeout_minutes: ${{ fromJSON(needs.preflight.outputs.test_archive_timeout_minutes || '60') }}
      archive_label: a
      target_group: lib


  build-test-archive-b:
    uses: ./.github/workflows/build-nextest-archives.yml
    needs: [preflight, resolve-nextest-duration-policy]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.rust_required == 'true'
        && needs.resolve-nextest-duration-policy.result == 'success'
      }}
    permissions:
      contents: read
    with:
      cargo_profile: ${{ needs.preflight.outputs.test_profile || 'release' }}
      timeout_minutes: ${{ fromJSON(needs.preflight.outputs.test_archive_timeout_minutes || '60') }}
      archive_label: b
      target_group: integration-b
      duration_policy_sha: ${{ needs.resolve-nextest-duration-policy.outputs.duration_policy_sha }}


  build-test-archive-c:
    uses: ./.github/workflows/build-nextest-archives.yml
    needs: [preflight, resolve-nextest-duration-policy]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.rust_required == 'true'
        && needs.resolve-nextest-duration-policy.result == 'success'
      }}
    permissions:
      contents: read
    with:
      cargo_profile: ${{ needs.preflight.outputs.test_profile || 'release' }}
      timeout_minutes: ${{ fromJSON(needs.preflight.outputs.test_archive_timeout_minutes || '60') }}
      archive_label: c
      target_group: integration-c
      duration_policy_sha: ${{ needs.resolve-nextest-duration-policy.outputs.duration_policy_sha }}


  build-test-archive-d:
    uses: ./.github/workflows/build-nextest-archives.yml
    needs: [preflight, resolve-nextest-duration-policy]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.rust_required == 'true'
        && needs.resolve-nextest-duration-policy.result == 'success'
      }}
    permissions:
      contents: read
    with:
      cargo_profile: ${{ needs.preflight.outputs.test_profile || 'release' }}
      timeout_minutes: ${{ fromJSON(needs.preflight.outputs.test_archive_timeout_minutes || '60') }}
      archive_label: d
      target_group: integration-d
      duration_policy_sha: ${{ needs.resolve-nextest-duration-policy.outputs.duration_policy_sha }}

  lint:
    name: Lint (fmt, clippy, WASM check)
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 20
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.fast_pass != 'true' && needs.preflight.outputs.rust_required == 'true' }}
    permissions:
      contents: read

    steps:
      # PR base와 HEAD의 3-way diff 정책은 공통 조상이 필요하다. shallow checkout에서는
      # base SHA만 별도 fetch해도 merge-base가 없어 정책 검사가 fail-closed 된다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Rust build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: lint
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      # `Cargo.toml`의 integration target은 파생 harness를 가리킨다. 깨끗한
      # checkout에서도 fmt/clippy가 target을 해석하기 전에 먼저 준비한다.
      - name: Prepare derived Rust test suites
        run: node scripts/rust-test-suite-manifest.mjs --prepare

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Validate CI impact classifier
        run: |
          node --test scripts/tests/ci-impact-classifier.test.cjs
          node --test scripts/tests/ci-impact-policy.test.cjs
          python3 -m unittest scripts/tests/test_ci_impact_workflow.py

      - name: Validate Rust test suite manifest
        env:
          RHWP_TEST_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          RHWP_TEST_POLICY_BASE_BRANCH: ${{ github.event.pull_request.base.ref || '' }}
          RHWP_TEST_POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          RHWP_TEST_POLICY_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || '' }}
          RHWP_TEST_POLICY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          RHWP_REPOSITORY: ${{ github.repository }}
        run: |
          policy_base_ref="$RHWP_TEST_POLICY_BASE_SHA"

          # main이 현행 test-policy 도입 전 release라면 canonical devel -> main
          # promotion에서 누적된 검증 완료 source를 모두 신규 위반으로 오판한다. 같은
          # 저장소의 exact promotion이고 base가 head의 조상이며 synthetic merge tree가
          # head tree와 같을 때만 증분 기준을 devel head로 전환한다. 전체 manifest와
          # unit-tier 검사는 아래에서 그대로 실행한다.
          if [[ "$RHWP_TEST_POLICY_BASE_BRANCH" == "main" \
            && "$RHWP_TEST_POLICY_HEAD_BRANCH" == "devel" \
            && "$RHWP_TEST_POLICY_HEAD_REPOSITORY" == "$RHWP_REPOSITORY" ]]; then
            if [[ -z "$RHWP_TEST_POLICY_BASE_SHA" || -z "$RHWP_TEST_POLICY_HEAD_SHA" ]]; then
              echo "::error::canonical devel -> main promotion SHA가 비어 있습니다."
              exit 1
            fi
            if ! git merge-base --is-ancestor \
              "$RHWP_TEST_POLICY_BASE_SHA" "$RHWP_TEST_POLICY_HEAD_SHA"; then
              echo "::error::main은 canonical devel promotion head의 조상이어야 합니다."
              exit 1
            fi
            checkout_tree="$(git rev-parse 'HEAD^{tree}')"
            head_tree="$(git rev-parse "${RHWP_TEST_POLICY_HEAD_SHA}^{tree}")"
            if [[ "$checkout_tree" != "$head_tree" ]]; then
              echo "::error::devel -> main synthetic merge tree가 canonical head tree와 다릅니다."
              exit 1
            fi
            policy_base_ref="$RHWP_TEST_POLICY_HEAD_SHA"
            echo "canonical devel -> main promotion: incremental policy base=$policy_base_ref"
          fi

          base_args=()
          if [[ -n "$policy_base_ref" ]]; then
            base_args=(--base-ref "$policy_base_ref")
          fi
          node --test scripts/tests/rust-test-suite-manifest.test.mjs
          node scripts/rust-test-suite-manifest.mjs --check "${base_args[@]}"
          node --test scripts/tests/rust-unit-test-tiers.test.mjs
          node scripts/rust-unit-test-tiers.mjs --check "${base_args[@]}"
          node scripts/run-rust-test.mjs --print issue_1035_alignment

      - name: Test internal Rust crates
        run: |
          cargo test --workspace \
            --exclude rhwp \
            --exclude rhwp-subsecond \
            --exclude rhwp-native-ffi \
            --exclude batch-convert \
            --lib

      # 독립 verifier 패키지는 root Cargo target과 Python workflow 계약 범위 밖이다.
      # corpus·golden decision table이 변경돼도 실제 검증기가 실행되도록 명시적으로 묶는다.
      # criteria_decomp는 위 workspace test가 담당하고, repeat_eval·tool_version_gate는 standalone manifest다.
      - name: Validate LLM verifier tool contracts
        run: |
          export PYTHONPATH=tools/llm_verifier
          python3 -m unittest discover -s tools/llm_verifier/third_party_replay/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/llm_verifier/shadow_agree/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/llm_verifier/untrusted_sandbox/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/llm_verifier/lineage_chain/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/llm_verifier/abstain/tests -p 'test_*.py'
          cargo test --manifest-path tools/llm_verifier/repeat_eval/Cargo.toml
          cargo test --manifest-path tools/llm_verifier/tool_version_gate/Cargo.toml

      - name: Validate Render Diff trigger policy
        run: python3 -m unittest scripts/tests/test_render_diff_workflow.py

      - name: Validate canvaskit-parity batch map
        run: python3 -m unittest scripts/tests/test_canvaskit_parity_batches.py

      # [#4080] workflow 계약 테스트는 추가해 놓고 배선을 잊으면 한 번도 돌지 않는다.
      # 아래 목록은 test_workflow_contract_wiring.py 가 강제한다 — 새 계약 테스트를
      # 추가하면 그 테스트가 실패하므로 여기 한 줄을 같이 넣어야 한다.
      - name: Validate workflow contracts
        run: |
          node --test scripts/tests/verify-trusted-postmerge-ci-reuse.test.mjs
          node --test scripts/tests/verify-trusted-postmerge-ci-reuse-squash.test.mjs
          node --test scripts/tests/verify-trusted-postmerge-review-bridge.test.mjs
          python3 -m unittest scripts/tests/test_cache_sweep_workflow.py
          python3 -m unittest scripts/tests/test_cancel_stale_pr_runs_workflow.py
          python3 -m unittest scripts/tests/test_ci_impact_policy_workflow.py
          python3 -m unittest scripts/tests/test_codeql_workflow.py
          python3 -m unittest scripts/tests/test_nextest_archive_workflow.py
          python3 -m unittest scripts/tests/test_oracle_public_advisory_workflow.py
          python3 -m unittest scripts/tests/test_workflow_promotion_evidence.py
          python3 -m unittest scripts/tests/test_workflow_promotion_gate_workflow.py
          python3 -m unittest scripts/tests/test_workflow_promotion_preflight.py
          python3 -m unittest scripts/tests/test_release_channel_policy_workflow.py
          python3 -m unittest scripts/tests/test_review_only_fast_pass_workflows.py
          python3 -m unittest scripts/tests/test_proptest_roundtrip_workflow.py
          python3 -m unittest scripts/tests/test_adapter_diff_workflow.py
          python3 -m unittest scripts/tests/test_trusted_postmerge_ci_reuse_workflow.py
          python3 -m unittest scripts/tests/test_llm_verifier_workflow.py
          python3 -m unittest scripts/tests/test_undo_depth_e2e_workflow.py
          python3 -m unittest scripts/tests/test_workflow_contract_wiring.py

      # [#4715] 채택 척추 — 에이전트 작업 표준(AWS)이 전 표면에서 정합한지.
      # 바이너리 불요(커밋 문서만) — 표면이 늘어도 표준 링크가 끊기지 않게 한다.
      - name: Validate adoption spine contract
        run: python3 -m unittest scripts/tests/test_adoption_spine.py

      # [#4718] 계획 템플릿 형식 계약 — 자가검증 계획 시작점이 스키마를 지키는지.
      - name: Validate planner templates
        run: python3 -m unittest scripts/tests/test_planner_templates.py

      # [#4720] 에이전트 노동 운영체제 — 부서가 실재 pack/트랙/과제에 매핑되고
      # 자동 배치기가 유효한 배정을 내는지. 바이너리 불요.
      - name: Validate agent org contract
        run: python3 -m unittest scripts/tests/test_agent_org.py

      # [#4726] 에이전트 프레임 메타 가드 — 등재된 모든 하위체계가 가드를 가지고
      # 머지분은 실재하는지. 틀 밖 확장을 막는 상위 불변식. 바이너리 불요.
      - name: Validate agent frame contract
        run: python3 -m unittest scripts/tests/test_agent_frame.py

      # [#4728] 외부 현실 채점 계약 — 코어 견인과 메타-시스템 외부 채택을
      # 섞지 않고, self-graded 상태를 정직하게 보고하는지. 바이너리 불요.
      - name: Validate external reality check contract
        run: python3 -m unittest scripts/tests/test_reality_check.py

      - name: Clippy
        run: cargo clippy -- -D warnings

      # [#4630] wasm32 전용 cfg 경로의 lint 부채는 네이티브 Clippy로 보이지 않는다.
      - name: Clippy (WASM32)
        run: cargo clippy -p rhwp --lib --target wasm32-unknown-unknown -- -D warnings

      # [#3664] Native FFI 크레이트가 워크스페이스 밖이라 어느 CI job 도 건드리지
      # 않는 사이 코어 API 변경을 못 따라가 이미 컴파일이 깨져 있었다(C#·Swift 래퍼
      # 동반 무력화). 기본 `cargo clippy` 는 루트 크레이트만 보므로 별도 검사가 필요하다.
      #
      # [#3890] 종전에는 `-p rhwp-native-ffi` 로 좁혔다 — `rhwp-subsecond` 가 feature
      # 게이트 불일치로 `--workspace` 를 상시 깨뜨렸기 때문이다. 그 결함을 고쳐
      # **워크스페이스 전체**로 넓힌다. 앞으로 추가되는 멤버가 자동으로 검사 대상이
      # 되며, 깨진 채 들어오면 여기서 막힌다(그것이 이 가드의 목적이다).
      - name: Check workspace members (FFI bindings, tools)
        run: |
          cargo build --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      # [로드맵 R12] 에이전트 표면 선검사 — 실패 경로 전수(전 명령 "없는 파일" 호출
      # → exit≠0 + stdout 0바이트)·미선언 명령 감지(capabilities 에 flags 를 선언하지
      # 않은 명령이 미지 플래그를 exit 0 으로 조용히 삼키는지)를 한 번에 돌린다.
      # 바로 위 스텝의 `cargo build --workspace` 가 만든 debug 바이너리를 그대로 쓴다
      # — 이 게이트만을 위해 release 를 다시 빌드하지 않는다. 큐 규율 검사(gh
      # PR 목록 조회, 경고 전용)는 이 저장소의 병렬 세션 운영 규약용이라 CI 실행과는
      # 무관하므로 --no-network 로 끈다(tools/agent_preflight.py 참고).
      - name: Agent preflight (failure-path sweep + undeclared-command detection)
        run: python3 tools/agent_preflight.py --repo . --bin target/debug/rhwp --no-network

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --lib

  native-skia-tests:
    name: Native Skia tests
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 30
    # [#5164 Stage 3] Native Skia는 독립 runner에서 실행되므로 lint·frontend를 기다리지 않는다.
    # 각 lane의 성공·skip 계약은 최종 Build & Test 집계 job이 함께 검증한다.
    needs: [preflight]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.native_skia_required == 'true'
      }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # archive builder와 같은 30GB 임계치만 적용한다. 일반 ubuntu-latest의 충분한 여유에서는
      # Android/dotnet 삭제가 약 1분을 쓰므로 건너뛴다.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          set -euo pipefail
          echo 'Disk space before cleanup:'
          df -h /
          df -B1 --output=source,size,used,avail,pcent,target /
          available_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if (( available_gb < 30 )); then
            echo "Low disk space: ${available_gb}GB available; inspecting and removing unused toolchains."
            for path in /usr/local/lib/android /usr/share/dotnet; do
              if [[ -e "${path}" ]]; then
                sudo du -sh "${path}"
              else
                echo "${path}: absent"
              fi
            done
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          else
            echo "Skip cleanup: ${available_gb}GB available"
          fi

          echo 'Disk space after cleanup:'
          df -h /
          df -B1 --output=source,size,used,avail,pcent,target /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1

      # [#2431 C] 기본 test job 의 rust-cache 이행 후 writer가 사라진
      # Linux-cargo-* namespace 대신 Native Skia 전용 shared key를 사용한다.
      # PR은 restore-only, devel/main push만 save하는 신뢰 경계를 유지한다.
      - name: Rust build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: native-skia
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      - name: Install native Skia runtime packages
        id: native-skia-runtime
        run: |
          # hosted runner의 APT mirror 지연·dpkg lock이 Native Skia lane 전체를
          # 장시간 pending으로 남기지 않게 한다. 재시도 후에도 회복하지 못하면
          # 3분 안에 APT 단계 실패로 원인을 드러낸다.
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=60
          )
          install_apt() {
            set +e
            sudo env DEBIAN_FRONTEND=noninteractive \
              timeout 180 apt-get "${apt_options[@]}" "$@"
            local status=$?
            set -e

            if [[ "${status}" -eq 124 ]]; then
              echo "::warning::Native Skia tests skipped: APT command exceeded 180 seconds."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            return "${status}"
          }

          install_apt update
          install_apt install -y --no-install-recommends \
            fonts-dejavu-core \
            libfontconfig1-dev \
            libfreetype6-dev
          echo "available=true" >> "$GITHUB_OUTPUT"

      # Native Skia starts from a clean checkout but compiles generated
      # integration-test targets through Cargo, so prepare them locally first.
      - name: Prepare derived Rust test suites
        if: steps.native-skia-runtime.outputs.available != 'false'
        run: node scripts/rust-test-suite-manifest.mjs --prepare

      - name: Native Skia tests
        if: steps.native-skia-runtime.outputs.available != 'false'
        env:
          TEST_PROFILE: ${{ needs.preflight.outputs.test_profile || 'release' }}
        run: |
          set -euo pipefail
          case "${TEST_PROFILE}" in
            release-test)
              echo "profile=release-test event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
              cargo test --profile release-test --features native-skia skia --lib --verbose
              node scripts/run-rust-test.mjs --cargo-test cli_exit_codes_native -- --profile release-test --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_1144_native -- --profile release-test --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_2225_missing_picture_placeholder -- --profile release-test --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test render_p37_direct_pdf_export -- --profile release-test --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_2083_hide_fill_page_background -- --profile release-test --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_2292_chart_png_clip -- --profile release-test --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_2293_chart_png_text -- --profile release-test --features native-skia --verbose
              ;;
            release)
              echo "profile=release event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
              cargo test --release --features native-skia skia --lib --verbose
              node scripts/run-rust-test.mjs --cargo-test cli_exit_codes_native -- --release --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_1144_native -- --release --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_2225_missing_picture_placeholder -- --release --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test render_p37_direct_pdf_export -- --release --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_2083_hide_fill_page_background -- --release --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_2292_chart_png_clip -- --release --features native-skia --verbose
              node scripts/run-rust-test.mjs --cargo-test issue_2293_chart_png_text -- --release --features native-skia --verbose
              ;;
            *)
              echo "::error::Unknown test profile: ${TEST_PROFILE}"
              exit 1
              ;;
          esac

  frontend-unit-gates:
    name: Frontend unit gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # unit lane은 Studio 전체 TypeScript와 unit test를 검증하되 fresh WASM·extension build는 생략한다.
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.fast_pass != 'true' && needs.preflight.outputs.frontend_mode == 'unit' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rhwp-studio/package-lock.json

      - name: Install Studio dependencies
        run: npm --prefix rhwp-studio ci

      - name: Type-check Studio
        working-directory: rhwp-studio
        run: npx tsc --project tsconfig.ci-unit.json --noEmit

      - name: Run Studio unit tests
        run: npm --prefix rhwp-studio run test

  frontend-package-gates:
    name: Frontend package gates
    runs-on: ubuntu-latest
    # [#6717] 직렬 package 설치가 지연돼도 회귀 gate를 실행할 여유를 두되 hang은 실패로 드러낸다.
    timeout-minutes: 30
    # [#3268] Frontend는 Lint의 산출물을 읽지 않고 독립 runner에서 별도 target/cache를 쓴다.
    # preflight의 fast-pass·영향 판정만 기다려 Lint와 병렬 시작한다. Lint 실패 시 Frontend가
    # 끝날 수는 있지만 Native/archive는 아래 두 worker의 성공을 모두 계속 요구한다.
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.fast_pass != 'true' && needs.preflight.outputs.frontend_mode == 'package' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Restore frontend WASM cargo cache
        id: frontend_wasm_cargo_cache_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-frontend-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-wasm-cargo-

      - name: Build fresh WASM package for frontend gates
        run: wasm-pack build --target web --dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            rhwp-studio/package-lock.json
            rhwp-chrome/package-lock.json
            rhwp-firefox/package-lock.json
            rhwp-vscode/package-lock.json

      - name: Install frontend package dependencies
        run: |
          npm --prefix rhwp-studio ci --no-audit --prefer-offline
          npm --prefix rhwp-chrome ci --no-audit --prefer-offline
          npm --prefix rhwp-firefox ci --no-audit --prefer-offline
          npm --prefix rhwp-vscode ci --no-audit --prefer-offline

      - name: Verify WASM bindings and editor embed contract
        run: node --test scripts/frontend-wasm-bindings.test.mjs scripts/frontend-editor-embed.test.mjs

      - name: Run editor package tests when declared
        run: npm --prefix npm/editor test --if-present

      - name: Run shared and extension service worker tests
        run: node --test rhwp-shared/sw/*.test.js rhwp-chrome/sw/*.test.mjs rhwp-firefox/sw/*.test.mjs

      - name: Run Chrome extension options UI tests
        run: node --test rhwp-chrome/options.test.mjs

      - name: Run Studio unit tests
        run: npm --prefix rhwp-studio run test

      - name: Install headless Chrome
        working-directory: rhwp-studio
        run: |
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            chrome_install_output="$(./node_modules/.bin/browsers install chrome@stable --path "$HOME/.cache/puppeteer" --format '{{path}}' 2>&1)" || {
              printf '%s\n' "$chrome_install_output" >&2
              exit 1
            }
            chrome_path="$(printf '%s\n' "$chrome_install_output" | tail -n 1)"
          fi
          if [ ! -f "$chrome_path" ]; then
            chrome_path="$(find "$HOME/.cache/puppeteer" -type f \( -name chrome -o -name chrome-headless-shell \) | sort | tail -n 1)"
          fi
          if [ -z "$chrome_path" ] || [ ! -f "$chrome_path" ]; then
            echo "Chrome executable not found under $HOME/.cache/puppeteer" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"

      # [#5959] 스냅샷 예산 축출 회귀 게이트(#5769) — 실 wasm 과 실 브라우저를
      # 구동해야 하므로 스텁 wasm 을 쓰는 unit 모드가 아닌 package 모드에서만 단다.
      - name: Run undo depth measurement gate (#5769)
        working-directory: rhwp-studio
        env:
          VITE_PORT: '7700'
        run: npm run e2e:undo-depth

      - name: Run Studio responsive toolbar gate (#6118, #6138)
        # CI wiring: rhwp-studio/e2e/responsive.test.mjs via npm e2e:responsive.
        working-directory: rhwp-studio
        env:
          VITE_PORT: '7720'
        run: npm run e2e:responsive

      - name: Build Studio
        run: npm --prefix rhwp-studio run build

      - name: Build browser extensions
        run: |
          npm --prefix rhwp-chrome run build
          npm --prefix rhwp-firefox run build

      - name: Verify extension distributions
        run: node --test scripts/frontend-extension-dist.test.mjs

      - name: Compile VS Code extension
        run: npm --prefix rhwp-vscode run compile

      - name: Verify VS Code webview outline keyboard contract
        run: node --test scripts/frontend-vscode-outline.test.mjs

      - name: Verify font asset contracts
        run: node --test scripts/frontend-font-assets.test.mjs

      - name: Save frontend WASM cargo cache
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') && steps.frontend_wasm_cargo_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-frontend-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

  test-archive-a-shard-1:
    uses: ./.github/workflows/run-nextest-archives.yml
    needs: [preflight, build-test-archive-a]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.rust_required == 'true'
        && needs['build-test-archive-a'].result == 'success'
      }}
    permissions:
      contents: read
    with:
      label: Archive A
      count_label: a-1
      archive_label: a
      filterset: "all()"
      partition: "hash:1/1"
      security_sweep_samples_json: ${{ needs.preflight.outputs.security_sweep_samples_json || '[]' }}


  test-archive-b-shard-1:
    uses: ./.github/workflows/run-nextest-archives.yml
    needs: [preflight, build-test-archive-b]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.rust_required == 'true'
        && needs['build-test-archive-b'].result == 'success'
      }}
    permissions:
      contents: read
    with:
      label: Archive B
      count_label: b-1
      archive_label: b
      filterset: "all()"
      partition: "hash:1/1"
      security_sweep_samples_json: ${{ needs.preflight.outputs.security_sweep_samples_json || '[]' }}


  test-archive-c-shard-1:
    uses: ./.github/workflows/run-nextest-archives.yml
    needs: [preflight, build-test-archive-c]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.rust_required == 'true'
        && needs['build-test-archive-c'].result == 'success'
      }}
    permissions:
      contents: read
    with:
      label: Archive C
      count_label: c-1
      archive_label: c
      filterset: "all()"
      partition: "hash:1/1"
      security_sweep_samples_json: ${{ needs.preflight.outputs.security_sweep_samples_json || '[]' }}


  test-archive-d-shard-1:
    uses: ./.github/workflows/run-nextest-archives.yml
    needs: [preflight, build-test-archive-d]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.preflight.outputs.rust_required == 'true'
        && needs['build-test-archive-d'].result == 'success'
      }}
    permissions:
      contents: read
    with:
      label: Archive D
      count_label: d-1
      archive_label: d
      filterset: "all()"
      partition: "hash:1/1"
      security_sweep_samples_json: ${{ needs.preflight.outputs.security_sweep_samples_json || '[]' }}


  # B/C/D duration data is refreshed from this devel run, or from the exact green
  # same-repository PR run accepted by trusted_postmerge_reuse.
  refresh-nextest-target-duration-data:
    name: Refresh nextest target duration data
    runs-on: ubuntu-latest
    needs:
      - preflight
      - test-archive-b-shard-1
      - test-archive-c-shard-1
      - test-archive-d-shard-1
    if: >-
      ${{
        always()
        && github.event_name == 'push'
        && github.ref == 'refs/heads/devel'
        && needs.preflight.result == 'success'
        && (
          needs.preflight.outputs.postmerge_reuse != 'true'
          || needs.preflight.outputs.postmerge_refresh_duration_data == 'true'
        )
        && needs.preflight.outputs.rust_required == 'true'
        && (
          (
            needs.preflight.outputs.postmerge_reuse != 'true'
            && needs.preflight.outputs.fast_pass != 'true'
            && needs.test-archive-b-shard-1.result == 'success'
            && needs.test-archive-c-shard-1.result == 'success'
            && needs.test-archive-d-shard-1.result == 'success'
          )
          || (
            needs.preflight.outputs.postmerge_reuse == 'true'
            && needs.preflight.outputs.postmerge_source_run_id != ''
          )
        )
      }}
    permissions:
      actions: read
      contents: write
    concurrency:
      group: nextest-target-duration-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download Archive B duration measurement
        if: ${{ needs.preflight.outputs.postmerge_reuse != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-target-durations-${{ github.run_id }}-b
          path: duration-b

      - name: Download Archive C duration measurement
        if: ${{ needs.preflight.outputs.postmerge_reuse != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-target-durations-${{ github.run_id }}-c
          path: duration-c

      - name: Download Archive D duration measurement
        if: ${{ needs.preflight.outputs.postmerge_reuse != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-target-durations-${{ github.run_id }}-d
          path: duration-d

      - name: Download trusted PR Archive B duration measurement
        if: ${{ needs.preflight.outputs.postmerge_reuse == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.postmerge_source_run_id }}
        run: >-
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
          --name "nextest-target-durations-${SOURCE_RUN_ID}-b" --dir duration-b

      - name: Download trusted PR Archive C duration measurement
        if: ${{ needs.preflight.outputs.postmerge_reuse == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.postmerge_source_run_id }}
        run: >-
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
          --name "nextest-target-durations-${SOURCE_RUN_ID}-c" --dir duration-c

      - name: Download trusted PR Archive D duration measurement
        if: ${{ needs.preflight.outputs.postmerge_reuse == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.postmerge_source_run_id }}
        run: >-
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
          --name "nextest-target-durations-${SOURCE_RUN_ID}-d" --dir duration-d

      - name: Refresh duration policy data branch
        shell: bash
        env:
          METRICS_BRANCH: ci-metrics/nextest-target-durations
          OUTPUT_POLICY: ${{ runner.temp }}/nextest-target-duration-policy.json
        run: |
          set -euo pipefail

          current_devel_sha="$(git ls-remote origin refs/heads/devel | awk 'NR == 1 { print $1 }')"
          if [[ "${current_devel_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::notice::A newer devel commit exists; this older measurement is not published."
            exit 0
          fi

          node scripts/refresh-nextest-target-duration-policy.mjs \
            --policy tests/suites/nextest-target-duration-policy.json \
            --measurement duration-b/target-durations-b.json \
            --measurement duration-c/target-durations-c.json \
            --measurement duration-d/target-durations-d.json \
            --output "${OUTPUT_POLICY}"

          if git ls-remote --exit-code origin "refs/heads/${METRICS_BRANCH}" >/dev/null 2>&1; then
            git fetch --depth=1 origin \
              "refs/heads/${METRICS_BRANCH}:refs/remotes/origin/${METRICS_BRANCH}"
            git switch --detach "refs/remotes/origin/${METRICS_BRANCH}"
          else
            git switch --orphan "${METRICS_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "${OUTPUT_POLICY}" nextest-target-duration-policy.json
          git add nextest-target-duration-policy.json
          if git diff --cached --quiet; then
            echo 'Duration policy data is unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "ci: nextest target duration data ${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${METRICS_BRANCH}"

  workflow-promotion-preflight:
    name: Workflow promotion preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [preflight]
    if: >-
      ${{
        github.event_name == 'pull_request'
        && github.base_ref == 'main'
        && github.head_ref == 'devel'
        && github.event.pull_request.head.repo.full_name == github.repository
      }}
    permissions:
      actions: read
      contents: read
      issues: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify canonical promotion topology
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${CANDIDATE_SHA}" ]]; then
            echo "::error::checkout is not the canonical candidate SHA"
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "::error::main base commit is unavailable in the checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${BASE_SHA}" "${CANDIDATE_SHA}"; then
            echo "::error::main must be an ancestor of the canonical devel candidate"
            exit 1
          fi
          merge_tree="$(git merge-tree --write-tree "${BASE_SHA}" "${CANDIDATE_SHA}")"
          candidate_tree="$(git rev-parse "${CANDIDATE_SHA}^{tree}")"
          if [[ "${merge_tree}" != "${candidate_tree}" ]]; then
            echo "::error::main/devel merge tree differs from the exact candidate tree"
            exit 1
          fi

      - name: Build workflow promotion inventory
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/workflow-promotion
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          python3 scripts/workflow_promotion_preflight.py inventory \
            --repo . \
            --base-sha "${BASE_SHA}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --policy scripts/workflow_promotion_policy.json \
            --format json > "${EVIDENCE_DIR}/inventory.json"
          python3 scripts/workflow_promotion_preflight.py inventory \
            --repo . \
            --base-sha "${BASE_SHA}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --policy scripts/workflow_promotion_policy.json \
            --format markdown >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect exact-head Actions evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_DIR: ${{ runner.temp }}/workflow-promotion
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/workflow_promotion_evidence.py
          --inventory "${EVIDENCE_DIR}/inventory.json"
          --runs-output "${EVIDENCE_DIR}/runs.json"
          --waivers-output "${EVIDENCE_DIR}/waivers.json"
          --issue-number "${RELEASE_PR_NUMBER}"
          --trusted-maintainer edwardkim

      - name: Verify workflow promotion evidence
        id: verify-promotion
        continue-on-error: true
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/workflow-promotion
        run: >-
          python3 scripts/workflow_promotion_preflight.py verify
          --inventory "${EVIDENCE_DIR}/inventory.json"
          --runs "${EVIDENCE_DIR}/runs.json"
          --waivers "${EVIDENCE_DIR}/waivers.json"
          --trusted-maintainer edwardkim
          > "${EVIDENCE_DIR}/verdict.json"

      - name: Summarize workflow promotion verdict
        if: ${{ always() }}
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/workflow-promotion
        run: |
          if [[ -f "${EVIDENCE_DIR}/verdict.json" ]]; then
            {
              echo
              echo '## Workflow promotion verdict'
              echo
              echo '```json'
              cat "${EVIDENCE_DIR}/verdict.json"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload workflow promotion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-promotion-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow-promotion
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce workflow promotion verdict
        if: ${{ always() }}
        env:
          VERIFY_OUTCOME: ${{ steps.verify-promotion.outcome }}
        run: |
          if [[ "${VERIFY_OUTCOME}" != "success" ]]; then
            echo "::error::workflow promotion evidence is incomplete or invalid"
            exit 1
          fi

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 45
    needs:
      - preflight
      - build-test-archive-a
      - build-test-archive-b
      - build-test-archive-c
      - build-test-archive-d
      - test-archive-a-shard-1
      - test-archive-b-shard-1
      - test-archive-c-shard-1
      - test-archive-d-shard-1
      - lint
      - native-skia-tests
      - frontend-unit-gates
      - frontend-package-gates
      - workflow-promotion-preflight
    if: ${{ always() }}
    permissions:
      contents: read

    steps:
      - name: Download archive A expected count
        if: >-
          ${{
            needs.preflight.outputs.fast_pass != 'true'
            && needs.preflight.outputs.rust_required == 'true'
            && needs['test-archive-a-shard-1'].result == 'success'
            && needs['test-archive-b-shard-1'].result == 'success'
            && needs['test-archive-c-shard-1'].result == 'success'
            && needs['test-archive-d-shard-1'].result == 'success'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive-expected-${{ github.run_id }}-a
          path: archive-expected-a
      - name: Download archive B expected count
        if: >-
          ${{
            needs.preflight.outputs.fast_pass != 'true'
            && needs.preflight.outputs.rust_required == 'true'
            && needs['test-archive-a-shard-1'].result == 'success'
            && needs['test-archive-b-shard-1'].result == 'success'
            && needs['test-archive-c-shard-1'].result == 'success'
            && needs['test-archive-d-shard-1'].result == 'success'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive-expected-${{ github.run_id }}-b
          path: archive-expected-b
      - name: Download archive C expected count
        if: >-
          ${{
            needs.preflight.outputs.fast_pass != 'true'
            && needs.preflight.outputs.rust_required == 'true'
            && needs['test-archive-a-shard-1'].result == 'success'
            && needs['test-archive-b-shard-1'].result == 'success'
            && needs['test-archive-c-shard-1'].result == 'success'
            && needs['test-archive-d-shard-1'].result == 'success'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive-expected-${{ github.run_id }}-c
          path: archive-expected-c

      - name: Download archive D expected count
        if: >-
          ${{
            needs.preflight.outputs.fast_pass != 'true'
            && needs.preflight.outputs.rust_required == 'true'
            && needs['test-archive-a-shard-1'].result == 'success'
            && needs['test-archive-b-shard-1'].result == 'success'
            && needs['test-archive-c-shard-1'].result == 'success'
            && needs['test-archive-d-shard-1'].result == 'success'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive-expected-${{ github.run_id }}-d
          path: archive-expected-d
      - name: Download shard counts
        if: >-
          ${{
            needs.preflight.outputs.fast_pass != 'true'
            && needs.preflight.outputs.rust_required == 'true'
            && needs['test-archive-a-shard-1'].result == 'success'
            && needs['test-archive-b-shard-1'].result == 'success'
            && needs['test-archive-c-shard-1'].result == 'success'
            && needs['test-archive-d-shard-1'].result == 'success'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-count-*
          path: shard-counts
      - name: Verify archive shard totals
        if: >-
          ${{
            needs.preflight.outputs.fast_pass != 'true'
            && needs.preflight.outputs.rust_required == 'true'
            && needs['test-archive-a-shard-1'].result == 'success'
            && needs['test-archive-b-shard-1'].result == 'success'
            && needs['test-archive-c-shard-1'].result == 'success'
            && needs['test-archive-d-shard-1'].result == 'success'
          }}
        run: |
          read -r expected_a < archive-expected-a/archive-expected-total.txt
          read -r expected_b < archive-expected-b/archive-expected-total.txt
          read -r expected_c < archive-expected-c/archive-expected-total.txt
          read -r expected_d < archive-expected-d/archive-expected-total.txt
          read -r a1 < shard-counts/shard-count-a-1/shard-count-a-1.txt
          read -r b1 < shard-counts/shard-count-b-1/shard-count-b-1.txt
          read -r c1 < shard-counts/shard-count-c-1/shard-count-c-1.txt
          read -r d1 < shard-counts/shard-count-d-1/shard-count-d-1.txt
          if ! [[ "$expected_a" =~ ^[0-9]+$ && "$expected_b" =~ ^[0-9]+$ && "$expected_c" =~ ^[0-9]+$ && "$expected_d" =~ ^[0-9]+$ && "$a1" =~ ^[0-9]+$ && "$b1" =~ ^[0-9]+$ && "$c1" =~ ^[0-9]+$ && "$d1" =~ ^[0-9]+$ ]]; then
            echo "::error::archive expected counts and shard counts must be non-negative integers"
            exit 1
          fi
          if (( a1 != expected_a )); then
            echo "::error::Archive A shard total mismatch: $a1 != $expected_a"
            exit 1
          fi
          if (( b1 != expected_b )); then
            echo "::error::Archive B shard total mismatch: $b1 != $expected_b"
            exit 1
          fi
          if (( c1 != expected_c )); then
            echo "::error::Archive C shard total mismatch: $c1 != $expected_c"
            exit 1
          fi
          if (( d1 != expected_d )); then
            echo "::error::Archive D shard total mismatch: $d1 != $expected_d"
            exit 1
          fi
          printf 'archive_total=%s shard_total=%s\n' "$((expected_a + expected_b + expected_c + expected_d))" "$((a1 + b1 + c1 + d1))"
      - name: Check Build & Test worker results
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FAST_PASS: ${{ needs.preflight.outputs.fast_pass }}
          RUST_REQUIRED: ${{ needs.preflight.outputs.rust_required }}
          NATIVE_SKIA_REQUIRED: ${{ needs.preflight.outputs.native_skia_required }}
          FRONTEND_MODE: ${{ needs.preflight.outputs.frontend_mode }}
          BUILD_ARCHIVE_A_RESULT: ${{ needs['build-test-archive-a'].result }}
          BUILD_ARCHIVE_B_RESULT: ${{ needs['build-test-archive-b'].result }}
          BUILD_ARCHIVE_C_RESULT: ${{ needs['build-test-archive-c'].result }}
          BUILD_ARCHIVE_D_RESULT: ${{ needs['build-test-archive-d'].result }}
          TEST_ARCHIVE_A_1_RESULT: ${{ needs['test-archive-a-shard-1'].result }}
          TEST_ARCHIVE_B_1_RESULT: ${{ needs['test-archive-b-shard-1'].result }}
          TEST_ARCHIVE_C_1_RESULT: ${{ needs['test-archive-c-shard-1'].result }}
          TEST_ARCHIVE_D_1_RESULT: ${{ needs['test-archive-d-shard-1'].result }}
          LINT_RESULT: ${{ needs.lint.result }}
          NATIVE_SKIA_RESULT: ${{ needs['native-skia-tests'].result }}
          FRONTEND_UNIT_RESULT: ${{ needs['frontend-unit-gates'].result }}
          FRONTEND_PACKAGE_RESULT: ${{ needs['frontend-package-gates'].result }}
          PROMOTION_RESULT: ${{ needs['workflow-promotion-preflight'].result }}
          CANONICAL_PROMOTION: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'devel' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          case "${CANONICAL_PROMOTION}" in
            true)
              [[ "${PROMOTION_RESULT}" == "success" ]] || { echo "::error::Canonical devel -> main promotion evidence failed: ${PROMOTION_RESULT}"; exit 1; }
              ;;
            false)
              [[ "${PROMOTION_RESULT}" == "skipped" ]] || { echo "::error::Workflow promotion gate must be skipped outside canonical release PRs: ${PROMOTION_RESULT}"; exit 1; }
              ;;
            *)
              echo "::error::Unknown canonical promotion state: ${CANONICAL_PROMOTION}"
              exit 1
              ;;
          esac
          if [[ "${PREFLIGHT_RESULT}" != "success" ]]; then
            echo "::error::CI preflight did not succeed: ${PREFLIGHT_RESULT}"
            exit 1
          fi
          if [[ "${FAST_PASS}" == "true" ]]; then
            echo "CI preflight fast-pass accepted."
            exit 0
          fi
          failed=0
          rust_results="${LINT_RESULT}/${BUILD_ARCHIVE_A_RESULT}/${BUILD_ARCHIVE_B_RESULT}/${BUILD_ARCHIVE_C_RESULT}/${BUILD_ARCHIVE_D_RESULT}/${TEST_ARCHIVE_A_1_RESULT}/${TEST_ARCHIVE_B_1_RESULT}/${TEST_ARCHIVE_C_1_RESULT}/${TEST_ARCHIVE_D_1_RESULT}"
          case "${RUST_REQUIRED}" in
            true) [[ "$rust_results" == "success/success/success/success/success/success/success/success/success" ]] || { echo "::error::Rust lane expected success for lint/four builders/four workers, got: $rust_results"; failed=1; } ;;
            false) [[ "$rust_results" == "skipped/skipped/skipped/skipped/skipped/skipped/skipped/skipped/skipped" ]] || { echo "::error::Rust lane expected skipped, got: $rust_results"; failed=1; } ;;
            *) echo "::error::Unknown rust_required: ${RUST_REQUIRED}"; failed=1 ;;
          esac
          case "${NATIVE_SKIA_REQUIRED}" in
            true) [[ "${NATIVE_SKIA_RESULT}" == "success" ]] || { echo "::error::Native Skia lane expected success, got: ${NATIVE_SKIA_RESULT}"; failed=1; } ;;
            false) [[ "${NATIVE_SKIA_RESULT}" == "skipped" ]] || { echo "::error::Native Skia lane expected skipped, got: ${NATIVE_SKIA_RESULT}"; failed=1; } ;;
            *) echo "::error::Unknown native_skia_required: ${NATIVE_SKIA_REQUIRED}"; failed=1 ;;
          esac
          case "${FRONTEND_MODE}" in
            none) [[ "${FRONTEND_UNIT_RESULT}/${FRONTEND_PACKAGE_RESULT}" == "skipped/skipped" ]] || { echo "::error::Frontend none lane expected skipped/skipped"; failed=1; } ;;
            unit) [[ "${FRONTEND_UNIT_RESULT}/${FRONTEND_PACKAGE_RESULT}" == "success/skipped" ]] || { echo "::error::Frontend unit lane expected success/skipped"; failed=1; } ;;
            package) [[ "${FRONTEND_UNIT_RESULT}/${FRONTEND_PACKAGE_RESULT}" == "skipped/success" ]] || { echo "::error::Frontend package lane expected skipped/success"; failed=1; } ;;
            *) echo "::error::Unknown frontend mode: ${FRONTEND_MODE}"; failed=1 ;;
          esac
          exit "$failed"
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # [Task #1109 / #1192 C] wasm-build job 도 build-and-test 와 동일 축소 패턴.
      # "크고 빠른" 항목(android/dotnet)만 제거. df -h 로 여유 확인.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM
        run: wasm-pack build --target web --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhwp-wasm-pkg
          path: pkg/
          retention-days: 30
