name: CI

on:
  push:
    branches: [main, devel]
    tags: ['v*']
    paths-ignore:
      - 'mydocs/**'
      - 'docs/**'
      - 'samples/**'
      - 'assets/chrome/**'
      - 'assets/edge/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  pull_request:
    branches: [main, devel]
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - 'assets/chrome/**'
      - 'assets/edge/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# [Task #1192 F] 같은 PR 에 새 push 가 오면 진행 중 run 을 취소해 중복 실행 제거.
# cancel-in-progress 는 PR 이벤트에서만 활성화 — devel/main push 머지 검증 run 은 보존.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: CI preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
    outputs:
      fast_pass: ${{ steps.detect.outputs.fast_pass || 'false' }}
      reason: ${{ steps.detect.outputs.reason || 'preflight-unavailable' }}
      candidate_sha: ${{ steps.detect.outputs.candidate_sha || '' }}
      frontend_required: ${{ steps.frontend-impact.outputs.frontend_required || 'true' }}
      frontend_reason: ${{ steps.frontend-impact.outputs.frontend_reason || 'frontend-detection-unavailable' }}

    steps:
      - name: Detect review-only fast pass
        id: detect
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const allowedConclusions = new Set(['success', 'skipped', 'neutral']);
            const { owner, repo } = context.repo;

            function setResult(fastPass, reason, candidateSha = '') {
              core.setOutput('fast_pass', fastPass ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.info(`fast_pass=${fastPass} reason=${reason} candidate_sha=${candidateSha}`);
            }

            function isAllowedReviewPath(file) {
              const filename = file.filename;
              if (filename.startsWith('mydocs/')) {
                return true;
              }
              if (file.status !== 'added') {
                return false;
              }
              return isReviewReferencePath(filename);
            }

            function isReviewReferencePath(filename) {
              return (
                filename.startsWith('samples/')
                && (
                  filename.endsWith('.hwp')
                  || filename.endsWith('.hwpx')
                  || filename.endsWith('.pdf')
                  || filename.endsWith('.png')
                )
              ) || (filename.startsWith('pdf/') && filename.endsWith('.pdf'));
            }

            function reviewOnlyLabel(files) {
              const hasReferenceArtifact = files.some((file) => (
                file.status === 'added'
                && isReviewReferencePath(file.filename)
              ));
              return hasReferenceArtifact ? 'review-reference-only' : 'mydocs-only';
            }

            function isCurrentBaseReviewMerge(commit, baseSha) {
              const parents = commit.parents || [];
              return parents.length === 2 && parents.some((parent) => parent.sha === baseSha);
            }

            function latestRun(runs) {
              return runs
                .slice()
                .sort((a, b) => {
                  const bTime = Date.parse(b.completed_at || b.started_at || b.created_at || 0);
                  const aTime = Date.parse(a.completed_at || a.started_at || a.created_at || 0);
                  return bTime - aTime;
                })[0];
            }

            try {
              if (context.eventName !== 'pull_request') {
                setResult(false, 'not-pull-request');
                return;
              }

              const pr = context.payload.pull_request;
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              if (prFiles.length > 0 && prFiles.every((file) => isAllowedReviewPath(file))) {
                core.info(`all PR files are review-only; using base SHA ${pr.base.sha}`);
                setResult(true, 'all-review-only-no-code-impact', pr.base.sha);
                return;
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });

              if (commits.length === 0) {
                setResult(false, 'no-pr-commits');
                return;
              }

              let trailingReviewOnlyCommits = 0;
              let candidateSha = '';

              for (let index = commits.length - 1; index >= 0; index -= 1) {
                const sha = commits[index].sha;
                const { data: commit } = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: sha,
                });
                const files = commit.files || [];

                // The commit endpoint may truncate very large file lists. Fall back to full CI.
                if (files.length === 0 || files.length >= 300) {
                  setResult(false, `unusable-file-list:${sha}`);
                  return;
                }

                const reviewOnly = files.every((file) => isAllowedReviewPath(file));
                if (reviewOnly) {
                  const parents = commit.parents || [];
                  if (parents.length === 1) {
                    trailingReviewOnlyCommits += 1;
                    continue;
                  }
                  // #3233: a docs-only Update branch merge can be the already-verified
                  // candidate after one or more trailing review-record commits. It must
                  // be exactly a merge of the current PR base; all other merge shapes
                  // retain the conservative full-CI fallback.
                  if (trailingReviewOnlyCommits > 0
                    && isCurrentBaseReviewMerge(commit, pr.base.sha)) {
                    candidateSha = sha;
                    core.info(`using current-base ${reviewOnlyLabel(files)} merge as candidate SHA ${candidateSha}`);
                    break;
                  }
                  setResult(false, `${reviewOnlyLabel(files)}-merge-not-reusable:${sha}`);
                  return;
                }

                candidateSha = sha;
                break;
              }

              if (trailingReviewOnlyCommits === 0) {
                setResult(false, 'no-trailing-review-only-commits');
                return;
              }
              if (!candidateSha) {
                candidateSha = pr.base.sha;
                core.info(`all PR commits are review-only; using base SHA ${candidateSha}`);
                setResult(true, 'all-review-only-no-code-impact', candidateSha);
                return;
              }

              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: candidateSha,
                per_page: 100,
              });
              let buildSource = 'check-run';
              let buildRun = latestRun(checkRuns.filter((run) => (
                run.name === 'Build & Test'
                && run.app?.slug === 'github-actions'
              )));

              if (!buildRun) {
                // Fork pull_request runs may expose the head SHA through Actions jobs while
                // returning no check-runs for that same SHA. The Actions head_sha server filter
                // can omit fork runs too, so narrow by the PR branch and compare head_sha locally.
                // Still require the exact CI workflow, head SHA, and aggregate job.
                const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: 'ci.yml',
                  event: 'pull_request',
                  branch: pr.head.ref,
                  per_page: 100,
                });
                const workflowRun = latestRun(workflowRuns.filter((run) => (
                  run.path === '.github/workflows/ci.yml'
                  && run.event === 'pull_request'
                  && run.head_sha === candidateSha
                )));

                if (!workflowRun) {
                  setResult(false, `missing-build-and-test:${candidateSha}`, candidateSha);
                  return;
                }
                if (workflowRun.status !== 'completed') {
                  setResult(
                    false,
                    `build-and-test-workflow-not-completed:${workflowRun.status}`,
                    candidateSha,
                  );
                  return;
                }

                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner,
                  repo,
                  run_id: workflowRun.id,
                  filter: 'latest',
                  per_page: 100,
                });
                buildRun = latestRun(jobs.filter((job) => job.name === 'Build & Test'));
                if (!buildRun) {
                  setResult(false, `missing-build-and-test-job:${candidateSha}`, candidateSha);
                  return;
                }
                buildSource = 'actions-job';
              }
              if (buildRun.status !== 'completed') {
                setResult(false, `build-and-test-not-completed:${buildRun.status}`, candidateSha);
                return;
              }
              if (!allowedConclusions.has(buildRun.conclusion)) {
                setResult(false, `build-and-test-not-green:${buildRun.conclusion}`, candidateSha);
                return;
              }

              const successReason = buildSource === 'check-run'
                ? `build-and-test-green:${buildRun.conclusion}`
                : `build-and-test-job-green:${buildRun.conclusion}`;
              setResult(true, successReason, candidateSha);
            } catch (error) {
              core.warning(`CI preflight failed; running full CI. ${error.message}`);
              setResult(false, 'preflight-error');
            }

      - name: Detect frontend impact
        id: frontend-impact
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const directoryPrefixes = [
              'rhwp-studio/',
              'rhwp-chrome/',
              'rhwp-firefox/',
              'rhwp-safari/',
              'rhwp-vscode/',
              'rhwp-shared/',
              'npm/editor/',
              'assets/fonts/',
            ];

            function setResult(required, reason) {
              core.setOutput('frontend_required', required ? 'true' : 'false');
              core.setOutput('frontend_reason', reason);
              core.info(`frontend_required=${required} frontend_reason=${reason}`);
            }

            function isFrontendPath(filename) {
              if (directoryPrefixes.some((prefix) => filename.startsWith(prefix))) {
                return true;
              }
              if (
                filename === 'Cargo.lock'
                || filename === 'src/wasm_api.rs'
                || filename === '.github/workflows/ci.yml'
              ) {
                return true;
              }
              return filename.startsWith('scripts/frontend-') && filename.endsWith('.mjs');
            }

            function evaluateFiles(files) {
              for (const file of files) {
                for (const filename of [file.filename, file.previous_filename]) {
                  if (filename && isFrontendPath(filename)) {
                    setResult(true, `frontend-path:${filename}`);
                    return;
                  }
                }
              }
              setResult(false, 'no-frontend-path');
            }

            try {
              if (context.eventName === 'pull_request') {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                // The API documents at most 3,000 PR files. Treat the boundary as truncated.
                if (files.length === 0 || files.length >= 3000) {
                  setResult(true, 'pr-file-list-empty-or-unusable');
                  return;
                }
                evaluateFiles(files);
                return;
              }

              if (context.eventName === 'push') {
                if (context.ref.startsWith('refs/tags/')) {
                  setResult(true, 'manual-or-tag');
                  return;
                }

                const before = context.payload.before || '';
                const after = context.payload.after || context.sha;
                if (!before || /^0+$/.test(before)) {
                  setResult(true, 'push-zero-before');
                  return;
                }

                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${before}...${after}`,
                });
                const files = comparison.files || [];
                // Compare exposes at most 300 files. The boundary may be truncated.
                if (files.length === 0 || files.length >= 300) {
                  setResult(true, 'push-file-list-empty-or-unusable');
                  return;
                }
                evaluateFiles(files);
                return;
              }

              if (context.eventName === 'workflow_dispatch') {
                setResult(true, 'manual-or-tag');
                return;
              }

              setResult(true, `unsupported-event:${context.eventName}`);
            } catch (error) {
              core.warning(`Frontend impact detection failed; running frontend gates. ${error.message}`);
              setResult(true, 'detection-error');
            }

  # [#2393] 기본 테스트 병렬화 — 테스트 바이너리를 한 번 빌드해 아카이브하고
  # 8개 샤드가 컴파일 없이 나눠 실행한다. [#3266] Native Skia와 archive는 같은
  # lint/frontend gate 뒤 병렬로 시작한다. Native 실패 시 archive가 끝날 수는 있어도
  # shard는 두 job 성공 뒤에만 시작하므로 #3064의 테스트 실행 차단은 유지된다.
  # required check 는 집계 job "Build & Test" 로 불변이다.
  build-test-archive:
    name: Build test archive
    runs-on: ubuntu-latest
    needs: [preflight, lint, frontend-package-gates]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.lint.result == 'success'
        && (
          needs['frontend-package-gates'].result == 'success'
          || (
            needs.preflight.outputs.frontend_required != 'true'
            && needs['frontend-package-gates'].result == 'skipped'
          )
        )
      }}
    permissions:
      contents: read
    outputs:
      cargo_profile: ${{ steps.profile.outputs.cargo_profile }}
      runnable_tests: ${{ steps.count.outputs.runnable_tests }}

    steps:
      - uses: actions/checkout@v5

      # [Task #1109 / #1192 C] ubuntu-latest runner 의 미사용 사전 설치 toolchain 제거하여
      # 테스트 빌드 시 디스크 한도 초과를 줄인다.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # [#2393] 수동 restore/save 캐시 → rust-cache (적중률·정리 자동화).
      # 저장 정책은 종전과 동일하게 devel/main push 로 한정.
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-archive
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      # [Task #1849] PR/devel push 는 release-test 전체 회귀, main/tag/manual 은 release.
      - name: Select cargo profile
        id: profile
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] || [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/devel" ]]; then
            echo "cargo_profile=release-test" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_profile=release" >> "$GITHUB_OUTPUT"
          fi

      # [Task #1667] nextest archive 는 default-feature test=true 전 타깃(rhwp lib
      # 테스트 실행 파일 포함)과 CLI 테스트가 쓰는 비테스트 바이너리(rhwp)까지 담는다.
      - name: Build and archive default-feature tests
        run: |
          echo "profile=${{ steps.profile.outputs.cargo_profile }} event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
          cargo nextest archive \
            --cargo-profile "${{ steps.profile.outputs.cargo_profile }}" \
            --archive-file tests.tar.zst

      # [#2393] 샤드 합계 대조의 기대치 — 비-ignored(runnable) 테스트 수.
      # nextest Summary 의 skipped 는 파티션 제외분과 #[ignore] 를 합산하므로
      # run 합계의 기준은 total 이 아니라 runnable 이다 (3차 PR CI 실측: 23 ignored).
      - name: Count runnable tests
        id: count
        run: |
          runnable=$(cargo nextest list \
            --cargo-profile "${{ steps.profile.outputs.cargo_profile }}" \
            --message-format json \
            | jq '[."rust-suites"[].testcases | to_entries[] | select(.value.ignored | not)] | length')
          if [[ -z "$runnable" || "$runnable" == "0" ]]; then
            echo "::error::runnable test count unavailable"; exit 1
          fi
          echo "runnable_tests=$runnable" >> "$GITHUB_OUTPUT"
          echo "runnable_tests=$runnable"

      - name: Upload test archive
        uses: actions/upload-artifact@v7
        with:
          name: test-archive-${{ github.run_id }}
          path: tests.tar.zst
          # tests.tar.zst 는 cargo-nextest가 이미 압축한 파일이다. ZIP 재압축 CPU를
          # 쓰지 않아 Native Skia와 겹치는 archive 준비 시간을 더 줄인다. (#3266)
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test-shard:
    name: Default-feature tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    needs: [preflight, native-skia-tests, build-test-archive]
    # [#3266] archive와 Native Skia를 병렬화하되, 두 필수 worker가 모두 성공한
    # 뒤에만 기본 테스트를 실행한다. 따라서 Native 실패 시 archive가 완료돼도 shard는 skip된다.
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs['native-skia-tests'].result == 'success'
        && needs['build-test-archive'].result == 'success'
      }}
    permissions:
      contents: read
    strategy:
      # [#3064] 8개 shard는 계속 병렬 실행하되 하나가 실패하면 나머지를 즉시 취소한다.
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      # 테스트가 samples/ pdf/ 등 저장소 픽스처를 읽으므로 checkout 필요.
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Download test archive
        uses: actions/download-artifact@v8
        with:
          name: test-archive-${{ github.run_id }}

      # [#2393] 공허 통과 방지: Summary 의 run/skipped 를 파싱해 샤드별
      # `<run> <total>` 을 아티팩트로 남긴다. 집계 job 이 8샤드 합계 = 전체
      # 테스트 수를 대조한다 (샤드 누락·파티션 중복이 green 으로 위장 불가).
      - name: Run shard ${{ matrix.shard }}/8
        run: |
          set -o pipefail
          # --extract-to . : CLI 테스트의 env!("CARGO_BIN_EXE_rhwp") 는 빌드
          # 러너 절대 경로가 컴파일 타임에 박힌다. GitHub 러너는 job 간
          # workspace 경로가 동일하므로 워크스페이스에 풀어 target/ 경로를
          # 그대로 복원한다 (임시 디렉터리 추출 시 NotFound — PR CI 실측).
          cargo nextest run \
            --archive-file tests.tar.zst \
            --workspace-remap . \
            --extract-to . \
            --partition "hash:${{ matrix.shard }}/8" \
            2>&1 | tee nextest-shard.log
          # CARGO_TERM_COLOR=always 로 Summary 라인에 ANSI 색코드가 섞이므로
          # 스트립 후 파싱한다 (2차 PR CI 실측 — 376 run green 인데 파싱 실패).
          summary=$(sed 's/\x1b\[[0-9;]*m//g' nextest-shard.log | grep -E "Summary \[" | tail -1)
          run=$(echo "$summary" | grep -oE "[0-9]+ tests run" | grep -oE "^[0-9]+")
          skipped=$(echo "$summary" | grep -oE "[0-9]+ skipped" | grep -oE "^[0-9]+" || echo 0)
          if [[ -z "$run" ]]; then
            echo "::error::shard summary parse failed"; exit 1
          fi
          echo "$run $((run + skipped))" > "shard-count-${{ matrix.shard }}.txt"
          cat "shard-count-${{ matrix.shard }}.txt"

      - name: Upload shard count
        uses: actions/upload-artifact@v7
        with:
          name: shard-count-${{ matrix.shard }}
          path: shard-count-${{ matrix.shard }}.txt
          retention-days: 1
          if-no-files-found: error

  lint:
    name: Lint (fmt, clippy, WASM check)
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ always() && needs.preflight.outputs.fast_pass != 'true' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --lib

  native-skia-tests:
    name: Native Skia tests
    runs-on: ubuntu-latest
    needs: [preflight, lint, frontend-package-gates]
    # frontend 비대상 job의 skipped는 정상 경로다. 대상 job의 실패/취소와 lint 실패는
    # native-skia 이후 worker 전체에 전파한다.
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.lint.result == 'success'
        && (
          needs['frontend-package-gates'].result == 'success'
          || (
            needs.preflight.outputs.frontend_required != 'true'
            && needs['frontend-package-gates'].result == 'skipped'
          )
        )
      }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # [Task #1109 / #1192 C] ubuntu-latest runner 의 미사용 사전 설치 toolchain 제거하여
      # 테스트 빌드 시 디스크 한도 초과를 줄인다.
      # [#1192] 캐시 정상 작동 확인 후 "크고 빠른" 항목(android/dotnet)만 남기고 축소.
      # 느린 docker prune --all / apt clean / ghc / CodeQL 정리는 제거. df -h 로 여유 확인.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      # [#2431 C] 기본 test job 의 rust-cache 이행 후 writer가 사라진
      # Linux-cargo-* namespace 대신 Native Skia 전용 shared key를 사용한다.
      # PR은 restore-only, devel/main push만 save하는 신뢰 경계를 유지한다.
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-skia
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      - name: Install native Skia runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Native Skia tests
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] || [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/devel" ]]; then
            echo "profile=release-test event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
            cargo test --profile release-test --features native-skia skia --lib --verbose
            cargo test --profile release-test --features native-skia --test issue_2225_missing_picture_placeholder --verbose
            cargo test --profile release-test --features native-skia --test render_p37_direct_pdf_export --verbose
          else
            echo "profile=release event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
            cargo test --release --features native-skia skia --lib --verbose
            cargo test --release --features native-skia --test issue_2225_missing_picture_placeholder --verbose
            cargo test --release --features native-skia --test render_p37_direct_pdf_export --verbose
          fi

  frontend-package-gates:
    name: Frontend package gates
    runs-on: ubuntu-latest
    needs: [preflight, lint]
    if: ${{ always() && needs.preflight.result == 'success' && needs.lint.result == 'success' && needs.preflight.outputs.fast_pass != 'true' && needs.preflight.outputs.frontend_required == 'true' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Restore frontend WASM cargo cache
        id: frontend_wasm_cargo_cache_restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-frontend-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-wasm-cargo-

      - name: Build fresh WASM package for frontend gates
        run: wasm-pack build --target web --dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            rhwp-studio/package-lock.json
            rhwp-chrome/package-lock.json
            rhwp-firefox/package-lock.json
            rhwp-vscode/package-lock.json

      - name: Install frontend package dependencies
        run: |
          npm --prefix rhwp-studio ci
          npm --prefix rhwp-chrome ci
          npm --prefix rhwp-firefox ci
          npm --prefix rhwp-vscode ci

      - name: Verify WASM bindings and editor embed contract
        run: node --test scripts/frontend-wasm-bindings.test.mjs scripts/frontend-editor-embed.test.mjs

      - name: Run editor package tests when declared
        run: npm --prefix npm/editor test --if-present

      - name: Run shared and extension service worker tests
        run: node --test rhwp-shared/sw/*.test.js rhwp-chrome/sw/*.test.mjs rhwp-firefox/sw/*.test.mjs

      - name: Run Chrome extension options UI tests
        run: node --test rhwp-chrome/options.test.mjs

      - name: Run Studio unit tests
        run: npm --prefix rhwp-studio run test

      - name: Build Studio
        run: npm --prefix rhwp-studio run build

      - name: Build browser extensions
        run: |
          npm --prefix rhwp-chrome run build
          npm --prefix rhwp-firefox run build

      - name: Verify extension distributions
        run: node --test scripts/frontend-extension-dist.test.mjs

      - name: Compile VS Code extension
        run: npm --prefix rhwp-vscode run compile

      - name: Verify font asset contracts
        run: node --test scripts/frontend-font-assets.test.mjs

      - name: Save frontend WASM cargo cache
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') && steps.frontend_wasm_cargo_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-frontend-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build-test-archive
      - test-shard
      - lint
      - native-skia-tests
      - frontend-package-gates
    if: ${{ always() }}
    permissions:
      contents: read

    steps:
      # [#2393] 샤드 합계 대조 — 8샤드의 `<run> <total>` 을 모아 합계가 전체
      # 테스트 수와 일치하는지 검증한다 (fast-pass 시 샤드 미실행이라 생략).
      - name: Download shard counts
        if: ${{ needs.preflight.outputs.fast_pass != 'true' && needs['test-shard'].result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: shard-count-*
          merge-multiple: true

      - name: Verify shard totals
        if: ${{ needs.preflight.outputs.fast_pass != 'true' && needs['test-shard'].result == 'success' }}
        env:
          EXPECTED_RUNNABLE: ${{ needs['build-test-archive'].outputs.runnable_tests }}
        run: |
          shards=$(find . -maxdepth 1 -type f -name 'shard-count-*.txt' | wc -l | tr -d ' ')
          if [[ "$shards" != "8" ]]; then
            echo "::error::expected 8 shard count files, found ${shards}"
            exit 1
          fi
          if [[ -z "${EXPECTED_RUNNABLE}" ]]; then
            echo "::error::expected runnable test count missing from build-test-archive"
            exit 1
          fi
          sum=0; total=""
          for f in shard-count-*.txt; do
            read -r run t < "$f"
            sum=$((sum + run))
            if [[ -z "$total" ]]; then total="$t"; fi
            if [[ "$t" != "$total" ]]; then
              echo "::error::shard total mismatch: ${f} says ${t}, expected ${total}"
              exit 1
            fi
            echo "${f}: run=${run} total=${t}"
          done
          # 기대치는 runnable(비-ignored) — Summary 의 skipped 는 파티션 제외분과
          # #[ignore] 합산이라 total 과의 직접 비교는 성립하지 않는다 (3차 실측).
          echo "sum(run)=${sum} expected runnable=${EXPECTED_RUNNABLE} (listed total=${total})"
          if [[ "$sum" != "${EXPECTED_RUNNABLE}" ]]; then
            echo "::error::shard run sum ${sum} != runnable tests ${EXPECTED_RUNNABLE} (누락 또는 중복)"
            exit 1
          fi

      - name: Check Build & Test worker results
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FAST_PASS: ${{ needs.preflight.outputs.fast_pass }}
          FRONTEND_REQUIRED: ${{ needs.preflight.outputs.frontend_required }}
          FRONTEND_REASON: ${{ needs.preflight.outputs.frontend_reason }}
          BUILD_ARCHIVE_RESULT: ${{ needs['build-test-archive'].result }}
          TEST_SHARD_RESULT: ${{ needs['test-shard'].result }}
          LINT_RESULT: ${{ needs['lint'].result }}
          NATIVE_SKIA_RESULT: ${{ needs['native-skia-tests'].result }}
          FRONTEND_RESULT: ${{ needs['frontend-package-gates'].result }}
        run: |
          printf 'preflight=%s\n' "${PREFLIGHT_RESULT}"
          printf 'fast_pass=%s\n' "${FAST_PASS}"
          printf 'frontend_required=%s\n' "${FRONTEND_REQUIRED}"
          printf 'frontend_reason=%s\n' "${FRONTEND_REASON}"
          printf 'build_archive=%s\n' "${BUILD_ARCHIVE_RESULT}"
          printf 'test_shard=%s\n' "${TEST_SHARD_RESULT}"
          printf 'lint=%s\n' "${LINT_RESULT}"
          printf 'native_skia=%s\n' "${NATIVE_SKIA_RESULT}"
          printf 'frontend=%s\n' "${FRONTEND_RESULT}"

          if [[ "${PREFLIGHT_RESULT}" != "success" ]]; then
            echo "::error::CI preflight did not succeed: ${PREFLIGHT_RESULT}"
            exit 1
          fi

          if [[ "${FAST_PASS}" == "true" ]]; then
            echo "CI preflight fast-pass accepted."
            exit 0
          fi

          failed=0
          if [[ "${BUILD_ARCHIVE_RESULT}" != "success" ]]; then
            echo "::error::Build test archive result: ${BUILD_ARCHIVE_RESULT}"
            failed=1
          fi
          if [[ "${TEST_SHARD_RESULT}" != "success" ]]; then
            echo "::error::Default-feature test shards result: ${TEST_SHARD_RESULT}"
            failed=1
          fi
          if [[ "${LINT_RESULT}" != "success" ]]; then
            echo "::error::Lint result: ${LINT_RESULT}"
            failed=1
          fi
          if [[ "${NATIVE_SKIA_RESULT}" != "success" ]]; then
            echo "::error::Native Skia tests result: ${NATIVE_SKIA_RESULT}"
            failed=1
          fi
          if [[ "${FRONTEND_REQUIRED}" == "false" ]]; then
            if [[ "${FRONTEND_RESULT}" != "skipped" ]]; then
              echo "::error::Frontend gates should be skipped, got: ${FRONTEND_RESULT}"
              failed=1
            fi
          elif [[ "${FRONTEND_RESULT}" != "success" ]]; then
            echo "::error::Frontend package gates result: ${FRONTEND_RESULT}"
            failed=1
          fi
          exit "${failed}"

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v5

      # [Task #1109 / #1192 C] wasm-build job 도 build-and-test 와 동일 축소 패턴.
      # "크고 빠른" 항목(android/dotnet)만 제거. df -h 로 여유 확인.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM
        run: wasm-pack build --target web --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rhwp-wasm-pkg
          path: pkg/
          retention-days: 30
