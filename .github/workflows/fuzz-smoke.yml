name: Fuzz smoke

# M03-1 / #5359 — #3141 1단계 스모크 배선.
# 기존 cargo-fuzz 타깃 6개(parse_hwp / parse_hwp3 / parse_hwpx / parse_hml /
# parse_wmf / parse_ooxml_chart)를 각 60초 돌리고, 크래시·타임아웃·OOM 산출물을
# 실패 시 아티팩트로 올린다.
#
# PR required check 가 아니다. pull_request 트리거를 두지 않는다.
# DoS 수정은 M03-3 이후. OSS-Fuzz 등재는 M10. 왕복 정합성은 M04.

on:
  schedule:
    # 다른 nightly(cache-generation-sweep 18:23, CodeQL 월 06:00)와 시각을 겹치지 않게 한다.
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      runner_image:
        description: 'Linux baseline (26.04 is an explicit compatibility run)'
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04
      max_total_time:
        description: 타깃당 libFuzzer 실행 초 (nightly 기본 60)
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: fuzz-smoke
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RHWP_RUNNER_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image == 'ubuntu-26.04' && 'ubuntu-26.04' || 'ubuntu-24.04' }}

jobs:
  fuzz-smoke:
    name: fuzz ${{ matrix.target }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image == 'ubuntu-26.04' && 'ubuntu-26.04' || 'ubuntu-24.04' }}
    # Sanitizer cold build와 퍼징을 구분한다. 입력별 제한·실행 시간은 아래에서 유지한다.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_hwp
          - parse_hwp3
          - parse_hwpx
          - parse_hml
          - parse_wmf
          - parse_ooxml_chart
    steps:
      - name: Validate runner selection
        env:
          REQUESTED_RUNNER_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-24.04' }}
        run: |
          set -euo pipefail
          case "${REQUESTED_RUNNER_IMAGE}" in
            ubuntu-24.04|ubuntu-26.04) ;;
            *) echo "::error::Unsupported runner_image" >&2; exit 1 ;;
          esac
          if [[ "${REQUESTED_RUNNER_IMAGE}" != "${RHWP_RUNNER_IMAGE}" ]]; then
            echo "::error::Runner selection does not match the requested baseline" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: nightly

      - name: Cache cargo-fuzz + sanitizer build
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.9.3 이후 workspace root key 보정
        with:
          workspaces: fuzz
          shared-key: fuzz-smoke-${{ matrix.target }}-${{ env.RHWP_RUNNER_IMAGE }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      # 기본 단일 codegen unit의 실측 peak는 16.6 GiB였다 (#9154).
      # build/run이 같은 분할을 사용하며 ASan·coverage·overflow 검사는 유지한다.
      - name: Build sanitizer target ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          free -m
          nproc
          /usr/bin/time -v cargo +nightly fuzz build --codegen-units 16 "${TARGET}"

      - name: Smoke-run ${{ matrix.target }} (60s)
        env:
          TARGET: ${{ matrix.target }}
          MAX_TOTAL_TIME: ${{ github.event_name == 'workflow_dispatch' && inputs.max_total_time || '60' }}
        run: |
          set -euo pipefail
          cargo +nightly fuzz run --codegen-units 16 "${TARGET}" -- \
            -max_total_time="${MAX_TOTAL_TIME}" \
            -rss_limit_mb=2048 \
            -timeout=30 \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
