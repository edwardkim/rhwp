name: CodeQL

on:
  push:
    branches: [main, devel]
    paths-ignore:
      - 'mydocs/**'
      - 'docs/**'
      - 'samples/**'
      - 'assets/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  pull_request:
    branches: [main, devel]
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - 'assets/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  schedule:
    - cron: '0 6 * * 1'  # 매주 월요일 06:00 UTC
  workflow_dispatch:

# [Task #1192 F] 같은 PR 에 새 push 가 오면 진행 중 run 을 취소해 중복 실행 제거.
# cancel-in-progress 는 PR 이벤트에서만 활성화 — push/schedule(주간 cron) run 은 보존.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: CodeQL preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      fast_pass: ${{ steps.finalize.outputs.fast_pass || 'false' }}
      reason: ${{ steps.finalize.outputs.reason || 'preflight-unavailable' }}
      candidate_sha: ${{ steps.finalize.outputs.candidate_sha || '' }}

    steps:
      - name: Detect review-only fast pass
        id: detect
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const requiredChecks = [
              'Analyze (javascript-typescript)',
              'Analyze (python)',
              'Analyze (rust)',
            ];
            const allowedConclusions = new Set(['success', 'skipped', 'neutral']);
            const { owner, repo } = context.repo;

            function setResult(fastPass, reason, candidateSha = '') {
              core.setOutput('fast_pass', fastPass ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.info(`fast_pass=${fastPass} reason=${reason} candidate_sha=${candidateSha}`);
            }

            function setPendingBaseMergeResult(reason, candidateSha, mergeSha, sourceParentSha) {
              core.setOutput('fast_pass', 'pending-base-merge-tree');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.setOutput('base_merge_sha', mergeSha);
              core.setOutput('source_parent_sha', sourceParentSha);
              core.info(
                `fast_pass=pending-base-merge-tree reason=${reason} candidate_sha=${candidateSha} `
                + `base_merge_sha=${mergeSha} source_parent_sha=${sourceParentSha}`,
              );
            }

            function isAllowedReviewPath(file) {
              const filename = file.filename;
              if (filename.startsWith('mydocs/')) {
                return true;
              }
              if (file.status !== 'added') {
                return false;
              }
              return isReviewReferencePath(filename);
            }

            function isReviewReferencePath(filename) {
              return (
                filename.startsWith('samples/')
                && (
                  filename.endsWith('.hwp')
                  || filename.endsWith('.hwpx')
                  || filename.endsWith('.hml')
                  || filename.endsWith('.pdf')
                  || filename.endsWith('.png')
                )
              ) || (filename.startsWith('pdf/') && filename.endsWith('.pdf'));
            }

            function reviewOnlyLabel(files) {
              const hasReferenceArtifact = files.some((file) => (
                file.status === 'added'
                && isReviewReferencePath(file.filename)
              ));
              return hasReferenceArtifact ? 'review-reference-only' : 'mydocs-only';
            }

            function isCurrentBaseUpdateMerge(commit, baseSha) {
              const parents = commit.parents || [];
              return parents.length === 2
                && parents.filter((parent) => parent.sha === baseSha).length === 1;
            }

            function isCiExecutionPath(filename) {
              return filename.startsWith('.github/workflows/')
                || filename.startsWith('.github/actions/')
                || filename === 'scripts/ci-impact-classifier.cjs'
                || filename === 'scripts/verify_review_only_merge_resolution.py';
            }

            function latestRun(runs) {
              return runs
                .slice()
                .sort((a, b) => {
                  const bTime = Date.parse(b.completed_at || b.started_at || b.created_at || 0);
                  const aTime = Date.parse(a.completed_at || a.started_at || a.created_at || 0);
                  return bTime - aTime;
                })[0];
            }

            async function codeqlResult(candidateSha, pr) {
              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'codeql.yml',
                event: 'pull_request',
                per_page: 100,
              });
              const workflowRun = latestRun(workflowRuns.filter((run) => (
                run.path === '.github/workflows/codeql.yml'
                && run.event === 'pull_request'
                && run.head_sha === candidateSha
                && run.head_branch === pr.head.ref
                && run.head_repository?.id === pr.head.repo?.id
              )));
              if (!workflowRun) {
                return { state: 'missing', reason: `missing-codeql-workflow:${candidateSha}` };
              }
              const runCreatedAt = Date.parse(workflowRun.created_at);
              const runAttemptStartedAt = Date.parse(
                workflowRun.run_started_at || workflowRun.created_at,
              );
              const pullCreatedAt = Date.parse(pr.created_at);
              if (!Number.isFinite(runCreatedAt)
                || !Number.isFinite(runAttemptStartedAt)
                || !Number.isFinite(pullCreatedAt)
                || runCreatedAt < pullCreatedAt
                || runAttemptStartedAt < runCreatedAt) {
                return { state: 'failed', reason: 'codeql-workflow-pr-identity-mismatch' };
              }
              if (workflowRun.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `codeql-workflow-not-completed:${workflowRun.status}`,
                };
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: workflowRun.id,
                filter: 'latest',
                per_page: 100,
              });

              for (const checkName of requiredChecks) {
                const checkRun = latestRun(jobs.filter((job) => job.name === checkName));
                if (!checkRun) {
                  return { state: 'missing', reason: `missing-check:${checkName}:${candidateSha}` };
                }
                if (checkRun.status !== 'completed') {
                  return {
                    state: 'pending',
                    reason: `check-not-completed:${checkName}:${checkRun.status}`,
                  };
                }
                if (!allowedConclusions.has(checkRun.conclusion)) {
                  return {
                    state: 'failed',
                    reason: `check-not-green:${checkName}:${checkRun.conclusion}`,
                  };
                }
              }

              // Each Analyze job must succeed independently. The repository currently
              // emits one GHAS CodeQL policy check when the first language analysis
              // arrives; bind that observed check to this candidate and run attempt.
              // Do not infer later-language policy coverage from this single check.
              const securityChecks = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: candidateSha,
                filter: 'latest',
                per_page: 100,
              });
              const securityCheck = latestRun(securityChecks.filter((check) => (
                check.app?.slug === 'github-advanced-security'
                  && check.name === 'CodeQL'
                  && check.head_sha === candidateSha
              )));
              if (!securityCheck) {
                return {
                  state: 'missing',
                  reason: `missing-security-check:CodeQL:${candidateSha}`,
                };
              }
              const securityCheckStartedAt = Date.parse(securityCheck.started_at);
              if (!Number.isFinite(securityCheckStartedAt)
                || securityCheckStartedAt < runAttemptStartedAt) {
                return {
                  state: 'missing',
                  reason: `missing-security-check:CodeQL:${candidateSha}`,
                };
              }
              if (securityCheck.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `security-check-not-completed:CodeQL:${securityCheck.status}`,
                };
              }
              if (securityCheck.conclusion !== 'success') {
                return {
                  state: 'failed',
                  reason: `security-check-not-green:CodeQL:${securityCheck.conclusion}`,
                };
              }
              return { state: 'green' };
            }

            try {
              if (context.eventName !== 'pull_request') {
                setResult(false, 'not-pull-request');
                return;
              }

              const pr = context.payload.pull_request;
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              if (prFiles.length > 0 && prFiles.every((file) => isAllowedReviewPath(file))) {
                core.info(`all PR files are review-only; using base SHA ${pr.base.sha}`);
                setResult(true, 'all-review-only-no-code-impact', pr.base.sha);
                return;
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });

              if (commits.length === 0) {
                setResult(false, 'no-pr-commits');
                return;
              }

              const latestCommitSha = commits.at(-1).sha;
              const { data: latestCommit } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: latestCommitSha,
              });
              if (isCurrentBaseUpdateMerge(latestCommit, pr.base.sha)) {
                if (prFiles.some((file) => isCiExecutionPath(file.filename))) {
                  setResult(false, 'current-base-source-ci-execution-change');
                  return;
                }
                const sourceParent = latestCommit.parents.find(
                  (parent) => parent.sha !== pr.base.sha,
                );
                if (!sourceParent) {
                  setResult(false, 'current-base-source-parent-unavailable');
                  return;
                }
                const sourceResult = await codeqlResult(sourceParent.sha, pr);
                if (sourceResult.state === 'green') {
                  setPendingBaseMergeResult(
                    'direct-source-codeql-checks-green',
                    sourceParent.sha,
                    latestCommitSha,
                    sourceParent.sha,
                  );
                  return;
                }
                setResult(false, `direct-source-${sourceResult.reason}`, sourceParent.sha);
                return;
              }

              const reviewOnlyCandidates = [];
              let codeCandidateSha = '';
              let baseMergeBridge = null;

              for (let index = commits.length - 1; index >= 0; index -= 1) {
                const sha = commits[index].sha;
                const { data: commit } = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: sha,
                });
                const parents = commit.parents || [];
                if (isCurrentBaseUpdateMerge(commit, pr.base.sha)) {
                  if (baseMergeBridge) {
                    setResult(false, `multiple-current-base-update-merges:${sha}`);
                    return;
                  }
                  const sourceParent = parents.find((parent) => parent.sha !== pr.base.sha);
                  baseMergeBridge = { mergeSha: sha, sourceParentSha: sourceParent.sha };
                  core.info(`including current-base update merge bridge ${sha}`);
                  continue;
                }
                const files = commit.files || [];

                // The commit endpoint may truncate very large file lists. Fall back to full CodeQL.
                if (files.length === 0 || files.length >= 300) {
                  setResult(false, `unusable-file-list:${sha}`);
                  return;
                }

                const reviewOnly = files.every((file) => isAllowedReviewPath(file));
                if (reviewOnly) {
                  if (parents.length === 1) {
                    reviewOnlyCandidates.push(sha);
                    continue;
                  }
                  setResult(false, `${reviewOnlyLabel(files)}-merge-not-reusable:${sha}`);
                  return;
                }

                codeCandidateSha = sha;
                break;
              }

              if (reviewOnlyCandidates.length === 0) {
                setResult(false, 'no-trailing-review-only-commits');
                return;
              }
              if (codeCandidateSha) {
                reviewOnlyCandidates.push(codeCandidateSha);
              }

              for (const candidateSha of reviewOnlyCandidates) {
                const result = await codeqlResult(candidateSha, pr);
                if (result.state === 'green') {
                  if (baseMergeBridge) {
                    setPendingBaseMergeResult(
                      'codeql-checks-green',
                      candidateSha,
                      baseMergeBridge.mergeSha,
                      baseMergeBridge.sourceParentSha,
                    );
                    return;
                  }
                  setResult(true, 'codeql-checks-green', candidateSha);
                  return;
                }
                if (result.state === 'failed') {
                  setResult(false, result.reason, candidateSha);
                  return;
                }
                core.info(`candidate not reusable yet: ${candidateSha} (${result.reason})`);
              }

              setResult(false, 'no-green-codeql-candidate');
            } catch (error) {
              core.warning(`CodeQL preflight failed; running full CodeQL. ${error.message}`);
              setResult(false, 'preflight-error');
            }

      # 기준선 병합을 fast-pass bridge로 쓸 때는 untrusted source를 실행하지 않는다.
      # 자동 3-way merge tree가 같거나, 충돌 해소가 mydocs로 한정될 때만 재사용한다.
      - name: Check out current-base merge tree inputs
        id: checkout-base-merge-tree
        if: ${{ steps.detect.outputs.fast_pass == 'pending-base-merge-tree' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify current-base merge tree
        id: verify-base-merge-tree
        if: ${{ always() && steps.detect.outputs.fast_pass == 'pending-base-merge-tree' }}
        shell: bash
        env:
          BASE_MERGE_SHA: ${{ steps.detect.outputs.base_merge_sha }}
          SOURCE_PARENT_SHA: ${{ steps.detect.outputs.source_parent_sha }}
          CURRENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          fail() {
            printf 'verified=false\nreason=%s\n' "$1" >> "$GITHUB_OUTPUT"
          }

          if ! git cat-file -e "${BASE_MERGE_SHA}^{commit}" \
            || ! git cat-file -e "${SOURCE_PARENT_SHA}^{commit}" \
            || ! git cat-file -e "${CURRENT_BASE_SHA}^{commit}"; then
            fail 'current-base-merge-input-unavailable'
            exit 0
          fi

          if ! expected_tree="$(git merge-tree --write-tree "${SOURCE_PARENT_SHA}" "${CURRENT_BASE_SHA}" 2>/dev/null)"; then
            resolution_check="$(mktemp)"
            trap 'rm -f "${resolution_check}"' EXIT
            if ! git show "${CURRENT_BASE_SHA}:scripts/verify_review_only_merge_resolution.py" \
              > "${resolution_check}"; then
              fail 'current-base-merge-resolution-check-unavailable'
            elif resolution_reason="$(python3 "${resolution_check}" \
              --repository . --base-sha "${CURRENT_BASE_SHA}" "${BASE_MERGE_SHA}")"; then
              printf 'verified=true\nreason=%s\n' "${resolution_reason}" >> "$GITHUB_OUTPUT"
            else
              fail 'current-base-merge-resolution-not-mydocs'
            fi
            exit 0
          fi
          expected_tree="${expected_tree%%$'\n'*}"
          actual_tree="$(git show -s --format=%T "${BASE_MERGE_SHA}")"
          if [[ "${expected_tree}" != "${actual_tree}" ]]; then
            fail 'current-base-merge-tree-mismatch'
            exit 0
          fi

          printf 'verified=true\nreason=current-base-merge-tree-match\n' >> "$GITHUB_OUTPUT"

      - name: Finalize review-only fast pass
        id: finalize
        if: ${{ always() }}
        shell: bash
        env:
          DETECTED_FAST_PASS: ${{ steps.detect.outputs.fast_pass || 'false' }}
          DETECTED_REASON: ${{ steps.detect.outputs.reason || 'preflight-unavailable' }}
          CANDIDATE_SHA: ${{ steps.detect.outputs.candidate_sha || '' }}
          MERGE_TREE_VERIFIED: ${{ steps.verify-base-merge-tree.outputs.verified || 'false' }}
          MERGE_TREE_REASON: ${{ steps.verify-base-merge-tree.outputs.reason || 'not-required' }}
        run: |
          set -euo pipefail
          fast_pass="${DETECTED_FAST_PASS}"
          reason="${DETECTED_REASON}"
          if [[ "${DETECTED_FAST_PASS}" == 'pending-base-merge-tree' ]]; then
            if [[ "${MERGE_TREE_VERIFIED}" == 'true' ]]; then
              fast_pass='true'
              if [[ "${MERGE_TREE_REASON}" == 'current-base-merge-resolution-mydocs-only' ]]; then
                reason="current-base-update-merge-resolution-mydocs-only-green:${CANDIDATE_SHA}"
              else
                reason="current-base-update-merge-tree-green:${CANDIDATE_SHA}"
              fi
            else
              fast_pass='false'
              reason="${MERGE_TREE_REASON}"
            fi
          fi
          printf 'fast_pass=%s\nreason=%s\ncandidate_sha=%s\n' \
            "${fast_pass}" "${reason}" "${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight
    if: ${{ always() && needs.preflight.outputs.fast_pass != 'true' }}
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, rust]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # [#3290] 호스티드 16GB VM 은 CodeQL 자동 감지 값이 적정하다. self-hosted 로
      # 되돌릴 경우 ram/threads 캡 필수 — #3289 사고(무캡 JVM 40~55GB×2 로 호스트
      # 포화·스톨) 및 task_m100_3289_report.md 거버넌스 절 참조.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)

      # [#3790 Stage 5A] 기본 build mode의 내부 autobuild가 같은 source alert와
      # fingerprint를 생성함을 canary로 확인했다. 중복 cache·수동 prebuild는 실행하지 않는다.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
