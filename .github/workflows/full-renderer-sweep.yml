name: Full Renderer Sweep

on:
  workflow_dispatch:
    inputs:
      runner_image:
        description: 'Linux baseline (26.04 is an explicit compatibility run)'
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04
      corpus:
        description: Renderer baseline corpus tier
        required: true
        default: representative
        type: choice
        options:
          - representative
          - full

env:
  CARGO_TERM_COLOR: always
  RHWP_RUNNER_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image == 'ubuntu-26.04' && 'ubuntu-26.04' || 'ubuntu-24.04' }}

jobs:
  full-renderer-sweep:
    name: Full Renderer Sweep
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image == 'ubuntu-26.04' && 'ubuntu-26.04' || 'ubuntu-24.04' }}
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    # Cold WASM build and all multi-profile/surface captures retain their full scope.
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Validate runner selection
        env:
          REQUESTED_RUNNER_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-24.04' }}
        run: |
          set -euo pipefail
          case "${REQUESTED_RUNNER_IMAGE}" in
            ubuntu-24.04|ubuntu-26.04) ;;
            *) echo "::error::Unsupported runner_image" >&2; exit 1 ;;
          esac
          if [[ "${REQUESTED_RUNNER_IMAGE}" != "${RHWP_RUNNER_IMAGE}" ]]; then
            echo "::error::Runner selection does not match the requested baseline" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RHWP_RUNNER_IMAGE }}-full-renderer-sweep-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RHWP_RUNNER_IMAGE }}-full-renderer-sweep-cargo-
            ${{ runner.os }}-${{ env.RHWP_RUNNER_IMAGE }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rhwp-studio/package-lock.json

      - name: Install font packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core fonts-noto-mono fonts-nanum libfontconfig1-dev libfreetype6-dev

      - name: Install studio dependencies
        working-directory: rhwp-studio
        run: npm ci

      - name: Install headless Chrome
        working-directory: rhwp-studio
        run: |
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            chrome_install_output="$(./node_modules/.bin/browsers install chrome@stable --path "$HOME/.cache/puppeteer" --format '{{path}}' 2>&1)" || {
              printf '%s\n' "$chrome_install_output" >&2
              exit 1
            }
            chrome_path="$(printf '%s\n' "$chrome_install_output" | tail -n 1)"
          fi
          if [ ! -f "$chrome_path" ]; then
            chrome_path="$(find "$HOME/.cache/puppeteer" -type f \( -name chrome -o -name chrome-headless-shell \) | sort | tail -n 1)"
          fi
          if [ -z "$chrome_path" ] || [ ! -f "$chrome_path" ]; then
            echo "Chrome executable not found under $HOME/.cache/puppeteer" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Run native Skia tests
        run: cargo test --features native-skia skia --lib --verbose

      - name: Build WASM package
        run: wasm-pack build --target web --release

      - name: Build studio
        working-directory: rhwp-studio
        run: npm run build

      - name: Run browser render diff sweep
        working-directory: rhwp-studio
        env:
          RHWP_RENDER_SAMPLE_SCOPE: full
          RHWP_RENDER_DIFF_ALL: "1"
        run: npm run e2e:render-diff:ci

      - name: Capture selected multi-profile baseline
        run: python3 scripts/renderer_baseline.py --scope ${{ inputs.corpus }} --profiles screen,print,high-quality,fast-preview --include-pdf --browser-mode headless --output output/renderer-baseline/workflow-dispatch

      - name: Capture WebGPU-preferred CanvasKit baseline
        run: python3 scripts/renderer_baseline.py --scope representative --profiles screen --browser-mode headless --canvaskit-surface webgpu --skip-native --output output/renderer-baseline/workflow-dispatch-webgpu

      - name: Capture software CanvasKit baseline
        run: python3 scripts/renderer_baseline.py --scope representative --profiles screen --browser-mode headless --canvaskit-surface software --skip-native --output output/renderer-baseline/workflow-dispatch-software

      - name: Upload full renderer sweep artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-renderer-sweep-artifacts
          path: |
            output/layer-svg-diff/
            output/skia-diff/
            output/e2e/
            output/renderer-baseline/
            rhwp-studio/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14
