name: Build Nextest Archives

on:
  workflow_call:
    inputs:
      builder:
        description: Archive builder ownership label.
        required: true
        type: string
      archive_labels:
        description: Space-separated archive labels owned by this builder.
        required: true
        type: string
      expected_count_suffix:
        description: Unique artifact suffix for this builder's expected runnable counts.
        required: true
        type: string

jobs:
  build:
    name: Build test archive (${{ inputs.archive_labels }})
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # [Task #1109 / #1192 C] ubuntu-latest runner 의 미사용 사전 설치 toolchain 제거하여
      # 테스트 빌드 시 디스크 한도 초과를 줄인다.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest

      # [#2393] 수동 restore/save 캐시 → rust-cache (적중률·정리 자동화).
      # 저장 정책은 종전과 동일하게 devel/main push 로 한정.
      - name: Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: test-archive
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      # [Task #1849] PR/devel push 는 release-test 전체 회귀, main/tag/manual 은 release.
      - name: Select cargo profile
        id: profile
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] || [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/devel" ]]; then
            echo "cargo_profile=release-test" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_profile=release" >> "$GITHUB_OUTPUT"
          fi

      # [#3888] Cargo metadata의 test target을 slow + regular 세 archive에 독점 배정한다.
      # --test/--lib/--bin selector가 archive 생성과 동시에 해당 target만 compile한다.
      - name: Build and allocate default-feature test archives
        env:
          BUILDER: ${{ inputs.builder }}
          ARCHIVE_LABELS: ${{ inputs.archive_labels }}
        run: |
          echo "profile=${{ steps.profile.outputs.cargo_profile }} event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
          cargo metadata --format-version 1 --no-deps > cargo-metadata.json
          node .github/scripts/plan_nextest_target_archives.mjs \
            --input cargo-metadata.json \
            --output-dir ci-target-archives \
            --package rhwp \
            --slow-test-target overflow_cell_baseline

          for label in ${ARCHIVE_LABELS}; do
            owner=$(jq -r ".archives[\"${label}\"].builder" ci-target-archives/assignment.json)
            if [[ "$owner" != "$BUILDER" ]]; then
              echo "::error::archive ${label} belongs to builder ${owner}, not ${BUILDER}"
              exit 1
            fi
            mapfile -t target_args < "ci-target-archives/${label}.args"
            if [[ "${#target_args[@]}" == "0" ]]; then
              echo "::error::archive ${label} has no Cargo target selector"
              exit 1
            fi
            archive="tests-${label}.tar.zst"
            cargo nextest archive \
              --package rhwp \
              --cargo-profile "${{ steps.profile.outputs.cargo_profile }}" \
              "${target_args[@]}" \
              --archive-file "$archive"
            stat --printf='archive=%n bytes=%s\n' "$archive"

            cargo nextest list \
              --package rhwp \
              --cargo-profile "${{ steps.profile.outputs.cargo_profile }}" \
              "${target_args[@]}" \
              --message-format json > "nextest-list-${label}.json"
            runnable=$(node .github/scripts/count_nextest_runnable.mjs --input "nextest-list-${label}.json")
            if ! [[ "$runnable" =~ ^[0-9]+$ ]]; then
              echo "::error::archive ${label} runnable count is invalid: ${runnable}"
              exit 1
            fi
            printf '%s\n' "$runnable" > "archive-expected-${label}.txt"
            echo "archive=${label} expected_runnable=${runnable}"
          done

      - name: Upload slow test archive
        if: ${{ contains(format(' {0} ', inputs.archive_labels), ' slow ') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-slow
          path: tests-slow.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 1
        if: ${{ contains(format(' {0} ', inputs.archive_labels), ' 1 ') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-1
          path: tests-1.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 2
        if: ${{ contains(format(' {0} ', inputs.archive_labels), ' 2 ') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-2
          path: tests-2.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 3
        if: ${{ contains(format(' {0} ', inputs.archive_labels), ' 3 ') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-3
          path: tests-3.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload archive expected counts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-expected-${{ github.run_id }}-${{ inputs.expected_count_suffix }}
          path: archive-expected-*.txt
          retention-days: 1
          if-no-files-found: error
