name: Native host package

# Explicit packaging evidence only: no PR/push trigger, release, signing or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-host-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            library: librhwp_native_ffi.so
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            library: librhwp_native_ffi.dylib
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            library: rhwp_native_ffi.dll
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/rhwp-native-host-target
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          targets: ${{ matrix.target }}

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install native Skia dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 \
            install -y --no-install-recommends \
            fonts-dejavu-core libfontconfig1-dev libfreetype6-dev

      - name: Check packaging contracts
        run: python bindings/Native/tests/package_native_host_contract.py

      - name: Build native Skia C ABI
        run: cargo build --locked --release -p rhwp-native-ffi --features native-skia --target '${{ matrix.target }}'

      - name: Probe actual library capabilities
        run: |
          python scripts/package-native-host.py \
            --probe-library "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.library }}"

      - name: Package explicit library
        run: |
          mkdir -p dist
          python scripts/package-native-host.py \
            --library "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.library }}" \
            --output "dist/rhwp-native-host-${{ matrix.platform }}" \
            --source-revision "$GITHUB_SHA"

      - name: Exercise packaged headless host
        run: |
          python "dist/rhwp-native-host-${{ matrix.platform }}/run.py" headless \
            --output "$RUNNER_TEMP/rhwp-packaged-smoke.hwpx"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Run/head identity is checked by workflow promotion; fixed names let
          # its policy require all three platform artifacts from that exact run.
          name: rhwp-native-host-${{ matrix.platform }}
          path: dist/rhwp-native-host-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7
