name: Proptest roundtrip

# M04-4 / #5388 — fuzz/README 가 범위 밖으로 둔 왕복 정합성(#2740) 계층.
# nextest archive 정규 shard 도 tests/cases 원본을 돌리지만, 여기 잡은
# debug + 이름 필터로 싸고 명시적으로 돌린다. 10분 퍼지가 아니다.
#
# M04-2 `prop_hwpx_roundtrip` · M04-3 `prop_hwp5_roundtrip` 원본이 없으면
# skip (본체가 아직 안 들어와도 실패하지 않는다). 배선 확인용
# `prop_roundtrip_ci` 는 항상 돈다.

on:
  pull_request:
    branches: [main, devel]
  push:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: proptest-roundtrip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Proptest preflight
    runs-on: ubuntu-latest
    outputs:
      fast_pass: ${{ steps.finalize.outputs.fast_pass || 'false' }}
      reason: ${{ steps.finalize.outputs.reason || 'preflight-unavailable' }}
    steps:
      # 문서 전용 devel PR과 검증된 코드 후보 뒤의 review-only tail도 `prop roundtrip`
      # check 이름은 남겨야 한다. workflow-level paths-ignore를 쓰면 required check가
      # 사라질 수 있으므로 job 조건으로 skip한다.
      - name: Detect review-only or trusted trailing review tail
        id: detect
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            function setResult(fastPass, reason) {
              core.setOutput('fast_pass', fastPass ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.info(`fast_pass=${fastPass} reason=${reason}`);
            }

            if (context.eventName !== 'pull_request') {
              setResult(false, `non-pull-request:${context.eventName}`);
              return;
            }
            const pr = context.payload.pull_request;
            if (!pr || pr.base.ref !== 'devel') {
              setResult(false, `non-devel-base:${pr?.base?.ref || 'unknown'}`);
              return;
            }

            function isAllowedReviewPath(file) {
              const filename = file.filename;
              if (filename.startsWith('mydocs/')) {
                return true;
              }
              if (file.status !== 'added') {
                return false;
              }
              return isReviewReferencePath(filename);
            }

            function isReviewReferencePath(filename) {
              const pdfPrefixes = ['pdf/', 'pdf-2020/', 'pdf-large/'];
              return (
                filename.startsWith('samples/')
                && (
                  filename.endsWith('.hwp')
                  || filename.endsWith('.hwpx')
                  || filename.endsWith('.pdf')
                  || filename.endsWith('.png')
                )
              ) || (
                pdfPrefixes.some((prefix) => filename.startsWith(prefix))
                && filename.endsWith('.pdf')
              );
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (files.length > 0 && files.every((file) => isAllowedReviewPath(file))) {
              setResult(true, 'review-only-devel-pr');
              return;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const reviewOnlyCandidates = [];
            let codeCandidateSha = '';
            let newerTailCommit = null;
            for (let index = commits.length - 1; index >= 0; index -= 1) {
              const commit = commits[index];
              const detail = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: commit.sha,
              });
              const commitFiles = detail.data.files || [];
              if (commitFiles.length === 0 || commitFiles.length >= 300) {
                setResult(false, `unusable-file-list:${commit.sha}`);
                return;
              }
              if (!commitFiles.every((file) => isAllowedReviewPath(file))) {
                codeCandidateSha = commit.sha;
                break;
              }
              const parents = commit.parents || [];
              if (parents.length !== 1
                || (newerTailCommit && newerTailCommit.parents[0].sha !== commit.sha)) {
                setResult(false, 'code-or-non-mydocs-change');
                return;
              }
              reviewOnlyCandidates.push(commit.sha);
              if (reviewOnlyCandidates.length > 20) {
                setResult(false, 'review-tail-too-long');
                return;
              }
              newerTailCommit = commit;
            }
            if (reviewOnlyCandidates.length === 0 || !codeCandidateSha
              || newerTailCommit.parents[0].sha !== codeCandidateSha) {
              setResult(false, 'code-or-non-mydocs-change');
              return;
            }
            reviewOnlyCandidates.push(codeCandidateSha);

            const candidateRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'proptest-roundtrip.yml',
              event: 'pull_request',
              per_page: 100,
            });
            for (const candidateSha of reviewOnlyCandidates) {
              const latestCandidateRun = candidateRuns
                .filter((run) => (
                  run.event === 'pull_request'
                  && run.head_sha === candidateSha
                  && run.head_branch === pr.head.ref
                  && run.head_repository?.id === pr.head.repo?.id
                ))
                .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))[0];
              if (!latestCandidateRun || latestCandidateRun.status !== 'completed') {
                core.info(`candidate not reusable yet: ${candidateSha}`);
                continue;
              }
              const runCreatedAt = Date.parse(latestCandidateRun.created_at || '');
              const pullCreatedAt = Date.parse(pr.created_at || '');
              if (latestCandidateRun.conclusion !== 'success'
                || !Number.isFinite(runCreatedAt)
                || !Number.isFinite(pullCreatedAt)
                || runCreatedAt < pullCreatedAt) {
                setResult(false, 'review-tail-candidate-run-unavailable');
                return;
              }
              setResult(true, `trusted-mydocs-tail:${candidateSha}`);
              return;
            }

            setResult(false, 'review-tail-candidate-run-unavailable');

      - name: Finalize fast pass
        id: finalize
        if: ${{ always() }}
        env:
          DETECTED_FAST_PASS: ${{ steps.detect.outputs.fast_pass || 'false' }}
          DETECTED_REASON: ${{ steps.detect.outputs.reason || 'preflight-unavailable' }}
        run: |
          set -euo pipefail
          fast_pass='false'
          reason='preflight-unavailable'
          if [[ "${DETECTED_FAST_PASS}" == 'true' ]]; then
            fast_pass='true'
            reason="${DETECTED_REASON}"
          elif [[ "${DETECTED_REASON}" != 'preflight-unavailable' ]]; then
            reason="${DETECTED_REASON}"
          fi
          printf 'fast_pass=%s\nreason=%s\n' "${fast_pass}" "${reason}" >> "$GITHUB_OUTPUT"

  proptest-roundtrip:
    name: prop roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.fast_pass != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1

      - name: Rust build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: proptest-roundtrip
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      - name: Check property runner contract
        run: node --test scripts/tests/run-prop-roundtrip.test.mjs

      - name: Prepare derived Rust test suites
        run: node scripts/rust-test-suite-manifest.mjs --prepare

      - name: Run property roundtrip cases
        run: node scripts/run-prop-roundtrip.mjs --cargo-test
