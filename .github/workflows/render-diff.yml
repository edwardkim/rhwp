name: Render Diff

on:
  pull_request:
    branches: [main, devel]
    types: [opened, reopened, synchronize]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/paint/**'
      - 'src/model/**'
      - 'src/renderer/**'
      - 'src/document_core/queries/rendering.rs'
      - 'src/wasm_api.rs'
      - 'src/main.rs'
      - 'assets/fonts/**'
      - 'ttfs/**'
      - 'scripts/renderer_baseline.py'
      - 'scripts/renderer_baseline_manifest.json'
      - 'scripts/ci-impact-classifier.cjs'
      - 'scripts/generate_font_glyph_payload_fixture.py'
      - 'scripts/generate_exact_face_collection_fixture.py'
      - 'scripts/generate_font_native_hwpx_fixture.py'
      - 'scripts/requirements-font-fixtures.txt'
      - 'samples/render-p35-font-native-bitmap.hwpx'
      - 'tests/fixtures/fonts/**'
      - 'docs/canvaskit-parity-implementation.md'
      - 'docs/text-ir-v2.md'
      - 'rhwp-studio/**'
      # Review 기록·asset은 렌더 입력이 아니다. trailing review-only commit이
      # Canvas visual diff를 다시 시작하지 않게 mydocs/**는 trigger에서 제외한다 (#3559).
      - '.github/workflows/render-diff.yml'
  workflow_dispatch:
    inputs:
      fixtures:
        description: 'Comma-separated sample files under rhwp-studio/public/samples'
        required: false
        type: string
      max-pages:
        description: 'Pages per fixture to compare, or all'
        required: false
        default: '1'
        type: string
      full-suite:
        description: 'Run all built-in sample fixtures'
        required: false
        default: false
        type: boolean
      write-images:
        description: 'Write Canvas PNG artifacts even when cases pass. PDF report artifacts are always retained.'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

# [Task #1192 F] 같은 PR 에 새 push 가 오면 진행 중 run 을 취소해 중복 실행 제거.
# render-diff 는 pull_request 트리거 위주 — cancel-in-progress 는 PR 이벤트 한정.
concurrency:
  group: render-diff-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Render Diff preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      fast_pass: ${{ steps.finalize.outputs.fast_pass || 'false' }}
      reason: ${{ steps.finalize.outputs.reason || 'preflight-unavailable' }}
      candidate_sha: ${{ steps.finalize.outputs.candidate_sha || '' }}
      render_required: ${{ steps.impact.outputs.render_required || 'true' }}
      impact_reason: ${{ steps.impact.outputs.reason || 'fail-closed:impact-unavailable' }}

    steps:
      - name: Detect review-only fast pass
        id: detect
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const { owner, repo } = context.repo;

            function setResult(fastPass, reason, candidateSha = '') {
              core.setOutput('fast_pass', fastPass ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.info(`fast_pass=${fastPass} reason=${reason} candidate_sha=${candidateSha}`);
            }

            function setPendingBaseMergeResult(reason, candidateSha, mergeSha, sourceParentSha) {
              core.setOutput('fast_pass', 'pending-base-merge-tree');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.setOutput('base_merge_sha', mergeSha);
              core.setOutput('source_parent_sha', sourceParentSha);
              core.info(
                `fast_pass=pending-base-merge-tree reason=${reason} candidate_sha=${candidateSha} `
                + `base_merge_sha=${mergeSha} source_parent_sha=${sourceParentSha}`,
              );
            }

            function isAllowedReviewPath(file) {
              const filename = file.filename;
              if (filename.startsWith('mydocs/')) {
                return true;
              }
              if (file.status !== 'added') {
                return false;
              }
              return isReviewReferencePath(filename);
            }

            function isReviewReferencePath(filename) {
              return (
                filename.startsWith('samples/')
                && (
                  filename.endsWith('.hwp')
                  || filename.endsWith('.hwpx')
                  || filename.endsWith('.hml')
                  || filename.endsWith('.pdf')
                  || filename.endsWith('.png')
                )
              ) || (filename.startsWith('pdf/') && filename.endsWith('.pdf'));
            }

            function reviewOnlyLabel(files) {
              const hasReferenceArtifact = files.some((file) => (
                file.status === 'added'
                && isReviewReferencePath(file.filename)
              ));
              return hasReferenceArtifact ? 'review-reference-only' : 'mydocs-only';
            }

            function isCurrentBaseUpdateMerge(commit, baseSha) {
              const parents = commit.parents || [];
              return parents.length === 2
                && parents.filter((parent) => parent.sha === baseSha).length === 1;
            }

            function isCiExecutionPath(filename) {
              return filename.startsWith('.github/workflows/')
                || filename.startsWith('.github/actions/')
                || filename === 'scripts/ci-impact-classifier.cjs'
                || filename === 'scripts/verify_review_only_merge_resolution.py';
            }

            function latestRun(runs) {
              return runs
                .slice()
                .sort((a, b) => {
                  const bTime = Date.parse(b.completed_at || b.started_at || b.created_at || 0);
                  const aTime = Date.parse(a.completed_at || a.started_at || a.created_at || 0);
                  return bTime - aTime;
                })[0];
            }

            async function renderDiffResult(candidateSha, pr, allowPriorPrBase = false) {
              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'render-diff.yml',
                event: 'pull_request',
                head_sha: candidateSha,
                per_page: 100,
              });
              const renderDiffRun = latestRun(workflowRuns.filter((run) => (
                run.path === '.github/workflows/render-diff.yml'
                && run.event === 'pull_request'
                && run.head_sha === candidateSha
              )));

              if (!renderDiffRun) {
                return {
                  state: 'missing',
                  reason: `missing-render-diff-workflow:${candidateSha}`,
                };
              }
              if (renderDiffRun.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `render-diff-workflow-not-completed:${renderDiffRun.status}`,
                };
              }
              if (renderDiffRun.conclusion !== 'success') {
                return {
                  state: 'failed',
                  reason: `latest-render-diff-workflow-not-success:${renderDiffRun.conclusion}`,
                };
              }
              const runCreatedAt = Date.parse(renderDiffRun.created_at);
              const pullCreatedAt = Date.parse(pr.created_at);
              if (!Number.isFinite(runCreatedAt)
                || !Number.isFinite(pullCreatedAt)
                || renderDiffRun.head_branch !== pr.head.ref
                || renderDiffRun.head_repository?.id !== pr.head.repo?.id
                || runCreatedAt < pullCreatedAt) {
                return { state: 'failed', reason: 'render-diff-workflow-pr-identity-mismatch' };
              }

              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: renderDiffRun.id,
                filter: 'latest',
                per_page: 100,
              });
              const renderDiffJob = latestRun(jobs.filter((job) => (
                job.name === 'Canvas visual diff'
              )));
              if (!renderDiffJob) {
                return {
                  state: 'failed',
                  reason: `missing-canvas-visual-diff-job:${candidateSha}`,
                };
              }
              if (renderDiffJob.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `canvas-visual-diff-not-completed:${renderDiffJob.status}`,
                };
              }
              if (renderDiffJob.conclusion === 'skipped') {
                return {
                  state: 'skipped',
                  reason: `canvas-visual-diff-skipped:${candidateSha}`,
                };
              }
              if (renderDiffJob.conclusion !== 'success') {
                return {
                  state: 'failed',
                  reason: `canvas-visual-diff-not-success:${renderDiffJob.conclusion}`,
                };
              }
              const expectedIdentityStep = `Render Diff identity PR #${pr.number} base ${pr.base.sha}`;
              const identityPrefix = `Render Diff identity PR #${pr.number} base `;
              const identityStep = (renderDiffJob.steps || []).find((step) => (
                allowPriorPrBase
                  ? step.name.startsWith(identityPrefix)
                  : step.name === expectedIdentityStep
              ));
              if (identityStep?.status !== 'completed' || identityStep.conclusion !== 'success') {
                return { state: 'failed', reason: 'canvas-visual-diff-identity-mismatch' };
              }
              return { state: 'green' };
            }

            try {
              if (context.eventName !== 'pull_request') {
                setResult(false, 'not-pull-request');
                return;
              }

              const pr = context.payload.pull_request;
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              if (prFiles.length > 0 && prFiles.every((file) => isAllowedReviewPath(file))) {
                core.info(`all PR files are review-only; using base SHA ${pr.base.sha}`);
                setResult(true, 'all-review-only-no-render-impact', pr.base.sha);
                return;
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });

              if (commits.length === 0) {
                setResult(false, 'no-pr-commits');
                return;
              }

              const latestCommitSha = commits.at(-1).sha;
              const { data: latestCommit } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: latestCommitSha,
              });
              if (isCurrentBaseUpdateMerge(latestCommit, pr.base.sha)) {
                if (prFiles.some((file) => isCiExecutionPath(file.filename))) {
                  setResult(false, 'current-base-source-ci-execution-change');
                  return;
                }
                const sourceParent = latestCommit.parents.find(
                  (parent) => parent.sha !== pr.base.sha,
                );
                if (!sourceParent) {
                  setResult(false, 'current-base-source-parent-unavailable');
                  return;
                }
                const sourceResult = await renderDiffResult(sourceParent.sha, pr, true);
                if (sourceResult.state === 'green') {
                  setPendingBaseMergeResult(
                    'direct-source-canvas-visual-diff-success',
                    sourceParent.sha,
                    latestCommitSha,
                    sourceParent.sha,
                  );
                  return;
                }
                setResult(false, `direct-source-${sourceResult.reason}`, sourceParent.sha);
                return;
              }

            const reviewOnlyCandidates = [];
            let codeCandidateSha = '';
            let baseMergeBridge = null;

            for (let index = commits.length - 1; index >= 0; index -= 1) {
              const sha = commits[index].sha;
              const { data: commit } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: sha,
              });
              const parents = commit.parents || [];
              if (isCurrentBaseUpdateMerge(commit, pr.base.sha)) {
                if (baseMergeBridge) {
                  setResult(false, `multiple-current-base-update-merges:${sha}`);
                  return;
                }
                const sourceParent = parents.find((parent) => parent.sha !== pr.base.sha);
                baseMergeBridge = { mergeSha: sha, sourceParentSha: sourceParent.sha };
                core.info(`including current-base update merge bridge ${sha}`);
                continue;
              }
              const files = commit.files || [];

                // The commit endpoint may truncate very large file lists. Fall back to full Render Diff.
                if (files.length === 0 || files.length >= 300) {
                  setResult(false, `unusable-file-list:${sha}`);
                  return;
                }

              const reviewOnly = files.every((file) => isAllowedReviewPath(file));
              if (reviewOnly) {
                if (parents.length === 1) {
                  reviewOnlyCandidates.push(sha);
                  continue;
                }
                setResult(false, `${reviewOnlyLabel(files)}-merge-not-reusable:${sha}`);
                return;
              }

              codeCandidateSha = sha;
              break;
            }

            if (reviewOnlyCandidates.length === 0) {
              setResult(false, 'no-trailing-review-only-commits');
              return;
            }
            if (codeCandidateSha) {
              reviewOnlyCandidates.push(codeCandidateSha);
            }

            for (const candidateSha of reviewOnlyCandidates) {
              const result = await renderDiffResult(candidateSha, pr);
              if (result.state === 'green') {
                if (baseMergeBridge) {
                  setPendingBaseMergeResult(
                    'canvas-visual-diff-success',
                    candidateSha,
                    baseMergeBridge.mergeSha,
                    baseMergeBridge.sourceParentSha,
                  );
                  return;
                }
                setResult(true, 'canvas-visual-diff-success', candidateSha);
                return;
              }
              if (result.state === 'failed') {
                setResult(false, result.reason, candidateSha);
                return;
              }
              core.info(`candidate not reusable yet: ${candidateSha} (${result.reason})`);
            }

            setResult(false, 'no-green-render-candidate');
            } catch (error) {
              core.warning(`Render Diff preflight failed; running full Render Diff. ${error.message}`);
              setResult(false, 'preflight-error');
            }

      # 기준선 병합을 fast-pass bridge로 쓸 때는 untrusted source를 실행하지 않는다.
      # 자동 3-way merge tree가 같거나, 충돌 해소가 mydocs로 한정될 때만 재사용한다.
      - name: Check out current-base merge tree inputs
        id: checkout-base-merge-tree
        if: ${{ steps.detect.outputs.fast_pass == 'pending-base-merge-tree' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify current-base merge tree
        id: verify-base-merge-tree
        if: ${{ always() && steps.detect.outputs.fast_pass == 'pending-base-merge-tree' }}
        shell: bash
        env:
          BASE_MERGE_SHA: ${{ steps.detect.outputs.base_merge_sha }}
          SOURCE_PARENT_SHA: ${{ steps.detect.outputs.source_parent_sha }}
          CURRENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          fail() {
            printf 'verified=false\nreason=%s\n' "$1" >> "$GITHUB_OUTPUT"
          }

          if ! git cat-file -e "${BASE_MERGE_SHA}^{commit}" \
            || ! git cat-file -e "${SOURCE_PARENT_SHA}^{commit}" \
            || ! git cat-file -e "${CURRENT_BASE_SHA}^{commit}"; then
            fail 'current-base-merge-input-unavailable'
            exit 0
          fi

          if ! expected_tree="$(git merge-tree --write-tree "${SOURCE_PARENT_SHA}" "${CURRENT_BASE_SHA}" 2>/dev/null)"; then
            resolution_check="$(mktemp)"
            trap 'rm -f "${resolution_check}"' EXIT
            if ! git show "${CURRENT_BASE_SHA}:scripts/verify_review_only_merge_resolution.py" \
              > "${resolution_check}"; then
              fail 'current-base-merge-resolution-check-unavailable'
            elif resolution_reason="$(python3 "${resolution_check}" \
              --repository . --base-sha "${CURRENT_BASE_SHA}" "${BASE_MERGE_SHA}")"; then
              printf 'verified=true\nreason=%s\n' "${resolution_reason}" >> "$GITHUB_OUTPUT"
            else
              fail 'current-base-merge-resolution-not-mydocs'
            fi
            exit 0
          fi
          expected_tree="${expected_tree%%$'\n'*}"
          actual_tree="$(git show -s --format=%T "${BASE_MERGE_SHA}")"
          if [[ "${expected_tree}" != "${actual_tree}" ]]; then
            fail 'current-base-merge-tree-mismatch'
            exit 0
          fi

          printf 'verified=true\nreason=current-base-merge-tree-match\n' >> "$GITHUB_OUTPUT"

      - name: Finalize review-only fast pass
        id: finalize
        if: ${{ always() }}
        shell: bash
        env:
          DETECTED_FAST_PASS: ${{ steps.detect.outputs.fast_pass || 'false' }}
          DETECTED_REASON: ${{ steps.detect.outputs.reason || 'preflight-unavailable' }}
          CANDIDATE_SHA: ${{ steps.detect.outputs.candidate_sha || '' }}
          MERGE_TREE_VERIFIED: ${{ steps.verify-base-merge-tree.outputs.verified || 'false' }}
          MERGE_TREE_REASON: ${{ steps.verify-base-merge-tree.outputs.reason || 'not-required' }}
        run: |
          set -euo pipefail
          fast_pass="${DETECTED_FAST_PASS}"
          reason="${DETECTED_REASON}"
          if [[ "${DETECTED_FAST_PASS}" == 'pending-base-merge-tree' ]]; then
            if [[ "${MERGE_TREE_VERIFIED}" == 'true' ]]; then
              fast_pass='true'
              if [[ "${MERGE_TREE_REASON}" == 'current-base-merge-resolution-mydocs-only' ]]; then
                reason="current-base-update-merge-resolution-mydocs-only-green:${CANDIDATE_SHA}"
              else
                reason="current-base-update-merge-tree-green:${CANDIDATE_SHA}"
              fi
            else
              fast_pass='false'
              reason="${MERGE_TREE_REASON}"
            fi
          fi
          printf 'fast_pass=%s\nreason=%s\ncandidate_sha=%s\n' \
            "${fast_pass}" "${reason}" "${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"

      # The workflow keeps the broad rhwp-studio/** trigger so the trusted base classifier,
      # rather than a second path heuristic, decides whether the heavy Canvas job is needed.
      - name: Check out trusted CI impact classifier
        id: checkout-impact-classifier
        if: ${{ steps.finalize.outputs.fast_pass != 'true' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci-impact-classifier.cjs
          sparse-checkout-cone-mode: false

      - name: Collect Render Diff impact input
        id: collect-impact
        if: ${{ steps.finalize.outputs.fast_pass != 'true' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const inputPath = path.join(
              process.env.GITHUB_WORKSPACE || process.cwd(),
              '.render-diff-impact-input.json',
            );

            function writeInput(input) {
              fs.writeFileSync(inputPath, `${JSON.stringify(input)}\n`, 'utf8');
            }

            try {
              if (context.eventName !== 'pull_request') {
                writeInput({
                  eventName: context.eventName,
                  files: [],
                  forceFullReason: 'manual-or-unsupported-event',
                });
                return;
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              writeInput({
                eventName: context.eventName,
                files: files.map((file) => ({
                  filename: file.filename,
                  previous_filename: file.previous_filename || '',
                  status: file.status || 'modified',
                })),
              });
            } catch (error) {
              core.warning(`Render Diff impact collection failed; running full. ${error.message}`);
              writeInput({
                eventName: context.eventName,
                files: [],
                forceFullReason: 'collection-error',
              });
            }

      - name: Classify Render Diff impact
        id: impact
        if: ${{ steps.finalize.outputs.fast_pass != 'true' }}
        continue-on-error: true
        run: >-
          node scripts/ci-impact-classifier.cjs
          --input .render-diff-impact-input.json
          --github-output "$GITHUB_OUTPUT"

      - name: Summarize Render Diff impact
        if: ${{ always() }}
        env:
          RENDER_REQUIRED: ${{ steps.impact.outputs.render_required || 'true' }}
          IMPACT_REASON: ${{ steps.impact.outputs.reason || 'fail-closed:impact-unavailable' }}
        run: |
          {
            echo '### Render Diff impact'
            printf -- '- render_required: %s\n' "${RENDER_REQUIRED}"
            printf -- '- reason: %s\n' "${IMPACT_REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"

  canvas-visual-diff:
    name: Canvas visual diff
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight
    if: ${{ always() && needs.preflight.outputs.fast_pass != 'true' && needs.preflight.outputs.render_required == 'true' }}
    permissions:
      contents: read
    env:
      RHWP_CHROMIUM_BUILD_ID: '1660786'

    steps:
      - name: "Render Diff identity PR #${{ github.event.pull_request.number }} base ${{ github.event.pull_request.base.sha }}"
        if: ${{ github.event_name == 'pull_request' }}
        run: printf '%s\n' 'Render Diff identity recorded'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          targets: wasm32-unknown-unknown

      - name: Install PDF raster tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            libfontconfig1-dev \
            libfreetype6-dev \
            poppler-utils

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      # [Task #1667] Render Diff is PR-heavy; pull_request caches are scoped to
      # refs/pull/* and are not reused by other PRs. Keep PR runs restore-only,
      # and allow only trusted manual devel/main seed runs to save a cache.
      - name: Restore cargo registry & build cache
        id: render_diff_cargo_cache_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-render-diff-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-render-diff-cargo-

      - name: Build WASM package
        run: wasm-pack build --target web --dev

      - name: Build native CLI for PDF report
        run: cargo build --features native-skia --bin rhwp

      - name: Save cargo registry & build cache
        if: ${{ github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') && steps.render_diff_cargo_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-render-diff-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Studio dependencies
        working-directory: rhwp-studio
        run: npm ci

      - name: Install Chromium
        working-directory: rhwp-studio
        run: |
          browser_path=$(npx @puppeteer/browsers install chromium@"${RHWP_CHROMIUM_BUILD_ID}" --path .cache/puppeteer --format '{{path}}' | tail -n 1)
          browser_path=$(realpath "$browser_path")
          echo "CHROME_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Check render diff script syntax
        working-directory: rhwp-studio
        run: |
          node --check e2e/renderer-contract.test.mjs
          node --check e2e/issue-2214-page-local-repaint.test.mjs
          node --check e2e/canvaskit-font-coverage.test.mjs
          node --check e2e/canvas-render-diff.test.mjs
          node --check e2e/pdf-render-diff-report.mjs
          node --check e2e/renderer-baseline.mjs
          node --check e2e/renderer-baseline-native-diff.mjs
          node e2e/renderer-baseline-native-diff.mjs --self-test
          node --check e2e/run-render-diff.mjs
          python3 -m py_compile ../scripts/renderer_baseline.py
          npm run e2e:renderer-contract
          npm run e2e:canvaskit-font-coverage

      - name: Run canvas visual diff and PDF report
        working-directory: rhwp-studio
        env:
          VITE_PORT: 7700
          RHWP_RENDER_DIFF_FILES: ${{ inputs.fixtures || '' }}
          RHWP_RENDER_DIFF_MAX_PAGES: ${{ inputs['max-pages'] || '1' }}
          RHWP_RENDER_DIFF_ALL: ${{ inputs['full-suite'] == true && '1' || '0' }}
          RHWP_RENDER_DIFF_WRITE_IMAGES: ${{ inputs['write-images'] == true && '1' || '0' }}
          RHWP_RENDER_DIFF_PDF: '1'
          RHWP_RENDER_DIFF_PDF_WRITE_IMAGES: '1'
          RHWP_RENDER_DIFF_DIRECT_PDF: '1'
          RHWP_RENDER_DIFF_DIRECT_PDF_GATE: '1'
          RHWP_RENDER_DIFF_DIRECT_PDF_MAX_RATIO: '0.02'
          RHWP_RENDER_DIFF_DIRECT_PDF_RASTER_DPI: '144'
          RHWP_RENDER_DIFF_RHWP_BIN: ../target/debug/rhwp
        run: npm run e2e:render-diff:ci

      - name: Run selected CanvasKit readiness gate
        run: >-
          python3 scripts/renderer_baseline.py
          --profiles screen
          --browser-mode headless
          --readiness-only
          --output output/renderer-baseline/canvaskit-readiness

      - name: Add render diff summary
        if: always()
        working-directory: rhwp-studio
        run: |
          for summary in \
            e2e/screenshots/render-diff/summary.md \
            e2e/screenshots/render-diff/pdf-summary.md \
            ../output/renderer-baseline/canvaskit-readiness/baseline-report.md
          do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload render diff artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-diff-artifacts
          path: |
            rhwp-studio/e2e/screenshots/render-diff/
            output/e2e/
            output/renderer-baseline/canvaskit-readiness/
            target/rhwp-studio-vite.log
          if-no-files-found: ignore
          retention-days: 14
