name: Render Diff

on:
  pull_request:
    branches: [main, devel]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/paint/**'
      - 'src/model/**'
      - 'src/renderer/**'
      - 'src/document_core/queries/rendering.rs'
      - 'src/wasm_api.rs'
      - 'src/main.rs'
      - 'assets/fonts/**'
      - 'ttfs/**'
      - 'scripts/renderer_baseline.py'
      - 'scripts/renderer_baseline_manifest.json'
      - 'scripts/generate_font_glyph_payload_fixture.py'
      - 'scripts/generate_exact_face_collection_fixture.py'
      - 'scripts/generate_font_native_hwpx_fixture.py'
      - 'scripts/requirements-font-fixtures.txt'
      - 'samples/render-p35-font-native-bitmap.hwpx'
      - 'tests/fixtures/fonts/**'
      - 'docs/canvaskit-parity-implementation.md'
      - 'docs/text-ir-v2.md'
      - 'rhwp-studio/**'
      # Review 기록·asset은 렌더 입력이 아니다. trailing review-only commit이
      # Canvas visual diff를 다시 시작하지 않게 mydocs/**는 trigger에서 제외한다 (#3559).
      - '.github/workflows/render-diff.yml'
  workflow_dispatch:
    inputs:
      fixtures:
        description: 'Comma-separated sample files under rhwp-studio/public/samples'
        required: false
        type: string
      max-pages:
        description: 'Pages per fixture to compare, or all'
        required: false
        default: '1'
        type: string
      full-suite:
        description: 'Run all built-in sample fixtures'
        required: false
        default: false
        type: boolean
      write-images:
        description: 'Write Canvas PNG artifacts even when cases pass. PDF report artifacts are always retained.'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

# [Task #1192 F] 같은 PR 에 새 push 가 오면 진행 중 run 을 취소해 중복 실행 제거.
# render-diff 는 pull_request 트리거 위주 — cancel-in-progress 는 PR 이벤트 한정.
concurrency:
  group: render-diff-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Render Diff preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      fast_pass: ${{ steps.detect.outputs.fast_pass || 'false' }}
      reason: ${{ steps.detect.outputs.reason || 'preflight-unavailable' }}
      candidate_sha: ${{ steps.detect.outputs.candidate_sha || '' }}

    steps:
      - name: Detect review-only fast pass
        id: detect
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const { owner, repo } = context.repo;

            function setResult(fastPass, reason, candidateSha = '') {
              core.setOutput('fast_pass', fastPass ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.info(`fast_pass=${fastPass} reason=${reason} candidate_sha=${candidateSha}`);
            }

            function isAllowedReviewPath(file) {
              const filename = file.filename;
              if (filename.startsWith('mydocs/')) {
                return true;
              }
              if (file.status !== 'added') {
                return false;
              }
              return isReviewReferencePath(filename);
            }

            function isReviewReferencePath(filename) {
              return (
                filename.startsWith('samples/')
                && (
                  filename.endsWith('.hwp')
                  || filename.endsWith('.hwpx')
                  || filename.endsWith('.hml')
                  || filename.endsWith('.pdf')
                  || filename.endsWith('.png')
                )
              ) || (filename.startsWith('pdf/') && filename.endsWith('.pdf'));
            }

            function reviewOnlyLabel(files) {
              const hasReferenceArtifact = files.some((file) => (
                file.status === 'added'
                && isReviewReferencePath(file.filename)
              ));
              return hasReferenceArtifact ? 'review-reference-only' : 'mydocs-only';
            }

            function isCurrentBaseReviewMerge(commit, baseSha) {
              const parents = commit.parents || [];
              return parents.length === 2 && parents.some((parent) => parent.sha === baseSha);
            }

            async function isCurrentBaseAncestor(candidateSha, baseSha) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${baseSha}...${candidateSha}`,
              });
              return comparison.status === 'ahead' || comparison.status === 'identical';
            }

            function latestRun(runs) {
              return runs
                .slice()
                .sort((a, b) => {
                  const bTime = Date.parse(b.completed_at || b.started_at || b.created_at || 0);
                  const aTime = Date.parse(a.completed_at || a.started_at || a.created_at || 0);
                  return bTime - aTime;
                })[0];
            }

            async function renderDiffResult(candidateSha, pr) {
              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'render-diff.yml',
                event: 'pull_request',
                head_sha: candidateSha,
                per_page: 100,
              });
              const renderDiffRun = latestRun(workflowRuns.filter((run) => (
                run.path === '.github/workflows/render-diff.yml'
                && run.event === 'pull_request'
                && run.head_sha === candidateSha
              )));

              if (!renderDiffRun) {
                return {
                  state: 'missing',
                  reason: `missing-render-diff-workflow:${candidateSha}`,
                };
              }
              if (renderDiffRun.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `render-diff-workflow-not-completed:${renderDiffRun.status}`,
                };
              }
              if (renderDiffRun.conclusion !== 'success') {
                return {
                  state: 'failed',
                  reason: `latest-render-diff-workflow-not-success:${renderDiffRun.conclusion}`,
                };
              }
              const runCreatedAt = Date.parse(renderDiffRun.created_at);
              const pullCreatedAt = Date.parse(pr.created_at);
              if (!Number.isFinite(runCreatedAt)
                || !Number.isFinite(pullCreatedAt)
                || renderDiffRun.head_branch !== pr.head.ref
                || renderDiffRun.head_repository?.id !== pr.head.repo?.id
                || runCreatedAt < pullCreatedAt) {
                return { state: 'failed', reason: 'render-diff-workflow-pr-identity-mismatch' };
              }

              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: renderDiffRun.id,
                filter: 'latest',
                per_page: 100,
              });
              const renderDiffJob = latestRun(jobs.filter((job) => (
                job.name === 'Canvas visual diff'
              )));
              if (!renderDiffJob) {
                return {
                  state: 'failed',
                  reason: `missing-canvas-visual-diff-job:${candidateSha}`,
                };
              }
              if (renderDiffJob.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `canvas-visual-diff-not-completed:${renderDiffJob.status}`,
                };
              }
              if (renderDiffJob.conclusion !== 'success') {
                return {
                  state: 'failed',
                  reason: `canvas-visual-diff-not-success:${renderDiffJob.conclusion}`,
                };
              }
              const expectedIdentityStep = `Render Diff identity PR #${pr.number} base ${pr.base.sha}`;
              const identityStep = (renderDiffJob.steps || []).find((step) => (
                step.name === expectedIdentityStep
              ));
              if (identityStep?.status !== 'completed' || identityStep.conclusion !== 'success') {
                return { state: 'failed', reason: 'canvas-visual-diff-identity-mismatch' };
              }
              return { state: 'green' };
            }

            try {
              if (context.eventName !== 'pull_request') {
                setResult(false, 'not-pull-request');
                return;
              }

              const pr = context.payload.pull_request;
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              if (prFiles.length > 0 && prFiles.every((file) => isAllowedReviewPath(file))) {
                core.info(`all PR files are review-only; using base SHA ${pr.base.sha}`);
                setResult(true, 'all-review-only-no-render-impact', pr.base.sha);
                return;
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });

              if (commits.length === 0) {
                setResult(false, 'no-pr-commits');
                return;
              }

              const reviewOnlyCandidates = [];
              let codeCandidateSha = '';

              for (let index = commits.length - 1; index >= 0; index -= 1) {
                const sha = commits[index].sha;
                const { data: commit } = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: sha,
                });
                const files = commit.files || [];

                // The commit endpoint may truncate very large file lists. Fall back to full Render Diff.
                if (files.length === 0 || files.length >= 300) {
                  setResult(false, `unusable-file-list:${sha}`);
                  return;
                }

                const reviewOnly = files.every((file) => isAllowedReviewPath(file));
                if (reviewOnly) {
                  const parents = commit.parents || [];
                  if (parents.length === 1) {
                    reviewOnlyCandidates.push(sha);
                    continue;
                  }
                  // #3233 keeps the narrow Update branch merge topology. Its green
                  // workflow can be reused after one or more review-only records.
                  if (reviewOnlyCandidates.length > 0
                    && isCurrentBaseReviewMerge(commit, pr.base.sha)) {
                    reviewOnlyCandidates.push(sha);
                    core.info(`including current-base ${reviewOnlyLabel(files)} merge candidate ${sha}`);
                    break;
                  }
                  setResult(false, `${reviewOnlyLabel(files)}-merge-not-reusable:${sha}`);
                  return;
                }

                codeCandidateSha = sha;
                break;
              }

              if (reviewOnlyCandidates.length === 0) {
                setResult(false, 'no-trailing-review-only-commits');
                return;
              }
              if (codeCandidateSha) {
                reviewOnlyCandidates.push(codeCandidateSha);
              }

              for (const candidateSha of reviewOnlyCandidates) {
                if (!(await isCurrentBaseAncestor(candidateSha, pr.base.sha))) {
                  core.info(`candidate does not include current base: ${candidateSha}`);
                  continue;
                }
                const result = await renderDiffResult(candidateSha, pr);
                if (result.state === 'green') {
                  setResult(true, 'canvas-visual-diff-success', candidateSha);
                  return;
                }
                if (result.state === 'failed') {
                  setResult(false, result.reason, candidateSha);
                  return;
                }
                core.info(`candidate not reusable yet: ${candidateSha} (${result.reason})`);
              }

              setResult(false, 'no-green-current-base-render-candidate');
            } catch (error) {
              core.warning(`Render Diff preflight failed; running full Render Diff. ${error.message}`);
              setResult(false, 'preflight-error');
            }

  canvas-visual-diff:
    name: Canvas visual diff
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight
    if: ${{ always() && needs.preflight.outputs.fast_pass != 'true' }}
    permissions:
      contents: read
    env:
      RHWP_CHROMIUM_BUILD_ID: '1660786'

    steps:
      - name: "Render Diff identity PR #${{ github.event.pull_request.number }} base ${{ github.event.pull_request.base.sha }}"
        if: ${{ github.event_name == 'pull_request' }}
        run: printf '%s\n' 'Render Diff identity recorded'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          targets: wasm32-unknown-unknown

      - name: Install PDF raster tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            libfontconfig1-dev \
            libfreetype6-dev \
            poppler-utils

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      # [Task #1667] Render Diff is PR-heavy; pull_request caches are scoped to
      # refs/pull/* and are not reused by other PRs. Keep PR runs restore-only,
      # and allow only trusted manual devel/main seed runs to save a cache.
      - name: Restore cargo registry & build cache
        id: render_diff_cargo_cache_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-render-diff-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-render-diff-cargo-

      - name: Build WASM package
        run: wasm-pack build --target web --dev

      - name: Build native CLI for PDF report
        run: cargo build --features native-skia --bin rhwp

      - name: Save cargo registry & build cache
        if: ${{ github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') && steps.render_diff_cargo_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-render-diff-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Studio dependencies
        working-directory: rhwp-studio
        run: npm ci

      - name: Install Chromium
        working-directory: rhwp-studio
        run: |
          browser_path=$(npx @puppeteer/browsers install chromium@${RHWP_CHROMIUM_BUILD_ID} --path .cache/puppeteer --format '{{path}}' | tail -n 1)
          browser_path=$(realpath "$browser_path")
          echo "CHROME_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Check render diff script syntax
        working-directory: rhwp-studio
        run: |
          node --check e2e/renderer-contract.test.mjs
          node --check e2e/issue-2214-page-local-repaint.test.mjs
          node --check e2e/canvaskit-font-coverage.test.mjs
          node --check e2e/canvas-render-diff.test.mjs
          node --check e2e/pdf-render-diff-report.mjs
          node --check e2e/renderer-baseline.mjs
          node --check e2e/renderer-baseline-native-diff.mjs
          node e2e/renderer-baseline-native-diff.mjs --self-test
          node --check e2e/run-render-diff.mjs
          python3 -m py_compile ../scripts/renderer_baseline.py
          npm run e2e:renderer-contract
          npm run e2e:canvaskit-font-coverage

      - name: Run canvas visual diff and PDF report
        working-directory: rhwp-studio
        env:
          VITE_PORT: 7700
          RHWP_RENDER_DIFF_FILES: ${{ inputs.fixtures || '' }}
          RHWP_RENDER_DIFF_MAX_PAGES: ${{ inputs['max-pages'] || '1' }}
          RHWP_RENDER_DIFF_ALL: ${{ inputs['full-suite'] == true && '1' || '0' }}
          RHWP_RENDER_DIFF_WRITE_IMAGES: ${{ inputs['write-images'] == true && '1' || '0' }}
          RHWP_RENDER_DIFF_PDF: '1'
          RHWP_RENDER_DIFF_PDF_WRITE_IMAGES: '1'
          RHWP_RENDER_DIFF_DIRECT_PDF: '1'
          RHWP_RENDER_DIFF_DIRECT_PDF_GATE: '1'
          RHWP_RENDER_DIFF_DIRECT_PDF_MAX_RATIO: '0.02'
          RHWP_RENDER_DIFF_DIRECT_PDF_RASTER_DPI: '144'
          RHWP_RENDER_DIFF_RHWP_BIN: ../target/debug/rhwp
        run: npm run e2e:render-diff:ci

      - name: Run selected CanvasKit readiness gate
        run: >-
          python3 scripts/renderer_baseline.py
          --profiles screen
          --browser-mode headless
          --readiness-only
          --output output/renderer-baseline/canvaskit-readiness

      - name: Add render diff summary
        if: always()
        working-directory: rhwp-studio
        run: |
          for summary in \
            e2e/screenshots/render-diff/summary.md \
            e2e/screenshots/render-diff/pdf-summary.md \
            ../output/renderer-baseline/canvaskit-readiness/baseline-report.md
          do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload render diff artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-diff-artifacts
          path: |
            rhwp-studio/e2e/screenshots/render-diff/
            output/e2e/
            output/renderer-baseline/canvaskit-readiness/
            target/rhwp-studio-vite.log
          if-no-files-found: ignore
          retention-days: 14
