name: Publish All Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_extensions:
        description: 'Publish VSCode Marketplace and Open VSX extensions'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM
        run: wasm-pack build --target web --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-pkg
          path: pkg/

  publish-npm-core:
    name: Publish @rhwp/core
    needs: build-wasm
    runs-on: ubuntu-latest
    environment: NPM_TOKEN

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download WASM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: pkg/

      - name: Prepare npm package
        run: bash scripts/prepare-npm.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish to npm
        working-directory: pkg
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists; skipping publish"
          else
            npm publish --access public
          fi

  publish-npm-editor:
    name: Publish @rhwp/editor
    needs: build-wasm
    runs-on: ubuntu-latest
    environment: NPM_TOKEN

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish to npm
        working-directory: npm/editor
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists; skipping publish"
          else
            npm publish --access public
          fi

  publish-vscode:
    name: Publish VSCode Extension
    needs: build-wasm
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_extensions }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download WASM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: pkg/

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: rhwp-vscode
        run: npm install

      - name: Copy logo
        run: cp assets/logo/logo-128.png rhwp-vscode/media/icon.png

      - name: Copy WASM files
        run: |
          cp pkg/rhwp_bg.wasm rhwp-vscode/media/
          cp pkg/rhwp.js rhwp-vscode/media/

      - name: Build extension
        working-directory: rhwp-vscode
        run: npm run compile

      - name: Publish to VS Code Marketplace
        working-directory: rhwp-vscode
        run: npx vsce publish -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        working-directory: rhwp-vscode
        run: npx ovsx publish -p ${{ secrets.OVSX_PAT }}
