name: Gym Benchmark Validation

# Gym은 AI 에이전트가 rhwp CLI/API를 조합해 과제를 수행하는 능력을 측정하는
# 벤치마크다. 제품 정합성·main 승격·릴리즈 게시의 게이트가 아니다.
#
# - Gym 관련 PR: 빠른 정적·단위 계약만 확인한다.
# - 수동 실행: 기준풀이, 음성 대조, 트라젝토리를 전건 실행해 벤치마크 자체의
#   판별력 증적을 남긴다.
# - devel/main push와 v* tag는 이 workflow를 자동 실행하지 않는다.

on:
  pull_request:
    paths:
      - 'gym/**'
      - 'scripts/tests/test_gym_*.py'
      - '.github/workflows/gym-release-gate.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'contracts만 검증하거나 full benchmark까지 실행한다'
        required: true
        default: contracts
        type: choice
        options:
          - contracts
          - full

permissions:
  contents: read

concurrency:
  group: gym-benchmark-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Gym benchmark contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Gym contracts
        run: >-
          python3 -m unittest
          scripts.tests.test_gym_benchmark_validation
          scripts.tests.test_gym_score
          scripts.tests.test_gym_packs
          scripts.tests.test_gym_coverage
          scripts.tests.test_gym_profiles
          scripts.tests.test_gym_schema
          scripts.tests.test_gym_pack_health
          scripts.tests.test_gym_audit
          scripts.tests.test_gym_certify
          scripts.tests.test_gym_build_baseline
          scripts.tests.test_gym_discriminate
          scripts.tests.test_gym_oracle_probe
          scripts.tests.test_gym_authority_ledger
          scripts.tests.test_gym_trajectory
          scripts.tests.test_gym_leaderboard
          scripts.tests.test_gym_robustness
          scripts.tests.test_gym_fuzz_corpus
          scripts.tests.test_gym_release_diff
          scripts.tests.test_gym_differential
          scripts.tests.test_gym_tutorial
          scripts.tests.test_gym_competitive_bench
          scripts.tests.test_gym_work_receipt_pack

  full-benchmark:
    name: Full Gym benchmark validation
    needs: contracts
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    # 로컬 실측: 기준풀이 약 24분, discrimination 약 6분, trajectory 약 2분.
    # cold cache와 runner 편차를 포함하되 무한 실행은 막는다.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)

      - name: Build benchmark subject
        run: cargo build --locked --bin rhwp

      - name: Run full benchmark integrity audits
        shell: bash
        run: |
          mkdir -p gym-benchmark-evidence
          set +e

          python3 gym/tools/authority_ledger.py --json \
            > gym-benchmark-evidence/authority-ledger.json \
            2> gym-benchmark-evidence/authority-ledger.stderr.txt
          authority_exit=$?

          python3 gym/tools/oracle_probe.py --json \
            > gym-benchmark-evidence/oracle-probe.json \
            2> gym-benchmark-evidence/oracle-probe.stderr.txt
          oracle_exit=$?

          python3 gym/tools/build_baseline.py --bin target/debug/rhwp --json \
            > gym-benchmark-evidence/build-baseline.json \
            2> gym-benchmark-evidence/build-baseline.stderr.txt
          baseline_exit=$?

          python3 gym/tools/discriminate.py --bin target/debug/rhwp --json \
            > gym-benchmark-evidence/discriminate.json \
            2> gym-benchmark-evidence/discriminate.stderr.txt
          discrimination_exit=$?

          python3 gym/tools/trajectory.py --bin target/debug/rhwp --json \
            > gym-benchmark-evidence/trajectory.json \
            2> gym-benchmark-evidence/trajectory.stderr.txt
          trajectory_exit=$?

          {
            echo "authority_ledger=${authority_exit}"
            echo "oracle_probe=${oracle_exit}"
            echo "build_baseline=${baseline_exit}"
            echo "discriminate=${discrimination_exit}"
            echo "trajectory=${trajectory_exit}"
          } > gym-benchmark-evidence/exits.txt

          if [ "${authority_exit}" -ne 0 ] || \
             [ "${oracle_exit}" -ne 0 ] || \
             [ "${baseline_exit}" -ne 0 ] || \
             [ "${discrimination_exit}" -ne 0 ] || \
             [ "${trajectory_exit}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Gym benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gym-benchmark-validation-${{ github.sha }}
          path: gym-benchmark-evidence
          if-no-files-found: error
          retention-days: 30
