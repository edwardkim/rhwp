name: python-binding

# M18 파이썬 바인딩 (#3762). 바인딩은 기존 계약의 재포장이므로, 여기서 지키는 것은
# "파이썬이 도나"가 아니라 **계약이 어긋나지 않았나**다 — 패리티 가드가 핵심이다.

on:
  push:
    paths:
      - "bindings/python/**"
      - "src/ir_schema.rs"
      - ".github/workflows/python-binding.yml"
  pull_request:
    paths:
      - "bindings/python/**"
      - "src/ir_schema.rs"
      - ".github/workflows/python-binding.yml"

jobs:
  preflight:
    name: Python binding fast-pass preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run_bindings: ${{ steps.detect.outputs.run_bindings || 'true' }}
      reason: ${{ steps.detect.outputs.reason || 'preflight-unavailable' }}
    steps:
      - name: Detect trailing documentation commit
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            function setResult(runBindings, reason) {
              core.setOutput('run_bindings', runBindings ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.info(`run_bindings=${runBindings} reason=${reason}`);
            }

            function latestRun(runs) {
              return runs.slice().sort((a, b) => (
                Date.parse(b.completed_at || b.created_at || 0)
                - Date.parse(a.completed_at || a.created_at || 0)
              ))[0];
            }

            try {
              if (context.eventName !== 'pull_request' || context.payload.action !== 'synchronize') {
                setResult(true, 'not-trailing-pull-request-update');
                return;
              }

              const { owner, repo } = context.repo;
              const pr = context.payload.pull_request;
              const headCommit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: pr.head.sha,
              });
              if (headCommit.data.parents.length !== 1) {
                setResult(true, 'head-is-not-a-single-parent-commit');
                return;
              }

              const parentSha = headCommit.data.parents[0].sha;
              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: parentSha,
                head: pr.head.sha,
              });
              const files = comparison.data.files || [];
              if (
                comparison.data.ahead_by !== 1
                || files.length === 0
                || files.some((file) => !file.filename.startsWith('mydocs/'))
              ) {
                setResult(true, 'head-delta-is-not-mydocs-only');
                return;
              }

              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'python-binding.yml',
                event: 'pull_request',
                per_page: 100,
              });
              const previousRun = latestRun(workflowRuns.filter((run) => (
                run.head_sha === parentSha
                && run.head_branch === pr.head.ref
                && run.head_repository?.id === pr.head.repo?.id
              )));
              if (previousRun?.status === 'completed' && previousRun.conclusion === 'success') {
                setResult(false, `mydocs-only-after-green-python-binding:${parentSha}`);
                return;
              }

              setResult(true, `missing-green-python-binding:${parentSha}`);
            } catch (error) {
              core.warning(`binding preflight failed closed: ${error.message}`);
              setResult(true, 'preflight-error');
            }

  unit:
    # 단위 테스트는 rhwp 빌드 없이 돈다 — 탐색·변환·예외 매핑·계획 직렬화는 순수 로직.
    name: 단위 (바이너리 없이)
    needs: preflight
    if: ${{ needs.preflight.outputs.run_bindings == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 의존성 설치
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 단위 테스트
        working-directory: bindings/python
        run: pytest tests/ -q -m "not integration"
      - name: 타입 검사
        working-directory: bindings/python
        run: mypy src/rhwp
        continue-on-error: true
      - name: 린트
        working-directory: bindings/python
        run: ruff check src tests tools
        continue-on-error: true

  integration:
    # 실제 바이너리와 실제 문서로 왕복. 패리티 가드가 여기서 돈다.
    name: 통합 (rhwp 빌드)
    needs: preflight
    if: ${{ needs.preflight.outputs.run_bindings == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: rhwp 빌드
        run: cargo build --release --bin rhwp
      - name: 의존성 설치
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 통합 테스트
        working-directory: bindings/python
        env:
          RHWP_BIN: ${{ github.workspace }}/target/release/rhwp
        run: pytest tests/ -q
      - name: 예제 실행
        working-directory: bindings/python
        env:
          RHWP_BIN: ${{ github.workspace }}/target/release/rhwp
        run: |
          python examples/01_read_document.py ../../samples/field-01.hwp
          python examples/06_ir_schema.py

  wheel:
    name: 휠 빌드
    needs: preflight
    if: ${{ needs.preflight.outputs.run_bindings == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 빌드
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: rhwp-wheel
          path: bindings/python/dist/*
