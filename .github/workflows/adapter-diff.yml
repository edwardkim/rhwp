name: Adapter inter-diff

# M06-4 / #5392 — 전어댑터 상호 diff 골든 하네스.
# SvgBackend 는 devel 에 있다. Png/Skia 는 PR 에만 있을 수 있다.
# 없는 어댑터는 skip 으로 남기고 있는 어댑터끼리만 맞댄다.
# 싼 CI 픽스처. 실문서 전수·native-skia 피처·gym 이 아니다.

on:
  pull_request:
    branches: [main, devel]
  push:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adapter-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  adapter-impact:
    name: adapter inter-diff preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      adapter_required: ${{ steps.classify.outputs.adapter_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify adapter inter-diff impact
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" || -z "${BASE_SHA}" || -z "${HEAD_SHA}" ]]; then
            echo "adapter_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=full-non-pr-event" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"; then
            echo "adapter_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=fail-closed-pr-diff-unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${changed_files}" ]]; then
            echo "adapter_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=fail-closed-empty-pr-diff" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "${changed_files}" | grep -qv '^mydocs/'; then
            echo "adapter_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=full-non-documentation-change" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "adapter_required=false" >> "$GITHUB_OUTPUT"
          echo "reason=skip-mydocs-only-pr" >> "$GITHUB_OUTPUT"

  adapter-diff:
    name: adapter inter-diff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: adapter-impact
    if: ${{ always() && needs.adapter-impact.result == 'success' && needs.adapter-impact.outputs.adapter_required == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1

      - name: Rust build cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.1
        with:
          shared-key: adapter-diff
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      - name: Check adapter-diff runner contract
        run: node --test scripts/tests/run-adapter-diff.test.mjs

      - name: Check adapter-diff harness
        run: python3 -m unittest tools.adapter_diff.test_harness

      - name: Discover adapters (honest skip)
        run: python3 tools/adapter_diff/harness.py --ci --strict

      - name: Prepare derived Rust test suites
        run: node scripts/rust-test-suite-manifest.mjs --prepare

      - name: Run adapter inter-diff case
        run: node scripts/run-adapter-diff.mjs --cargo-test
