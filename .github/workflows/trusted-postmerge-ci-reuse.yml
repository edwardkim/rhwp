name: Trusted post-merge CI reuse

on:
  workflow_call:
    inputs:
      workflow_file:
        description: Source workflow filename whose successful PR run may be reused.
        required: true
        type: string
      caller_event_name:
        description: Original caller event name; workflow_call itself is not evidence.
        required: true
        type: string
      caller_ref:
        description: Original caller Git ref.
        required: true
        type: string
      caller_sha:
        description: Original caller commit SHA.
        required: true
        type: string
      require_duration_artifacts:
        description: Require B/C/D duration artifacts for accepted Rust CI reuse, not frontend-only CI.
        required: false
        default: false
        type: boolean
    outputs:
      reuse:
        description: Whether the caller may skip its workers.
        value: ${{ jobs.verify.outputs.reuse }}
      reason:
        description: Fail-closed verification result.
        value: ${{ jobs.verify.outputs.reason }}
      source_run_id:
        description: Exact successful PR workflow run used as evidence.
        value: ${{ jobs.verify.outputs.source_run_id }}
      refresh_duration_data:
        description: Whether accepted CI reuse supplies Rust duration data to refresh.
        value: ${{ jobs.verify.outputs.refresh_duration_data }}

permissions: {}

jobs:
  verify:
    name: Verify trusted post-merge reuse
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.finalize.outputs.reuse || 'false' }}
      reason: ${{ steps.finalize.outputs.reason || 'reuse-finalization-unavailable' }}
      source_run_id: ${{ steps.finalize.outputs.source_run_id || '' }}
      refresh_duration_data: ${{ steps.finalize.outputs.refresh_duration_data || 'false' }}
    steps:
      - name: Default to full verification
        id: defaults
        shell: bash
        run: |
          printf 'reuse=false\nreason=not-a-devel-push\n' >> "$GITHUB_OUTPUT"

      # pull_request runs execute refs/pull/N/merge, while the Actions API exposes
      # only the source head as workflow_run.head_sha. Preserve the actual tested
      # merge commit and tree in an immutable run artifact so a later devel push
      # can prove that its merge tree is byte-for-byte identical.
      - name: Capture PR merge-tree evidence
        id: pr-merge-tree
        if: ${{ inputs.caller_event_name == 'pull_request' && startsWith(inputs.caller_ref, 'refs/pull/') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CALLER_SHA: ${{ inputs.caller_sha }}
          CALLER_REF: ${{ inputs.caller_ref }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
        with:
          script: |
            const fs = require('node:fs');
            const mergeSha = process.env.CALLER_SHA;
            const pullRequest = context.payload.pull_request;
            const repositoryId = Number(process.env.GITHUB_REPOSITORY_ID);
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const isFork = pullRequest?.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY;
            if (
              !/^[0-9a-f]{40}$/.test(mergeSha || '')
              || !pullRequest
              || pullRequest.base?.repo?.full_name !== process.env.GITHUB_REPOSITORY
              || !Number.isSafeInteger(repositoryId) || repositoryId <= 0
              || pullRequest.base.repo.id !== repositoryId
              || pullRequest.base.ref !== 'devel'
              || !Number.isSafeInteger(pullRequest.number) || pullRequest.number <= 0
              || process.env.CALLER_REF !== `refs/pull/${pullRequest.number}/merge`
              || !Number.isSafeInteger(runAttempt) || runAttempt <= 0
              || !Number.isSafeInteger(pullRequest.head?.repo?.id) || pullRequest.head.repo.id <= 0
              || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(pullRequest.head.repo.full_name || '')
              || (isFork && (pullRequest.head.repo.fork !== true || pullRequest.head.repo.id === repositoryId))
              || !/^[0-9a-f]{40}$/.test(pullRequest.base?.sha || '')
              || !/^[0-9a-f]{40}$/.test(pullRequest.head?.sha || '')
            ) {
              core.warning('PR merge-tree identity is unavailable; no reuse evidence will be published.');
              return;
            }
            try {
              const { data: commit } = await github.rest.repos.getCommit({
                ...context.repo,
                ref: mergeSha,
              });
              const parents = (commit.parents || []).map((parent) => parent.sha);
              const treeSha = commit.commit?.tree?.sha || '';
              if (
                commit.sha !== mergeSha
                || parents.length !== 2
                || parents[0] !== pullRequest.base.sha
                || parents[1] !== pullRequest.head.sha
                || !/^[0-9a-f]{40}$/.test(treeSha)
              ) {
                core.warning('PR merge ref does not match the event base/head pair; no evidence will be published.');
                return;
              }
              const artifactName = isFork
                ? `trusted-postmerge-fork-merge-tree-v1-${pullRequest.number}-${repositoryId}-${pullRequest.head.repo.id}-${runAttempt}-${mergeSha}-${treeSha}`
                : `trusted-postmerge-merge-tree-v1-${mergeSha}-${treeSha}`;
              fs.writeFileSync('trusted-postmerge-merge-tree.json', `${JSON.stringify({
                schema: isFork ? 2 : 1,
                repository: process.env.GITHUB_REPOSITORY,
                repository_id: repositoryId,
                pull_number: pullRequest.number,
                head_repository_id: pullRequest.head.repo.id,
                run_attempt: runAttempt,
                workflow_file: process.env.WORKFLOW_FILE,
                run_id: String(context.runId),
                merge_sha: mergeSha,
                parents,
                tree_sha: treeSha,
              }, null, 2)}\n`);
              core.setOutput('artifact_name', artifactName);
              core.info(`Captured exact PR merge-tree evidence: ${artifactName}`);
            } catch (error) {
              core.warning(`Could not capture PR merge-tree evidence. ${error.message}`);
            }

      - name: Upload PR merge-tree evidence
        if: ${{ steps.pr-merge-tree.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pr-merge-tree.outputs.artifact_name }}
          path: trusted-postmerge-merge-tree.json
          retention-days: 7
          if-no-files-found: error

      # Resolve the merge's pre-PR source parent before any local verifier code
      # is checked out. An initial rollout has no base verifier and therefore
      # falls back to full CI; later PRs use this immutable pre-merge revision.
      - name: Resolve trusted source base parent
        id: source-base
        if: ${{ inputs.caller_event_name == 'push' && inputs.caller_ref == 'refs/heads/devel' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CALLER_SHA: ${{ inputs.caller_sha }}
        with:
          script: |
            try {
              const mergeSha = process.env.CALLER_SHA;
              if (!/^[0-9a-f]{40}$/.test(mergeSha)) {
                core.setOutput('sha', '');
                core.warning('Caller SHA is unavailable; running full.');
                return;
              }
              const { data: commit } = await github.rest.repos.getCommit({
                ...context.repo,
                ref: mergeSha,
              });
              const parents = (commit.parents || []).map((parent) => parent.sha);
              if (commit.sha !== mergeSha || new Set(parents).size !== parents.length) {
                core.setOutput('sha', '');
                core.warning('Post-merge commit identity is unavailable; running full.');
                return;
              }
              if (parents.length === 2) {
                core.setOutput('sha', parents[0]);
                return;
              }
              if (parents.length !== 1) {
                core.setOutput('sha', '');
                core.warning('Post-merge reuse requires one squash parent or two merge parents.');
                return;
              }
              const pullRequests = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { ...context.repo, commit_sha: mergeSha, per_page: 100 },
              );
              const matching = pullRequests.filter((candidate) => (
                candidate.state === 'closed'
                && candidate.merged_at
                && candidate.merge_commit_sha === mergeSha
                && candidate.base?.ref === 'devel'
                && candidate.head?.repo?.full_name === process.env.GITHUB_REPOSITORY
                && /^[0-9a-f]{40}$/.test(candidate.head?.sha || '')
              ));
              if (matching.length !== 1) {
                core.setOutput('sha', '');
                core.warning('Squash post-merge reuse requires exactly one same-repository merged PR.');
                return;
              }
              core.setOutput('sha', parents[0]);
            } catch (error) {
              core.setOutput('sha', '');
              core.warning(`Could not resolve merge base; running full. ${error.message}`);
            }

      # This checkout is the pre-PR devel parent. It never checks out or executes
      # the merged PR head, including a verifier changed by that PR.
      - name: Checkout trusted verifier
        if: ${{ steps.source-base.outputs.sha != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source-base.outputs.sha }}
          sparse-checkout: |
            scripts/verify-trusted-postmerge-ci-reuse.mjs
            scripts/trusted-postmerge-duration-evidence.mjs
            scripts/ci-impact-classifier.cjs
          sparse-checkout-cone-mode: false

      - name: Evaluate exact PR workflow evidence
        id: evaluate
        if: ${{ steps.source-base.outputs.sha != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          REQUIRE_DURATION_ARTIFACTS: ${{ inputs.require_duration_artifacts }}
          CALLER_EVENT_NAME: ${{ inputs.caller_event_name }}
          CALLER_REF: ${{ inputs.caller_ref }}
          CALLER_SHA: ${{ inputs.caller_sha }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            let classifyReviewOnlyCommit;
            let evaluateTrustedPostMergeReuse;
            let frontendOnlyCiRunIsReusable;
            let fullLaneWorkflowJobsAreGreen;
            let classifyChanges;
            let currentBaseReviewBridgeSource;
            let selectTrustedPostMergeCandidate;
            let verifyPostMergeReviewBridgeTree;
            let verifyForkPostMergeTree;
            let verifyReviewOnlyBaseAdvance;
            let trustedPullRequestSource;
            let trustedPullRequestWorkflowRun;
            let selectDurationArtifacts;
            let decodeDurationArtifact;
            let validateDurationReports;
            const repositoryId = Number(process.env.GITHUB_REPOSITORY_ID);
            try {
              ({ classifyReviewOnlyCommit, evaluateTrustedPostMergeReuse, frontendOnlyCiRunIsReusable, fullLaneWorkflowJobsAreGreen,
                currentBaseReviewBridgeSource, selectTrustedPostMergeCandidate,
                verifyPostMergeReviewBridgeTree, verifyForkPostMergeTree, verifyReviewOnlyBaseAdvance,
                trustedPullRequestSource, trustedPullRequestWorkflowRun } = await import(pathToFileURL(path.join(
                process.env.GITHUB_WORKSPACE,
                'scripts/verify-trusted-postmerge-ci-reuse.mjs',
              )).href));
              if ([currentBaseReviewBridgeSource, selectTrustedPostMergeCandidate, fullLaneWorkflowJobsAreGreen,
                verifyPostMergeReviewBridgeTree, verifyForkPostMergeTree,
                trustedPullRequestSource, trustedPullRequestWorkflowRun].some((fn) => typeof fn !== 'function')) {
                throw new Error('trusted base has no review-bridge verifier');
              }
              if (process.env.WORKFLOW_FILE === 'ci.yml') {
                ({ selectDurationArtifacts, decodeDurationArtifact, validateDurationReports } = await import(pathToFileURL(path.join(
                  process.env.GITHUB_WORKSPACE, 'scripts/trusted-postmerge-duration-evidence.mjs',
                )).href));
                if ([selectDurationArtifacts, decodeDurationArtifact, validateDurationReports]
                  .some((fn) => typeof fn !== 'function')) throw new Error('trusted duration validator unavailable');
                ({ classifyChanges } = require(path.join(
                  process.env.GITHUB_WORKSPACE, 'scripts/ci-impact-classifier.cjs',
                )));
              }
            } catch (error) {
              core.warning(`Trusted base has no compatible verifier; running full. ${error.message}`);
              core.setOutput('reuse', 'false');
              core.setOutput('reason', 'trusted-base-verifier-unavailable');
              core.setOutput('source_run_id', '');
              return;
            }

            async function collectEvidence() {
              const mergeSha = process.env.CALLER_SHA;
              const mergeCommit = (await github.rest.repos.getCommit({
                owner,
                repo,
                ref: mergeSha,
              })).data;
              const pullRequests = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: mergeSha, per_page: 100 },
              );
              const pullRequest = pullRequests.filter((candidate) => (
                candidate.state === 'closed'
                && candidate.merged_at
                && candidate.merge_commit_sha === mergeSha
                && candidate.base?.ref === 'devel'
                && trustedPullRequestSource(candidate, process.env.GITHUB_REPOSITORY, repositoryId)
              ));
              if (pullRequest.length !== 1) {
                return { mergeCommit, pullRequests, pullFiles: [], workflowRuns: [] };
              }
              const summary = pullRequest[0];
              const pr = (await github.rest.pulls.get({
                owner, repo, pull_number: summary.number,
              })).data;
              if (pr.number !== summary.number || pr.head?.sha !== summary.head.sha
                || pr.merge_commit_sha !== mergeSha || pr.state !== 'closed' || !pr.merged_at
                || pr.base?.ref !== 'devel'
                || !trustedPullRequestSource(pr, process.env.GITHUB_REPOSITORY, repositoryId)
                || pr.head.repo.id !== summary.head.repo.id
                || pr.head.repo.full_name !== summary.head.repo.full_name) {
                throw new Error('PR detail identity mismatch');
              }
              const isFork = pr.head.repo.full_name !== process.env.GITHUB_REPOSITORY;
              const mergeParents = (mergeCommit.parents || []).map((parent) => parent.sha);
              const baseParent = mergeParents.length === 1
                ? mergeParents[0]
                : mergeParents.find((sha) => sha !== pr.head.sha);
              const [sourceCommit, comparison, pullFiles, workflowRuns] = await Promise.all([
                github.rest.repos.getCommit({ owner, repo, ref: pr.head.sha }).then((response) => response.data),
                baseParent
                  ? github.rest.repos.compareCommits({ owner, repo, base: baseParent, head: pr.head.sha })
                    .then((response) => response.data)
                  : Promise.resolve({ merge_base_commit: { sha: '' } }),
                github.paginate(github.rest.pulls.listFiles, {
                  owner, repo, pull_number: pr.number, per_page: 100,
                }),
                github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: process.env.WORKFLOW_FILE,
                  event: 'pull_request',
                  branch: pr.head.ref,
                  per_page: 100,
                }),
              ]);
              const prCommitHeaders = await github.paginate(
                github.rest.pulls.listCommits,
                { owner, repo, pull_number: pr.number, per_page: 100 },
              );
              if (prCommitHeaders.length === 0 || prCommitHeaders.length >= 250
                || pullFiles.length === 0 || pullFiles.length >= 3000
                || pullFiles.length !== pr.changed_files) {
                throw new Error('incomplete PR commit or file inventory');
              }
              const prCommits = [];
              let bridgeSha = '';
              for (let index = prCommitHeaders.length - 1; index >= 0; index -= 1) {
                const commit = (await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: prCommitHeaders[index].sha,
                })).data;
                if (commit.sha !== prCommitHeaders[index].sha) {
                  throw new Error('PR commit identity mismatch');
                }
                prCommits.unshift(commit);
                if (currentBaseReviewBridgeSource(commit, baseParent)) {
                  if (bridgeSha) throw new Error('multiple current-base review bridges');
                  bridgeSha = commit.sha;
                  continue;
                }
                if (classifyReviewOnlyCommit(commit).kind !== "review") {
                  break;
                }
              }
              const sourceSelection = selectTrustedPostMergeCandidate(pr, prCommits, baseParent);
              const matchesRun = (run) => trustedPullRequestWorkflowRun(
                run, pr, process.env.GITHUB_REPOSITORY, repositoryId, process.env.WORKFLOW_FILE,
              );
              const mergeTreeEvidenceByRunId = {};
              const createdAt = Date.parse(pr.created_at || '');
              const mergedAt = Date.parse(pr.merged_at || '');
              const finalHeadRuns = workflowRuns.filter((run) => (
                matchesRun(run)
                && run.head_sha === pr.head.sha
                && Number.isFinite(createdAt)
                && Number.isFinite(mergedAt)
                && Date.parse(run.created_at || '') >= createdAt
                && Date.parse(run.updated_at || '') <= mergedAt
              )).sort((left, right) => (
                Date.parse(right.updated_at || '') - Date.parse(left.updated_at || '')
                || Number(right.run_attempt || 0) - Number(left.run_attempt || 0)
                || Number(right.id || 0) - Number(left.id || 0)
              ));
              const finalHeadRun = finalHeadRuns[0];
              async function recordMergeTreeEvidence(workflowRun, artifacts) {
                if (
                  !matchesRun(workflowRun)
                ) {
                  return;
                }
                const evidenceArtifacts = artifacts
                  .filter((artifact) => artifact.expired !== true)
                  .map((artifact) => {
                    if (isFork) {
                      const identity = /^trusted-postmerge-fork-merge-tree-v1-([1-9][0-9]*)-([1-9][0-9]*)-([1-9][0-9]*)-([1-9][0-9]*)-([0-9a-f]{40})-([0-9a-f]{40})$/
                        .exec(artifact.name || '');
                      const matchesIdentity = identity
                        && identity[1] === String(pr.number)
                        && identity[2] === String(repositoryId)
                        && identity[3] === String(pr.head.repo.id)
                        && identity[4] === String(workflowRun.run_attempt);
                      return { artifact, match: matchesIdentity
                        ? [identity[0], identity[5], identity[6]] : null };
                    }
                    return { artifact,
                      match: /^trusted-postmerge-merge-tree-v1-([0-9a-f]{40})-([0-9a-f]{40})$/
                        .exec(artifact.name || '') };
                  })
                  .filter(({ match }) => match !== null);
                if (evidenceArtifacts.length === 1) {
                  const [, testedMergeSha, encodedTreeSha] = evidenceArtifacts[0].match;
                  const testedMerge = (await github.rest.repos.getCommit({
                    owner,
                    repo,
                    ref: testedMergeSha,
                  })).data;
                  const testedParents = (testedMerge.parents || []).map((parent) => parent.sha);
                  const testedTreeSha = testedMerge.commit?.tree?.sha || '';
                  if (
                    testedMerge.sha === testedMergeSha
                    && testedParents.length === 2
                    && testedParents[1] === workflowRun.head_sha
                    && testedTreeSha === encodedTreeSha
                  ) {
                    mergeTreeEvidenceByRunId[String(workflowRun.id)] = {
                      sha: testedMergeSha,
                      parents: testedParents,
                      treeSha: testedTreeSha,
                      ...(isFork ? { pullNumber: pr.number, repositoryId,
                        headRepositoryId: pr.head.repo.id, runAttempt: workflowRun.run_attempt } : {}),
                    };
                  }
                }
              }
              if (finalHeadRun?.status === 'completed' && finalHeadRun?.conclusion === 'success') {
                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  { owner, repo, run_id: finalHeadRun.id, per_page: 100 },
                );
                await recordMergeTreeEvidence(finalHeadRun, artifacts);
              }
              // Only the trusted pre-merge classifier sees API metadata here;
              // no candidate code or candidate-provided lane marker is executed.
              const reviewOnlyBaseAdvanceByRunId = {};
              const testedFinalHead = mergeTreeEvidenceByRunId[String(finalHeadRun?.id)];
              if (isFork && testedFinalHead && testedFinalHead.parents[0] !== baseParent
                && typeof verifyReviewOnlyBaseAdvance === 'function'
                && finalHeadRun?.status === 'completed' && finalHeadRun.conclusion === 'success') {
                try {
                  // Bound API/object inventory; prove ancestry and path/mode safety using raw Git.
                  const testedBase = testedFinalHead.parents[0];
                  const refs = new Set([mergeSha, testedFinalHead.sha, testedBase]);
                  let cursor = baseParent;
                  for (let count = 0; cursor !== testedBase && count < 64; count += 1) {
                    if (!/^[0-9a-f]{40}$/.test(cursor || '')) throw new Error('invalid base identity');
                    refs.add(cursor);
                    const commit = (await github.rest.repos.getCommit({ owner, repo, ref: cursor })).data;
                    if (commit.sha !== cursor || !Array.isArray(commit.parents)
                      || commit.parents.length < 1 || commit.parents.length > 2) {
                      throw new Error('incomplete base history');
                    }
                    cursor = commit.parents[0].sha;
                  }
                  if (cursor !== testedBase || ![...refs].every((sha) => /^[0-9a-f]{40}$/.test(sha))) {
                    throw new Error('base history limit or identity mismatch');
                  }
                  execFileSync('git', ['fetch', '--no-tags', '--filter=blob:none', '--depth=1',
                    '--no-write-fetch-head', 'origin', ...refs], {
                    cwd: process.env.GITHUB_WORKSPACE, timeout: 120000, maxBuffer: 1024 * 1024,
                    stdio: ['ignore', 'pipe', 'pipe'],
                  });
                  const proof = verifyReviewOnlyBaseAdvance(process.env.GITHUB_WORKSPACE, {
                    baseSha: baseParent, mergeSha, candidateSha: pr.head.sha,
                    testedMergeSha: testedFinalHead.sha,
                  });
                  if (proof.testedBaseSha !== testedBase || proof.testedTreeSha !== testedFinalHead.treeSha) {
                    throw new Error('base advance artifact mismatch');
                  }
                  reviewOnlyBaseAdvanceByRunId[String(finalHeadRun.id)] = proof;
                } catch (error) {
                  core.warning(`Review-only base advance proof unavailable; running full. ${error.message}`);
                }
              }
              const frontendOnlyRunIds = [];
              if (
                process.env.WORKFLOW_FILE === 'ci.yml'
                && typeof classifyChanges === 'function'
                && typeof frontendOnlyCiRunIsReusable === 'function'
                && finalHeadRun?.status === 'completed'
                && finalHeadRun?.conclusion === 'success'
              ) {
                const impact = classifyChanges({ eventName: 'pull_request', files: pullFiles });
                if (
                  impact.classification_status === 'classified'
                  && impact.rust_required === 'false'
                  && impact.native_skia_required === 'false'
                  && ['unit', 'package'].includes(impact.frontend_mode)
                ) {
                  const jobs = await github.paginate(
                    github.rest.actions.listJobsForWorkflowRun,
                    { owner, repo, run_id: finalHeadRun.id, filter: 'latest', per_page: 100 },
                  );
                  if (frontendOnlyCiRunIsReusable(impact, jobs)) {
                    frontendOnlyRunIds.push(String(finalHeadRun.id));
                  }
                }
              }
              const requireFullLaneEvidence = ["ci.yml", "codeql.yml", "adapter-diff.yml", "proptest-roundtrip.yml"]
                .includes(process.env.WORKFLOW_FILE) || isFork;
              const reviewOnlyWorker = {
                "proptest-roundtrip.yml": {
                  preflight: "Proptest preflight",
                  worker: "prop roundtrip",
                },
                "adapter-diff.yml": {
                  preflight: "adapter inter-diff preflight",
                  worker: "adapter inter-diff",
                },
              }[process.env.WORKFLOW_FILE];
              const fullLaneRunIds = [];
              const durationArtifactsByRunId = {};
              if (requireFullLaneEvidence) {
                for (const workflowRun of workflowRuns) {
                  if (!matchesRun(workflowRun) || workflowRun.status !== "completed" || workflowRun.conclusion !== "success") {
                    continue;
                  }
                  const jobs = await github.paginate(
                    github.rest.actions.listJobsForWorkflowRun,
                    { owner, repo, run_id: workflowRun.id, filter: "latest", per_page: 100 },
                  );
                  if (!fullLaneWorkflowJobsAreGreen(process.env.WORKFLOW_FILE, jobs)) {
                    continue;
                  }
                  if (process.env.WORKFLOW_FILE === "ci.yml") {
                    const artifacts = await github.paginate(
                      github.rest.actions.listWorkflowRunArtifacts,
                      { owner, repo, run_id: workflowRun.id, per_page: 100 },
                    );
                    await recordMergeTreeEvidence(workflowRun, artifacts);
                    try {
                      durationArtifactsByRunId[String(workflowRun.id)] = selectDurationArtifacts(
                        artifacts, workflowRun, pr, repositoryId,
                      );
                      fullLaneRunIds.push(String(workflowRun.id));
                    } catch (error) {
                      core.warning(`CI candidate ${workflowRun.id}: duration evidence rejected: ${error.message}`);
                    }
                    continue;
                  }
                  if (process.env.WORKFLOW_FILE === "codeql.yml") {
                    // Match codeql.yml PR preflight: every language Analyze job
                    // must already have succeeded above. A completed GHAS neutral
                    // aggregate is not a language verdict or full alert coverage;
                    // retain its identity/attempt checks and never accept skipped.
                    const allowedSecurityConclusions = new Set(['success', 'neutral']);
                    const checks = await github.paginate(github.rest.checks.listForRef, {
                      owner, repo, ref: workflowRun.head_sha, filter: "latest", per_page: 100,
                    });
                    const startedAt = Date.parse(workflowRun.run_started_at || workflowRun.created_at);
                    const securityCheck = checks.filter((check) => (
                      check.app?.slug === "github-advanced-security" && check.name === "CodeQL"
                      && check.head_sha === workflowRun.head_sha
                    )).sort((a, b) => Date.parse(b.started_at || "") - Date.parse(a.started_at || "")
                      || Number(b.id) - Number(a.id))[0];
                    if (!Number.isFinite(startedAt) || !securityCheck
                      || !Number.isFinite(Date.parse(securityCheck.started_at || ""))
                      || Date.parse(securityCheck.started_at) < startedAt
                      || securityCheck.status !== "completed"
                      || !allowedSecurityConclusions.has(securityCheck.conclusion)) {
                      core.warning(`CodeQL candidate ${workflowRun.id}: GHAS evidence rejected (${securityCheck?.status || 'missing'}/${securityCheck?.conclusion || 'missing'})`);
                      continue;
                    }
                    if (securityCheck.conclusion === "neutral") {
                      core.info(`CodeQL candidate ${workflowRun.id}: accepting neutral GHAS check ${securityCheck.id} after all language analyses succeeded`);
                    }
                  }
                  {
                    fullLaneRunIds.push(String(workflowRun.id));
                    const artifacts = await github.paginate(
                      github.rest.actions.listWorkflowRunArtifacts,
                      { owner, repo, run_id: workflowRun.id, per_page: 100 },
                    );
                    await recordMergeTreeEvidence(workflowRun, artifacts);
                  }
                }
              }
              const reviewOnlyFastPassRunIds = [];
              if (reviewOnlyWorker) {
                for (const workflowRun of workflowRuns) {
                  if (!matchesRun(workflowRun) || workflowRun.status !== "completed" || workflowRun.conclusion !== "success") {
                    continue;
                  }
                  const jobs = await github.paginate(
                    github.rest.actions.listJobsForWorkflowRun,
                    { owner, repo, run_id: workflowRun.id, per_page: 100 },
                  );
                  const preflightSucceeded = jobs.some((job) => (
                    job.name === reviewOnlyWorker.preflight
                    && job.status === "completed"
                    && job.conclusion === "success"
                  ));
                  const workerSkipped = jobs.some((job) => (
                    job.name === reviewOnlyWorker.worker
                    && job.status === "completed"
                    && job.conclusion === "skipped"
                  ));
                  if (preflightSucceeded && workerSkipped) {
                    reviewOnlyFastPassRunIds.push(String(workflowRun.id));
                  }
                }
              }
              const reviewBridgeTreeEvidenceByRunId = {};
              const forkMergeTreeEvidenceByRunId = {};
              if (isFork && sourceSelection) {
                for (const run of workflowRuns) {
                  const tested = mergeTreeEvidenceByRunId[String(run.id)];
                  if (!matchesRun(run) || !fullLaneRunIds.includes(String(run.id)) || !tested
                    || tested.parents[0] !== baseParent
                    || !sourceSelection.fullLaneCandidates.some((candidate) => candidate.sha === run.head_sha)) {
                    continue;
                  }
                  try {
                    // Compare immutable trees with trusted code; never execute fork code here.
                    const refs = [mergeSha, tested.sha];
                    if (!refs.every((sha) => /^[0-9a-f]{40}$/.test(sha))) {
                      throw new Error('invalid fork merge-tree identity');
                    }
                    const gitOptions = { cwd: process.env.GITHUB_WORKSPACE,
                      timeout: 120000, maxBuffer: 1024 * 1024, stdio: ['ignore', 'pipe', 'pipe'] };
                    execFileSync('git', ['fetch', '--no-tags', '--filter=blob:none', '--depth=1',
                      '--no-write-fetch-head', 'origin', ...refs], gitOptions);
                    const proof = verifyForkPostMergeTree(process.env.GITHUB_WORKSPACE, {
                      baseSha: baseParent, mergeSha, candidateSha: run.head_sha, testedMergeSha: tested.sha,
                    });
                    if (proof.testedTreeSha !== tested.treeSha) {
                      throw new Error('fork artifact tree mismatch');
                    }
                    forkMergeTreeEvidenceByRunId[String(run.id)] = proof;
                  } catch (error) {
                    core.warning(`Fork tree proof unavailable for run ${run.id}; running full. ${error.message}`);
                  }
                }
              }
              if (sourceSelection?.bridgeSha && requireFullLaneEvidence) {
                for (const run of workflowRuns) {
                  const tested = mergeTreeEvidenceByRunId[String(run.id)];
                  if (!fullLaneRunIds.includes(String(run.id)) || !tested
                    || tested.parents[0] !== baseParent
                    || !sourceSelection.fullLaneCandidates.some((c) => c.sha === run.head_sha)) {
                    continue;
                  }
                  try {
                    // Fetch immutable objects only. Keep the trusted checkout and never run PR code.
                    const refs = [mergeSha, sourceSelection.bridgeSha, tested.sha];
                    if (!refs.every((sha) => /^[0-9a-f]{40}$/.test(sha))) {
                      throw new Error('invalid review-bridge object identity');
                    }
                    const gitOptions = { cwd: process.env.GITHUB_WORKSPACE,
                      timeout: 120000, maxBuffer: 1024 * 1024, stdio: ['ignore', 'pipe', 'pipe'] };
                    const missing = refs.filter((sha) => {
                      try {
                        execFileSync('git', ['cat-file', '-e', `${sha}^{commit}`], gitOptions);
                        return false;
                      } catch { return true; }
                    });
                    if (missing.length) {
                      execFileSync('git', ['fetch', '--no-tags', '--filter=blob:none', '--depth=1',
                        '--no-write-fetch-head', 'origin', ...missing], gitOptions);
                    }
                    const proof = verifyPostMergeReviewBridgeTree(process.env.GITHUB_WORKSPACE, {
                      baseSha: baseParent, bridgeSha: sourceSelection.bridgeSha, mergeSha,
                      candidateSha: run.head_sha, testedMergeSha: tested.sha,
                    });
                    if (proof.testedTreeSha !== tested.treeSha) {
                      throw new Error('review-bridge artifact tree mismatch');
                    }
                    reviewBridgeTreeEvidenceByRunId[String(run.id)] = proof;
                  } catch (error) {
                    core.warning(`Review-bridge tree proof unavailable for run ${run.id}; running full. ${error.message}`);
                  }
                }
              }
              const evidence = {
                mergeCommit,
                pullRequests,
                sourceCommit,
                mergeBaseSha: comparison.merge_base_commit?.sha || '',
                pullFiles,
                prCommits,
                workflowRuns,
                mergeTreeEvidenceByRunId,
                reviewBridgeTreeEvidenceByRunId,
                forkMergeTreeEvidenceByRunId,
                reviewOnlyBaseAdvanceByRunId,
                frontendOnlyRunIds,
                durationArtifactsByRunId,
              };
              if (requireFullLaneEvidence) {
                evidence.fullLaneRunIds = fullLaneRunIds;
              }
              if (reviewOnlyWorker) {
                evidence.reviewOnlyFastPassRunIds = reviewOnlyFastPassRunIds;
              }
              return evidence;
            }

            let result;
            let evidence;
            try {
              evidence = await collectEvidence();
              result = evaluateTrustedPostMergeReuse({
                eventName: process.env.CALLER_EVENT_NAME,
                ref: process.env.CALLER_REF,
                repository: process.env.GITHUB_REPOSITORY,
                repositoryId,
                workflowFile: process.env.WORKFLOW_FILE,
                mergeSha: process.env.CALLER_SHA,
                ...evidence,
              });
            } catch (error) {
              core.warning(`Trusted post-merge reuse is unavailable; running full. ${error.message}`);
              result = {
                reuse: false,
                reason: 'evidence-collection-error',
                sourceRunId: '',
                pullNumber: '',
              };
            }
            if (result.reuse && process.env.REQUIRE_DURATION_ARTIFACTS === 'true') {
              if (result.refreshDurationData !== false) {
                try {
                  const selected = evidence.durationArtifactsByRunId?.[String(result.sourceRunId)];
                  const run = evidence.workflowRuns.find((item) => String(item.id) === String(result.sourceRunId));
                  const pr = evidence.pullRequests.find((item) => String(item.number) === String(result.pullNumber));
                  const tested = evidence.mergeTreeEvidenceByRunId[String(result.sourceRunId)];
                  if (!selected || !run || !pr || !tested) throw new Error('candidate-duration-artifacts-unavailable');
                  const reports = [];
                  for (const { label, artifact } of selected) {
                    const response = await github.rest.actions.downloadArtifact({
                      owner, repo, artifact_id: artifact.id, archive_format: 'zip', request: { timeout: 15000 },
                    });
                    reports.push(decodeDurationArtifact(response.data, label));
                  }
                  const normalized = validateDurationReports(reports, {
                    run, pr, repositoryId, testedMergeSha: tested.sha, legacy: selected[0].legacy,
                  });
                  const fs = require('node:fs');
                  const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'trusted-postmerge-durations-'));
                  for (const report of normalized) fs.writeFileSync(
                    path.join(directory, `target-durations-${report.archive_label}.json`),
                    `${JSON.stringify(report)}\n`, { flag: 'wx' },
                  );
                  core.setOutput('duration_path', directory);
                  core.info(`Validated duration JSON for PR ${pr.number}, run ${run.id}, attempt ${run.run_attempt}`);
                } catch (error) {
                  core.warning(`Could not inspect candidate duration artifacts; running full. ${error.message}`);
                  result = {
                    reuse: false,
                    reason: 'candidate-duration-artifact-check-error',
                    sourceRunId: '',
                    pullNumber: '',
                  };
                }
              }
            }
            core.setOutput('reuse', result.reuse ? 'true' : 'false');
            core.setOutput('reason', result.reason);
            core.setOutput('source_run_id', result.sourceRunId || '');
            core.setOutput('refresh_duration_data',
              result.reuse && process.env.REQUIRE_DURATION_ARTIFACTS === 'true'
                && result.refreshDurationData !== false ? 'true' : 'false');
            core.info(`reuse=${result.reuse} reason=${result.reason} source_run_id=${result.sourceRunId || 'none'} refresh_duration_data=${result.reuse && process.env.REQUIRE_DURATION_ARTIFACTS === 'true' && result.refreshDurationData !== false}`);

      # Only normalized JSON is handed to the write-capable metrics job.
      - name: Publish validated Archive B duration measurement
        id: publish-duration-b
        if: ${{ steps.evaluate.outputs.reuse == 'true' && steps.evaluate.outputs.refresh_duration_data == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-postmerge-durations-${{ github.run_id }}-${{ github.run_attempt }}-b
          path: ${{ steps.evaluate.outputs.duration_path }}/target-durations-b.json
          retention-days: 3
          if-no-files-found: error

      - name: Publish validated Archive C duration measurement
        id: publish-duration-c
        if: ${{ steps.evaluate.outputs.reuse == 'true' && steps.evaluate.outputs.refresh_duration_data == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-postmerge-durations-${{ github.run_id }}-${{ github.run_attempt }}-c
          path: ${{ steps.evaluate.outputs.duration_path }}/target-durations-c.json
          retention-days: 3
          if-no-files-found: error

      - name: Publish validated Archive D duration measurement
        id: publish-duration-d
        if: ${{ steps.evaluate.outputs.reuse == 'true' && steps.evaluate.outputs.refresh_duration_data == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-postmerge-durations-${{ github.run_id }}-${{ github.run_attempt }}-d
          path: ${{ steps.evaluate.outputs.duration_path }}/target-durations-d.json
          retention-days: 3
          if-no-files-found: error

      - name: Finalize reuse after validated evidence publication
        id: finalize
        if: ${{ always() }}
        env:
          REUSE: ${{ steps.evaluate.outputs.reuse || 'false' }}
          REASON: ${{ steps.evaluate.outputs.reason || steps.defaults.outputs.reason || 'reuse-evaluation-unavailable' }}
          SOURCE_RUN_ID: ${{ steps.evaluate.outputs.source_run_id || '' }}
          REFRESH: ${{ steps.evaluate.outputs.refresh_duration_data || 'false' }}
          PUBLISH_B: ${{ steps.publish-duration-b.outcome }}
          PUBLISH_C: ${{ steps.publish-duration-c.outcome }}
          PUBLISH_D: ${{ steps.publish-duration-d.outcome }}
        run: |
          if [[ "$REUSE" == 'true' && "$REFRESH" == 'true' && ( "$PUBLISH_B" != 'success' || "$PUBLISH_C" != 'success' || "$PUBLISH_D" != 'success' ) ]]; then
            REUSE=false
            REASON=validated-duration-publication-failed
          fi
          if [[ "$REUSE" != 'true' ]]; then
            SOURCE_RUN_ID=''
            REFRESH=false
          fi
          printf 'reuse=%s\nreason=%s\nsource_run_id=%s\nrefresh_duration_data=%s\n' \
            "$REUSE" "$REASON" "$SOURCE_RUN_ID" "$REFRESH" >> "$GITHUB_OUTPUT"
