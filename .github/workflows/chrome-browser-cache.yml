name: Prepare Chrome extension browser cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    # Cache seed only, with trusted default-branch dependencies. No PR code/tests.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/chrome-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm --prefix rhwp-chrome ci --no-audit --prefer-offline
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: chrome-cache
        with:
          path: ${{ env.PUPPETEER_CACHE_DIR }}
          key: chrome-extension-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rhwp-chrome/package-lock.json') }}
      - run: npm exec --prefix rhwp-chrome -- puppeteer browsers install chrome
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ steps.chrome-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ env.PUPPETEER_CACHE_DIR }}
          key: chrome-extension-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rhwp-chrome/package-lock.json') }}
