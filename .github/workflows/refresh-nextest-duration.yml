name: Refresh nextest target duration data

# #7070: branch merges run metadata refresh only. Never build/test or request a CI fallback.
on:
  push:
    branches: [devel]
    # #8277: PR CI의 경로 필터와 문서 전용 분류에 맞춰 checkout부터 생략한다.
    # 렌더링 계약 문서는 PR CI와 같이 검증 대상에 다시 포함한다.
    paths:
      - '**'
      - '!assets/chrome/**'
      - '!assets/edge/**'
      - '!assets/logo/**'
      - '!assets/screenshots/**'
      - '!CHANGELOG.md'
      - '!CHANGELOG_EN.md'
      - '!CONTRIBUTING.md'
      - '!CONVENTIONS.md'
      - '!GEMINI.md'
      - '!QWEN.md'
      - '!README.md'
      - '!README_EN.md'
      - '!ROADMAP.md'
      - '!SECURITY.md'
      - '!THIRD_PARTY.md'
      - '!THIRD_PARTY_LICENSES.md'
      - '!replit.md'
      - '!LICENSE'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/FUNDING.yml'
      - '!.github/CODE_OF_CONDUCT.md'
      - '!.github/SECURITY.md'
      - '!.github/pull_request_template.md'
      - '!.github/dependabot.yml'
      - '!rhwp-logo.*'
      - '!AGENTS.md'
      - '!CLAUDE.md'
      - '!llms.txt'
      - '!mydocs/**'
      - 'mydocs/tech/canvaskit-parity-implementation.md'
      - 'mydocs/tech/text-ir-v2.md'
  workflow_dispatch:

permissions: {}
concurrency:
  group: nextest-target-duration-data
  cancel-in-progress: false

jobs:
  refresh-nextest-target-duration-data:
    name: Refresh nextest target duration data
    if: github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Collect verified PR duration measurements
        id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DURATION_DIR: ${{ runner.temp }}/postmerge-duration-data
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { collectPostmergeDurations } = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/collect-postmerge-duration-data.mjs',
            )).href);
            const result = await collectPostmergeDurations({
              github, ...context.repo, mergeSha: context.sha, outputDir: process.env.DURATION_DIR,
              notice: (message) => core.notice(message),
            });
            core.setOutput('ready', String(result.ready));
            core.info(JSON.stringify(result));
            await core.summary.addHeading('PR duration metadata refresh')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
      - name: Prepare duration policy data
        id: refresh
        if: steps.collect.outputs.ready == 'true'
        shell: bash
        env:
          DURATION_DIR: ${{ runner.temp }}/postmerge-duration-data
          OUTPUT_POLICY: ${{ runner.temp }}/nextest-target-duration-policy.json
        run: |
          set -euo pipefail
          echo 'publish_ready=false' >> "$GITHUB_OUTPUT"

          current_devel_sha="$(git ls-remote origin refs/heads/devel | awk 'NR == 1 { print $1 }')"
          if [[ "${current_devel_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::notice::A newer devel commit exists; this older measurement is not published."
            exit 0
          fi

          measurement_args=()
          for label in b c d e; do
            measurement="${DURATION_DIR}/duration-${label}/target-durations-${label}.json"
            if [[ -f "$measurement" ]]; then
              measurement_args+=(--measurement "$measurement")
            fi
          done
          node scripts/refresh-nextest-target-duration-policy.mjs \
            --policy tests/suites/nextest-target-duration-policy.json \
            "${measurement_args[@]}" \
            --output "${OUTPUT_POLICY}"

          echo 'publish_ready=true' >> "$GITHUB_OUTPUT"

      - name: Publish duration policy with guarded Git Data API
        if: steps.refresh.outputs.publish_ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { publishNextestDurationData } = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/publish-nextest-duration-data.mjs',
            )).href);
            const result = await publishNextestDurationData({
              github, ...context.repo, mergeSha: context.sha,
              content: fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'nextest-target-duration-policy.json'), 'utf8'),
            });
            core.info(JSON.stringify(result));
            await core.summary.addHeading('Duration metadata publication')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
