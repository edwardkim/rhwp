# 루트 Cargo.toml의 workspace(members = [".", "tools/rhwp-subsecond"])에 편입되지 않도록
# 이 crate를 독립 workspace로 분리한다.
[workspace]

[package]
name = "app"
version = "0.1.0"
description = "RHWP Studio — Windows desktop shell for rhwp-studio (HWP/HWPX viewer/editor)"
authors = ["rhwp contributors"]
license = "MIT"
repository = "https://github.com/edwardkim/rhwp"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
