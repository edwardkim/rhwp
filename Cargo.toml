[package]
name = "rhwp"
version = "0.8.6"
edition = "2021"
description = "HWP file viewer and editor written in Rust, targeting WebAssembly"
license = "MIT"
repository = "https://github.com/edwardkim/rhwp"
autotests = false
autoexamples = false

[workspace]
members = [".", "crates/*", "bindings/Native", "tools/batch-convert"]
default-members = [".", "crates/*"]
resolver = "2"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rhwp"
path = "src/main.rs"

[[bin]]
name = "font-metric-gen"
path = "src/tools/font_metric_gen.rs"

