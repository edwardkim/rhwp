path = "tools/diagnostics/edit_sweep.rs"

[[example]]
name = "hwpx_dump_empty"
path = "tools/diagnostics/hwpx_dump_empty.rs"

[[example]]
name = "hwpx_dump_text"
path = "tools/diagnostics/hwpx_dump_text.rs"

[[example]]
name = "hwpx_hwp_ir_diff"
path = "tools/diagnostics/hwpx_hwp_ir_diff.rs"

[[example]]
name = "hwpx_roundtrip"
path = "tools/diagnostics/hwpx_roundtrip.rs"

[[example]]
