[dependencies]
rhwp-contracts = { path = "crates/rhwp-contracts", version = "0.1.0" }
rhwp-ooxml-chart = { path = "crates/rhwp-ooxml-chart", version = "0.1.0" }
rhwp-password-crypto = { path = "crates/rhwp-password-crypto", version = "0.1.0" }
pdf_oxide = { package = "rhwp-pdf-import-backend", path = "vendor/rhwp-pdf-import-backend", version = "=0.3.78-rhwp.1", default-features = false, optional = true }
# pdf_oxide 0.3.78's DocumentIR initializer is incompatible with office_oxide 0.1.13.
# Keep the compatibility constraint for library consumers that do not use our lockfile.
office_oxide = { version = "=0.1.9", default-features = false, optional = true }
wasm-bindgen = "0.2"
cfb = "0.15"
crc32fast = "1"
des = "0.9"
flate2 = "1.0"
byteorder = "1.5"
base64 = "0.23"
# [#4509] 캡슐 서명(4년 축) — 결정론 서명이라 replay/lineage 의 결정론 문화와
# 정합. 순수 Rust 라 wasm 타깃도 그대로 컴파일된다.
ed25519-dalek = "3"
# 양자내성 서명(ML-DSA / Dilithium, NIST FIPS 204) — Ed25519 는 Shor 로 깨지므로
# 작업캡슐·출처 서명을 양자 이후에도 살리는 확장. 순수 Rust 라 wasm 도 그대로 컴파일된다.
# 시드(32B) 결정론 키생성·결정론 서명만 쓰므로 crate 의 getrandom/rand_core/pkcs8 기능은
# 끄고(엔트로피는 프로젝트의 getrandom::fill 로 공급) alloc 만 켠다 — 의존 표면 최소화.
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
aes = "0.9"
cbc = "0.2"
cipher = "0.5"
hmac = "0.13"
pbkdf2 = "0.13"
getrandom = { version = "0.4", features = ["wasm_js"] }
# [agent_seal] 에이전트 전용 완전 엔트로피 봉인(1번 모드)도 아래 보안 트레일러와
# 같은 XChaCha20-Poly1305를 쓴다. OTP(2번 모드)는 XOR+getrandom뿐이라 별도
# 의존성이 없다.
sha1 = "0.11"
sha2 = "0.11"
blake3 = "1"
# [보안 트레일러] HWP3 강암호 append 트레일러 — memory-hard KDF(Argon2id) +
# misuse-resistant AEAD(XChaCha20-Poly1305). 순수 Rust(RustCrypto) 라 wasm 도 그대로 컴파일.
#
# 기본 피처는 끈다 — argon2 의 `rand`/`password-hash` 와 chacha20poly1305 의
# `getrandom` 은 rand_core 0.6 을 거쳐 **getrandom 0.2** 를 끌어오는데, 0.2 는
# wasm32-unknown-unknown 에서 `js` 피처 없이는 compile_error! 로 죽는다(이
# 저장소는 getrandom 0.4 + wasm_js 를 쓴다). 여기 코드는 소금·논스를
# `getrandom::fill` 로 직접 만들고 저수준 Argon2 API 만 쓰므로 그 피처가
# 필요 없다 — 끊어 두면 wasm 빌드가 구버전 getrandom 을 아예 만나지 않는다.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
zeroize = "1"
# [보안 트레일러 · 포스트양자] ML-KEM-768(NIST FIPS 203) 격자 KEM — 공개키 봉인의
# 양자안전 키교환. 대칭부(XChaCha20-Poly1305)는 이미 양자내성이고, Shor 에 깨지는
# 비대칭 키교환만 격자 KEM 으로 교체한다. 순수 Rust(RustCrypto) 라 wasm 도 그대로 컴파일.
ml-kem = "0.3"
rand_core = "0.10"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
roxmltree = "0.21"
svgtypes = "0.16"
codepage = "0.1.2"
embedded-io = "0.7.1"
encoding_rs = "0.8.35"
paste = "1.0.15"
snafu = "0.9.0"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
unicode-segmentation = "1.12.0"
unicode-bidi = "0.3.18"
unicode-bidi-mirroring = "0.4.0"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
unicode-width = "0.2.2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff"] }
zune-print = { package = "rhwp-zune-jpeg", path = "vendor/rhwp-zune-jpeg", version = "=0.5.15-rhwp.1", default-features = false, features = ["std"] }
jpeg-encoder = { package = "rhwp-jpeg-encoder", path = "vendor/rhwp-jpeg-encoder", version = "=0.7.1-rhwp.1" }
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std", "simd"] }
pcx = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ttf-parser = "0.25"
rustybuzz = "0.20"
resvg = { version = "0.47", default-features = false, features = ["text", "raster-images"] }

console_error_panic_hook = { version = "0.1", optional = true }
# [#4580] 핫패치 버전의 **유일한** 사본. `dx` 가 만든 점프 테이블을 이 크레이트가 역직렬화하므로
# 설치할 dioxus-cli 도 같은 버전이어야 한다 — `scripts/dioxus-cli-version.mjs` 가 여기서 유도한다.
# 정확 핀(`=`)이 아니면 그 유도가 성립하지 않는다.
subsecond = { version = "=0.7.10", optional = true }

[features]
default = ["console_error_panic_hook", "pdf-import", "pdf-jbig2", "pdf-jpeg2000", "pdf-icc", "wasm-api"]
pdf-import = ["dep:pdf_oxide", "pdf_oxide/legacy-crypto", "dep:office_oxide", "dep:tiny-skia"]
pdf-icc = ["pdf-import", "pdf_oxide/icc-qcms"]
pdf-jbig2 = ["pdf-import", "pdf_oxide/jbig2"]
pdf-jpeg2000 = ["pdf-import", "pdf_oxide/jpeg2000"]
# 브라우저 JS 바인딩(`wasm_api`)과 자동 panic hook 초기화·`version` export.
# npm 패키지·Studio·CLI·Native FFI는 기본값을 사용한다. 다른 wasm-bindgen 앱이
# 라이브러리로 링크할 때는 `default-features = false`로 facade와 자동 start를 제외한다.
# 의존성의 start가 있으면 일반 Rust main은 자동 실행되지 않지만, 명시적 start끼리는 연결된다.
# export를 제외하면 쓰지 않는 렌더러·편집 코드도 링커가 제거할 수 있다.
# 기본값을 끈 Rust 소비자가 `wasm_api`를 쓰려면 `wasm-api`를 명시적으로 켠다.
# Cargo feature는 합쳐지므로 다른 의존성이 이 feature를 켜면 다시 포함된다.
wasm-api = []
native-skia = ["dep:skia-safe", "dep:icy_sixel"]
subsecond-dev = ["dep:subsecond"]
# 릴리즈 CLI 설치에서 제외하는 저장소 개발 도구.
dev-tools = []

# Native 요청 감독의 OS 제한과 process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# PDF 내보내기·SVG 웹폰트 부분집합 (네이티브 전용)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# #8174: root patch는 외부 Rust 소비자에게 전달되지 않는다. 보정 fork를 직접 연결한다.
svg2pdf = { package = "rhwp-svg2pdf", path = "vendor/svg2pdf", version = "=0.13.0-rhwp.1" }
usvg = "0.45"
pdf-writer = "0.12"
read-fonts = "0.46"
skera = "0.9"
skia-safe = { version = "0.153.2", optional = true, default-features = false, features = ["binary-cache", "embed-icudtl", "pdf", "textlayout"] }
icy_sixel = { version = "=0.7.0", optional = true }


[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CanvasWindingRule",
    "DomMatrix",
    "CanvasGradient",
    "CanvasPattern",
    "DomMatrix",
    "DomMatrixReadOnly",
    "CanvasGradient",
    "CanvasPattern",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "ImageData",
    "TextMetrics",
    "Document",
    "Window",
    "console",
] }
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# [#3707] 통합 시험이 공격 문서를 **시험 시점에 합성**하려면 HWPX(zip) 재압축이
# 필요하다 — 실물 악성 파일을 저장소에 커밋하지 않기 위해서다. 위 [dependencies]
# 와 같은 버전이라 의존성 그래프도, WASM 산출물도 그대로다.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
# [#4378] CAS 계약 테스트가 기대 해시를 스스로 계산한다 — 위 [dependencies] 와
# 같은 버전이라 의존성 그래프도 산출물도 그대로다(zip 선례와 동일).
sha2 = "0.11"
# [#5363] M04-1 편집 계획 시퀀스 생성기. 왕복 property 본체는 M04-2/3.
# [#5376] M04-2 HWPX 왕복 property. 기존 run step 만 조합한다. 왕복 본체는 통합 시험.
# [#5382] M04-3 HWP5 왕복 property. 기존 run step 만 조합한다. 왕복 본체는 통합 시험.
# [#5388] M04-4 왕복 property CI 배선. 문서 IrDiff-0 본체는 M04-2/3.
proptest = "1.6"

# ── Clippy 린트 정책 ──
# 리팩토링(타스크 142) 각 단계 완료 시 allow → warn → deny 전환
#
# [Phase 0] 기준선 설정 — 기존 코드의 구조적 경고 허용
# [Phase 1-3] wasm_api/renderer 분할 완료 후: too_many_arguments, cognitive_complexity → warn
# [Phase 4-6] 전체 분할 완료 후: 전 항목 warn 또는 deny
#
[lints.clippy]
# ── 구조적 경고: 리팩토링에서 해결 예정 ──
too_many_arguments = "allow"        # Phase 1-3 완료 후 warn
type_complexity = "allow"           # Phase 1-3 완료 후 warn
cognitive_complexity = "allow"      # Phase 4 완료 후 warn
needless_pass_by_value = "allow"    # Phase 4 완료 후 warn
# ── 코드 스타일: 리팩토링 과정에서 점진 수정 ──
redundant_closure = "allow"         # 각 파일 분할 시 수정
field_reassign_with_default = "allow"  # 각 파일 분할 시 수정
manual_div_ceil = "allow"           # 각 파일 분할 시 수정
manual_range_contains = "allow"     # 각 파일 분할 시 수정
unnecessary_cast = "allow"          # 각 파일 분할 시 수정
collapsible_if = "allow"            # 각 파일 분할 시 수정
unnecessary_map_or = "allow"         # 각 파일 분할 시 수정
needless_borrow = "allow"           # 각 파일 분할 시 수정
if_same_then_else = "allow"         # 각 파일 분할 시 수정
needless_range_loop = "allow"       # 각 파일 분할 시 수정
option_map_or_none = "allow"        # 각 파일 분할 시 수정
bool_comparison = "allow"           # 각 파일 분할 시 수정
collapsible_else_if = "allow"       # 각 파일 분할 시 수정
collapsible_match = "allow"         # 각 파일 분할 시 수정
needless_borrows_for_generic_args = "allow"
vec_init_then_push = "allow"
single_match = "allow"
match_like_matches_macro = "allow"
useless_format = "allow"
derivable_impls = "allow"
redundant_pattern_matching = "allow"
iter_cloned_collect = "allow"
manual_clamp = "allow"
manual_saturating_arithmetic = "allow"
manual_rem_euclid = "allow"
manual_strip = "allow"
manual_is_ascii_check = "allow"
clone_on_copy = "allow"
explicit_into_iter_loop = "allow"
needless_lifetimes = "allow"
filter_map_identity = "allow"
ptr_arg = "allow"
should_implement_trait = "allow"
new_without_default = "allow"
assign_op_pattern = "allow"
blocks_in_conditions = "allow"
enum_variant_names = "allow"
repeat_vec_with_capacity = "allow"
manual_repeat_n = "allow"
useless_conversion = "allow"
same_item_push = "allow"
nonminimal_bool = "allow"
implicit_saturating_sub = "allow"
unused_enumerate_index = "allow"
unnecessary_filter_map = "allow"
manual_pattern_char_comparison = "allow"
# ── 새 코드 품질 게이팅: 즉시 적용 ──
large_enum_variant = "warn"

[lints.rust]
# dead_code, unused 계열 — 리팩토링 과정에서 정리
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
unused_mut = "allow"
unused_assignments = "allow"
unused_macros = "allow"
# wmf 모듈의 tracing feature cfg 경고 억제
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("tracing", "svg"))'] }

# 재사용 가능한 개발자 도구만 명시적으로 Cargo target에 등록한다.
# 이슈별 일회성 probe는 mydocs/tech/investigations/issue-*/probes에 보존하며
# 기본 build/clippy 대상으로 다시 끌어오지 않는다.
[[example]]
name = "audit_image_magic"
path = "tools/diagnostics/audit_image_magic.rs"

[[example]]
name = "audit_studio_image_parity"
path = "tools/diagnostics/audit_studio_image_parity.rs"

[[example]]
