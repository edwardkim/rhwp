[package]
rust-version = "1.93.1"
publish = ["crates-io"]
name = "rhwp"
version = "0.9.0"
edition = "2021"
description = "HWP/HWPX document engine for Rust applications, WebAssembly, and CLI automation"
license = "MIT"
repository = "https://github.com/edwardkim/rhwp"
readme = "packaging/crates-io/README_PACKAGE.md"
autotests = false
autoexamples = false
autobins = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/src/**",
    "/LICENSE",
    "/README.md",
    "/README_EN.md",
    "/THIRD_PARTY_LICENSES.md",
    "/llms.txt",
    "/saved/blank2010.hwp",
    "/assets/fonts/boxed-digit-metrics.json",
    "/assets/fonts/LatinModernMath-VariableOutline-subset.otf",
    "/assets/fonts/MANIFEST-RHWP-LMM-VariableOutline.txt",
    "/assets/fonts/licenses/**",
    "/data/font-metrics/nimbus-roman/**",
    "/mydocs/manual/agent_knowledge_map.md",
    "/mydocs/manual/agent_troubleshooting_guide.md",
    "/mydocs/manual/gym_optional_tool.md",
    "/mydocs/manual/recipes/01_fill_form_and_submit.md",
    "/mydocs/manual/recipes/02_table_csv_roundtrip.md",
    "/mydocs/manual/recipes/03_redact_before_sharing.md",
    "/mydocs/manual/recipes/04_safety_check_untrusted_doc.md",
    "/mydocs/manual/recipes/05_mail_merge_batch_fill.md",
    "/mydocs/manual/recipes/06_visual_regression_before_after.md",
    "/mydocs/tech/agent_roadmap/atlas_r1_r200.md",
    "/packaging/crates-io/README_PACKAGE.md",
    "/packaging/crates-io/examples/pdf_isolation_host.rs"
]

[workspace]
exclude = ["vendor/rhwp-pdf-import-backend", "vendor/rhwp-qcms", "vendor/rhwp-zune-jpeg", "vendor/rhwp-jpeg-decoder", "vendor/rhwp-jpeg-encoder", "vendor/svg2pdf", "vendor/rhwp-codec-resource", "vendor/rhwp-hayro-jbig2", "vendor/rhwp-hayro-jpeg2000", "vendor/rhwp-hayro-ccitt"]
members = ["crates/*", "tools/rhwp-subsecond", "bindings/Native", "tools/batch-convert", "tools/llm_verifier/verdict_protocol", "tools/llm_verifier/claim_bind", "tools/llm_verifier/criteria_decomp"]
default-members = [".", "crates/*"]
resolver = "2"

[lib]
# rhwp 는 Rust 라이브러리가 먼저다 — CLI 두 개, `bindings/Native`, `tools/*` 가 전부 rlib 으로
# 링크한다. 브라우저용 cdylib 이 그 다음이다. 이 순서는 Dioxus CLI 가 핫패치 인자를 잡을 때 첫
# crate type 으로 분류하는 규칙과도 맞아떨어진다 — 뒤집으면 `--hot-patch` 가 조용히 안 먹는다.
# (버전은 여기 적지 않는다. 유일한 사본은 아래 `subsecond` 의 정확 핀이다 — #4580.)
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rhwp"
path = "src/main.rs"
# CLI 는 `wasm_api::HwpDocument` 를 쓴다 — 아래 `wasm-api` feature 참고.
required-features = ["wasm-api"]

[[bin]]
name = "rhwp-q"
path = "src/bin/rhwp-q/main.rs"

[[bin]]
name = "rhwp-agent"
path = "src/bin/rhwp-agent/main.rs"

[[bin]]
name = "font-metric-gen"
path = "src/tools/font_metric_gen.rs"
required-features = ["dev-tools"]

