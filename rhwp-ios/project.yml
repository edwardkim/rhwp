name: AlHangeul
options:
  bundleIdPrefix: com.edwardkim
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  AlHangeul:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    resources:
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwardkim.alhangeul
        PRODUCT_NAME: 알한글
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/rhwp-Bridging-Header.h
        DEVELOPMENT_TEAM: "FSFG3AQ4KZ"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        CODE_SIGN_STYLE: "Automatic"
      configs:
        Debug:
          "OTHER_LDFLAGS[sdk=iphonesimulator*]":
            - "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release/librhwp.a"
            - "-framework"
            - "Security"
            - "-framework"
            - "CoreFoundation"
          "OTHER_LDFLAGS[sdk=iphoneos*]":
            - "$(PROJECT_DIR)/../target/aarch64-apple-ios/release/librhwp.a"
            - "-framework"
            - "Security"
            - "-framework"
            - "CoreFoundation"
        Release:
          "OTHER_LDFLAGS[sdk=iphonesimulator*]":
            - "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release/librhwp.a"
            - "-framework"
            - "Security"
            - "-framework"
            - "CoreFoundation"
          "OTHER_LDFLAGS[sdk=iphoneos*]":
            - "$(PROJECT_DIR)/../target/aarch64-apple-ios/release/librhwp.a"
            - "-framework"
            - "Security"
            - "-framework"
            - "CoreFoundation"
