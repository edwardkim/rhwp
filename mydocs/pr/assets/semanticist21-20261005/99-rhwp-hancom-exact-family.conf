<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer the installed exact Hancom face over the older HCR substitution. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>한컴바탕</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Haansoft Batang</string></edit>
  </match>
</fontconfig>
