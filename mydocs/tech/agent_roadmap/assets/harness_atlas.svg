  <text x="50" y="534" fill="#64748b" font-size="10">R81·R82·R84 머지 · R83 PR #4330 (검토 중)</text>

  <rect x="490" y="450" width="440" height="90" rx="10" fill="#33230f" stroke="#f59e0b"/>
