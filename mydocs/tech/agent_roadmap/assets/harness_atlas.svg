  <text x="510" y="498" fill="#e2e8f0" font-size="12">R100 공개 실험 제안 — PR #4356 검토 중 (#4355)</text>
  <text x="510" y="518" fill="#e2e8f0" font-size="12">R101–R200 지평 — 의미론 · 증명 · 경제 · 보편 엔진 · 문명 보존</text>
  <text x="510" y="534" fill="#64748b" font-size="10">#4356 · horizon_r101_r200.md · 전도 #4368</text>

  <line x1="250" y1="414" x2="250" y2="446" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="710" y1="414" x2="710" y2="446" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <text x="480" y="586" text-anchor="middle" fill="#64748b" font-size="11">결정론이 원칙이다 — 자기서술·검색·explain 에 모델이 끼지 않고, 모든 변이는 해시로 자기검증한다</text>
  <text x="480" y="604" text-anchor="middle" fill="#475569" font-size="10">rhwp agent-native harness · 2026-08 · mydocs/tech/agent_roadmap</text>
</svg>
