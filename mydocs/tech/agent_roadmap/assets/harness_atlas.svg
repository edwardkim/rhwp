<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','Malgun Gothic',sans-serif">
  <!-- [#4383] rhwp 에이전트 하네스 전도 — 손제작 결정론 SVG (외부 자산 0) -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
