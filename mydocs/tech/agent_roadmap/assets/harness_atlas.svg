  <line x1="435" y1="132" x2="471" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="690" y1="132" x2="726" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

