  <text x="50" y="408" fill="#64748b" font-size="10">PR #4332 #4337 #4339 #4345 #4350 #4372 #4373 #4376 #4342 (검토 중)</text>
  <line x1="480" y1="282" x2="480" y2="314" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

