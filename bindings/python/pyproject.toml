[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "rhwp"
version = "0.1.0"
description = "HWP/HWPX 문서 엔진 rhwp 의 파이썬 바인딩 — CLI --json 봉투와 mcp-serve 세션 계약의 재포장"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["hwp", "hwpx", "hancom", "document", "korean", "office"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Korean",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Topic :: Office/Business",
  "Topic :: Text Processing",
]
# 런타임 의존성 없음 — 표준 라이브러리만 쓴다.
# 바인딩이 무거우면 "재포장"이 아니라 새 표면이 된다.
dependencies = []

[project.optional-dependencies]
# Python 3.8 지원을 검증할 수 있는 마지막 mypy 계열과, 이 코드베이스가 검증한
# ruff 규칙 집합을 고정한다. 상한이 없으면 개발 도구의 정책 변경이 제품 CI를 바꾼다.
dev = ["pytest>=7.0", "mypy>=1.0,<1.11", "ruff>=0.1,<0.12"]

[project.urls]
Homepage = "https://github.com/edwardkim/rhwp"
Repository = "https://github.com/edwardkim/rhwp"
Issues = "https://github.com/edwardkim/rhwp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rhwp"]

# [#4336 R63] 릴리스 파이프라인이 환경변수(RHWP_WHEEL_BUNDLE·RHWP_WHEEL_TAG)를
# 줄 때만 rhwp/_bin/ 에 바이너리를 동봉하고 플랫폼 태그를 단다. 환경변수가
# 없으면 훅은 아무것도 하지 않는다(로컬 -e 설치·sdist 는 종전과 동일).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 바이너리가 없는 환경에서도 단위 테스트는 돌아야 한다 — 통합만 건너뛴다.
markers = ["integration: 실제 rhwp 바이너리가 필요한 테스트"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
strict = true
warn_unreachable = true
