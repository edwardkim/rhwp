name: rhwp_native_reference
description: Browser-free Flutter reference host for the rhwp native worker ABI.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      linux:
        pluginClass: RhwpTexturePlugin
      macos:
        pluginClass: RhwpMetalPlugin
      windows:
        pluginClass: RhwpD3dPlugin
