[package]
name = "rhwp-native-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rhwp_native_ffi"
crate-type = ["cdylib", "staticlib"]

[features]
default = []
native-skia = ["rhwp_core/native-skia"]
native-skia-gl = ["native-skia", "rhwp_core/native-skia-gl"]
native-skia-metal = ["native-skia", "rhwp_core/native-skia-metal"]
native-skia-d3d = ["native-skia", "rhwp_core/native-skia-d3d"]

[dependencies]
rhwp_core = { package = "rhwp", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
