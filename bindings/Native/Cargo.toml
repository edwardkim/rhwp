[package]
name = "rhwp-native-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rhwp_native_ffi"
crate-type = ["cdylib", "staticlib"]

[features]
default = []
native-skia = ["rhwp_core/native-skia"]

[dependencies]
rhwp_core = { package = "rhwp", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
